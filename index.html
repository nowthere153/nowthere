  // 기상청 관측 시각이 얼마나 지난 것인지 계산한다.
  // 초단기실황은 매시 정시 관측값을 40분에 공개하므로 최대 1시간 40분 전 상태일 수
  // 있다. 화면의 영상과 어긋나 보이는 일이 실제로 있었으므로(2026-08 실사용), 몇 시
  // 관측인지만 흐리게 적어두지 말고 "얼마나 지난 값인지"를 분명히 말한다.
  function observationAgeText(baseDate, baseTime) {
    if (!baseDate || !baseTime || baseDate.length < 8) return '';
    var y = +baseDate.slice(0, 4), mo = +baseDate.slice(4, 6), d = +baseDate.slice(6, 8);
    var h = +baseTime.slice(0, 2);
    var baseMs = Date.UTC(y, mo - 1, d, h, 0, 0);          // 한국시각 값을 UTC 자리에 그대로 둠
    var nowMs = Date.now() + 9 * 60 * 60 * 1000;           // 지금을 같은 방식으로 맞춤
    var min = Math.round((nowMs - baseMs) / 60000);
    if (min < 0 || min > 24 * 60) return '';
    if (min < 60) return min + '분 전 관측';
    return Math.floor(min / 60) + '시간 ' + (min % 60) + '분 전 관측';
  }

  function fillWeatherLine(id, lat, lng) {
    var el = document.getElementById(id);
    if (!el) return;
    if (!CCTV_PROXY_BASE_URL || lat == null || lng == null) { el.style.display = 'none'; return; }
    fetch(CCTV_PROXY_BASE_URL + '/api/weather-now?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng))
      .then(function(res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function(w) {
        var el2 = document.getElementById(id);
        if (!el2) return;
        var parts = [];
        if (w.raining) {
          parts.push('☔ 지금 ' + (w.ptyLabel || '강수') + (w.rain1h ? ' (1시간 ' + w.rain1h + 'mm)' : ''));
        } else {
          parts.push('☀️ 지금 비 안 옴');
        }
        if (w.temp != null) parts.push(w.temp + '℃');
        if (w.humidity != null) parts.push('습도 ' + w.humidity + '%');
        var hh = (w.baseTime || '').slice(0, 2);
        var age = observationAgeText(w.baseDate, w.baseTime);
        var stamp = hh ? '기상청 ' + hh + '시 관측' + (age ? ' · ' + age : '') : '';
        var prominent = el2.tagName === 'DIV';
        // 기상청 CCTV 영상분석(ID89). 전국 703개 도로 지점에서만 온다.
        // ⚠️ 이건 우리 판정이 아니다 - 출처를 반드시 밝히고, 관측 시각을 함께 적는다.
        // 우리는 "지금 화면"을 보여줄 뿐이고 판단은 사용자가 한다. 시제를 정직하게
        // 표기하는 것만으로 실시간성이라는 차별점은 저절로 드러난다(2026-08 방침).
        var roadHtml = '';
        if (w.road && w.road.weatherNm) {
          var rw = w.road.weatherNm;
          var rainish = /비|눈|안개/.test(rw);
          var rAge = observationAgeText(w.road.baseDate, w.road.baseTime);
          var rt = (w.road.baseTime || '');
          var rClock = rt.length >= 4 ? rt.slice(0, 2) + ':' + rt.slice(2, 4) : '';
          roadHtml = '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #e2e8f0;' +
            'font-size:12.5px;color:' + (rainish ? '#2563eb' : '#475569') + ';">' +
            '🎥 기상청 영상분석: <b>' + rw + '</b>' +
            '<span style="color:#94a3b8;"> · ' + (rClock ? rClock : '') +
            (rAge ? ' (' + rAge + ')' : '') + '</span></div>';
        }
        if (prominent) {
          el2.innerHTML =
            '<div style="font-size:14.5px;font-weight:700;color:' + (w.raining ? '#2563eb' : '#334155') + ';">' +
            parts.join(' · ') + '</div>' +
            (stamp ? '<div style="margin-top:3px;font-size:11.5px;color:#94a3b8;">' + stamp +
              ' · 정시 관측값이라 화면과 다를 수 있습니다</div>' : '') +
            roadHtml;
        } else {
          el2.innerHTML = parts.join(' · ') +
            (stamp ? ' <span style="color:#cbd5e1;">· ' + stamp + '</span>' : '') + roadHtml;
          el2.style.color = w.raining ? '#2563eb' : '#64748b';
        }
      })
      .catch(function(err) {
        console.error('[날씨] 실황 조회 실패:', err);
        var el3 = document.getElementById(id);
        if (el3) el3.style.display = 'none'; // 실패해도 화면을 어지럽히지 않음
      });
  }

  // 콘텐츠 타입에 맞는 임베드 HTML 생성 (유튜브 iframe / 인스타그램 공식 블록쿼트)
  // ⚠️ 2026-08: 쇼츠는 세로 영상이라 기존 16:9(height 315) 틀에 넣으면 영상이 가운데
  // 조그맣게 들어가고 좌우가 검게 남음. spot.vertical이 있으면 9:16 세로 틀로 그린다.
  // 예전에 등록된 스팟에는 vertical 값이 없으므로 자동으로 기존 16:9로 동작함.
  function buildEmbedHtml(spot) {
    if (spot.type === 'instagram') {
      return '<blockquote class="instagram-media" data-instgrm-permalink="' + spot.permalink +
        '" data-instgrm-version="14" style="margin:0;width:100%;min-width:280px;"></blockquote>';
    }
    if (spot.vertical) {
      return '<iframe src="https://www.youtube.com/embed/' + spot.videoId +
        '" style="display:block;margin:0 auto;width:100%;max-width:300px;aspect-ratio:9/16;border:0;border-radius:10px;" ' +
        'allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>';
    }
    return '<iframe width="100%" height="315" src="https://www.youtube.com/embed/' + spot.videoId +
      '" frameborder="0" allowfullscreen></iframe>';
  }

  // 등록시각을 "3분 전 / 2시간 전 / 1일 전"처럼 상대적으로 표시 (현장 제보의 신선도 강조용)
  function timeAgoLabel(ms) {
    if (!ms) return '';
    var diff = Date.now() - ms;
    if (diff < 0) diff = 0;
    var min = Math.floor(diff / 60000);
    if (min < 1) return '방금 전';
    if (min < 60) return min + '분 전';
    var hr = Math.floor(min / 60);
    if (hr < 24) return hr + '시간 전';
    var day = Math.floor(hr / 24);
    return day + '일 전';
  }

  // 핀별 고유 공유 링크 생성 (예: index.html?spot=abc123) — 매물 페이지 등에 붙여넣으면
  // 접속 즉시 지도가 해당 스팟으로 이동하고 정보창이 자동으로 열립니다.
  function getSpotShareUrl(spot) {
    var base = location.origin + location.pathname;
    return base + '?spot=' + encodeURIComponent(spot.id);
  }

  function fallbackCopy(text) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try {
      document.execCommand('copy');
      showStatus('🔗 공유 링크가 복사되었습니다.');
    } catch (e) {
      showStatus('복사에 실패했습니다. 주소창에서 직접 복사해주세요: ' + text);
    }
    document.body.removeChild(ta);
  }

  function copyToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function() {
        showStatus('🔗 공유 링크가 복사되었습니다. 매물 페이지 등에 붙여넣어보세요.');
      }).catch(function() {
        fallbackCopy(text);
      });
    } else {
      fallbackCopy(text);
    }
  }

  // ================================================================
  // 계측 (ID99·ID100 · IV-11·IV-12, 2026-09)
  // ----------------------------------------------------------------
  // 왜 세는가. 두 가지다.
  //  ① 올린 사람에게 돌아가는 것이 있어야 한다. 지금은 기록을 올려도 아무 일도 일어나지
  //     않는다. 조회수는 화려한 보상은 아니지만 최소한의 산출물이다.
  //  ② 노출을 팔려면 노출을 세어야 한다. "몇 명이 봤는지 모릅니다"로는 아무것도 팔 수 없다.
  // 무엇을 세지 않는가. 개인을 식별하는 것은 아무것도 세지 않는다 - IP·기기식별값·이메일
  // 어느 것도 저장하지 않고, 유입도 도메인만 남긴다. 임의 색인값만으로 이용자를 구분하는
  // 지금 구조를 유지하는 것이 위치정보법상 우리 지위의 근거이기도 하다(DC-22).
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + ('-') + ('0' + d.getDate()).slice(-2);
  }
  // 같은 브라우저가 같은 것을 하루에 여러 번 세지 않도록 막는다. 서버 쓰기 비용도 아끼고,
  // 새로고침 한 번에 숫자가 뛰는 것을 막아 수치를 믿을 수 있게 만든다.
  // ⚠️ 2026-09(배포2): 등록한 문서 id를 이 브라우저에 적어둔다.
  // 익명 UID는 재발급될 수 있고(실제로 등록분이 UID 두 개로 쪼개져 있었다), UID를 잃으면
  // 서버가 그 기록을 내주지 않아 무엇을 옮겨야 할지조차 알 수 없게 된다. id 목록이 있으면
  // 나중에 소유자를 잇거나 옮길 때 문서를 직접 지정할 수 있다. 서버에 새로 쌓는 것이
  // 아니라 그 브라우저 안에만 적어두는 것이라 수집이 아니다.
  var MY_DOCS_KEY = 'nt_my_docs';
  function rememberMyDoc(id) {
    try {
      var a = JSON.parse(localStorage.getItem(MY_DOCS_KEY) || '[]');
      if (a.indexOf(id) === -1) { a.push(id); localStorage.setItem(MY_DOCS_KEY, JSON.stringify(a)); }
    } catch (e) {}
  }
  function forgetMyDoc(id) {
    try {
      var a = JSON.parse(localStorage.getItem(MY_DOCS_KEY) || '[]');
      localStorage.setItem(MY_DOCS_KEY, JSON.stringify(a.filter(function(x) { return x !== id; })));
    } catch (e) {}
  }
  function myDocIds() {
    try { return JSON.parse(localStorage.getItem(MY_DOCS_KEY) || '[]'); } catch (e) { return []; }
  }

  function onceADay(key) {
    var k = 'nt_once_' + key + '_' + todayKey();
    try {
      if (localStorage.getItem(k)) return false;
      localStorage.setItem(k, '1');
      return true;
    } catch (e) { return true; } // 저장소를 못 쓰는 브라우저면 그냥 센다
    }
  function bumpStat(fields) {
    try {
      var inc = firebase.firestore.FieldValue.increment;
      var payload = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      Object.keys(fields).forEach(function(k) { payload[k] = inc(fields[k]); });
      db.collection('stats').doc(todayKey()).set(payload, { merge: true }).catch(function(e) {
        console.warn('[NowThere] 집계 실패(무시하고 계속):', e && e.code);
      });
    } catch (e) { /* 집계는 실패해도 서비스에 영향을 주지 않는다 */ }
  }
  // 유입 도메인만 남긴다. 전체 주소는 남기지 않는다 - 유튜브가 어차피 도메인까지만
  // 넘겨주기도 하고, 개인이 어디서 왔는지를 상세히 쌓을 이유도 없다.
  // 영상 단위로 알고 싶으면 링크에 ?from=yt&v=이름 을 붙여 올리면 된다.
  function referrerKey() {
    try {
      var p = new URLSearchParams(location.search);
      if (p.get('from')) return 'tag:' + String(p.get('from')).slice(0, 24).replace(/[.#$/[\]]/g, '');
      if (!document.referrer) return 'direct';
      var h = new URL(document.referrer).hostname.replace(/^www\./, '');
      if (h === location.hostname) return 'internal';
      return h.replace(/[.#$/[\]]/g, '_').slice(0, 40);
    } catch (e) { return 'unknown'; }
  }
  function recordVisit() {
    if (!onceADay('visit')) return;
    var isNew = false;
    try {
      if (!localStorage.getItem('nt_seen')) { localStorage.setItem('nt_seen', '1'); isNew = true; }
    } catch (e) {}
    var f = { visits: 1 };
    if (isNew) f.newVisitors = 1;
    f['referrers.' + referrerKey()] = 1;
    bumpStat(f);
  }

  // 스팟 클릭시 모달 열기 (타입에 따라 인스타그램이면 임베드 스크립트 재실행) + 권한별 삭제/신고 버튼
  function openSpotModal(spot) {
    if (spot.id) {
      bumpStat({ spotOpens: 1 });
      // 자기 기록을 자기가 열어본 것은 세지 않는다. 그러면 숫자가 남이 본 횟수를 뜻하게 된다.
      if (!isMine(spot.ownerId) && onceADay('sv_' + spot.id)) {
        db.collection('spots').doc(spot.id)
          .update({ viewCount: firebase.firestore.FieldValue.increment(1) })
          .catch(function(e) { console.warn('[NowThere] 조회수 기록 실패(무시):', e && e.code); });
      }
    }
    var canDelete = isAdmin || isMine(spot.ownerId);
    var canReport = !!spot.id; // Firestore에 저장된 공유 스팟만 신고 가능 (샘플 데이터 제외)
    var body = '';
    if (spot.category === 'scene') {
      var agoLabel = spot.createdAt ? timeAgoLabel(spot.createdAt) : '';
      body += '<span style="display:inline-block;margin-bottom:8px;margin-right:6px;padding:4px 10px;border-radius:12px;background:#fff1f2;color:#c2410c;font-size:12px;font-weight:700;">🚨 현장 제보' + (agoLabel ? ' · ' + agoLabel + ' 등록' : '') + '</span>';
    } else if (spot.category) {
      body += '<span style="display:inline-block;margin-bottom:8px;margin-right:6px;padding:4px 10px;border-radius:12px;background:#f2f2f2;font-size:12px;">' + categoryLabel(spot.category) + '</span>';
    }
    // 공개범위와 조회수는 올린 사람에게만 보여준다 (IV-10·IV-11)
    if (spot.id && isMine(spot.ownerId)) {
      var visKey = spot.visibility || VISIBILITY.PUBLIC;
      var visIcon = visKey === VISIBILITY.PUBLIC ? '🌐' : (visKey === VISIBILITY.PRIVATE ? '🔒' : '📦');
      body += '<span style="display:inline-block;margin-bottom:8px;margin-right:6px;padding:4px 10px;border-radius:12px;background:#f1f5f9;color:#475569;font-size:12px;">' +
        visIcon + ' ' + (VISIBILITY_LABEL[visKey] || visKey) + '</span>' +
        '<span style="display:inline-block;margin-bottom:8px;margin-right:6px;padding:4px 10px;border-radius:12px;background:#f1f5f9;color:#475569;font-size:12px;">👁 ' +
        (spot.viewCount || 0) + '명이 열어봤어요</span>';
    }
    if (spot.journey) {
      body += '<span style="display:inline-block;margin-bottom:8px;padding:4px 10px;border-radius:12px;background:#eef2ff;color:#4338ca;font-size:12px;">🧭 ' + spot.journey + '</span>';
    }
    if (spot.category === 'view' && spot.id) {
      body += '<p style="margin-bottom:8px;padding:8px 10px;border-radius:8px;background:#f0f9ff;color:#075985;font-size:12.5px;">🏙️ 조망 인증 링크 — 아래 "공유 링크 복사"를 눌러 매물 페이지 등에 붙여넣으면 이 뷰를 그대로 보여줄 수 있어요.</p>';
    }
    body += buildEmbedHtml(spot);
    body += weatherLinePlaceholder('spotWeatherLine');
    if (spot.journey) {
      body += '<button id="viewJourneyBtn" style="margin-top:10px;padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#4338ca;cursor:pointer;font-size:13px;">🧭 이 여정 전체보기</button>';
    }

    if (isAdmin && spot.reportCount) {
      body += '<p style="margin-top:10px;font-size:12px;color:#c2410c;">🚩 신고 ' + spot.reportCount + '건 누적 (관리자만 표시)</p>';
    }

    var btnRow = '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;">';
    if (spot.id) {
      btnRow += '<button id="shareSpotBtn" style="padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#2563eb;cursor:pointer;font-size:13px;">🔗 공유 링크 복사</button>';
    }
    // ⚠️ 2026-09 추가: 고치기·공개전환을 이 창에도 둔다.
    // 처음에는 "내 기록" 목록에만 넣었는데, 사용자는 지도에서 그 기록을 보고 있는 중에
    // 고치고 싶어 한다. 보고 있는 자리에서 못 하고 다른 화면으로 가라는 것은 앞뒤가 맞지 않는다.
    if (canDelete && spot.id) {  // 고칠 수 있는 조건은 지울 수 있는 조건과 같다(본인 또는 관리자)
      btnRow += '<button id="editSpotBtn" style="padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#4338ca;cursor:pointer;font-size:13px;">✏️ 고치기</button>';
      btnRow += '<button id="visSpotBtn" style="padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#4338ca;cursor:pointer;font-size:13px;">' +
        (spot.visibility === VISIBILITY.PUBLIC ? '🔒 나만 보기로' : '🌐 공개로') + '</button>';
    }
    if (canDelete) {
      btnRow += '<button id="deleteSpotBtn" style="padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#888;cursor:pointer;font-size:13px;">🗑 이 스팟 삭제' + (isAdmin && !isMine(spot.ownerId) ? ' (관리자)' : '') + '</button>';
    }
    if (canReport) {
      btnRow += '<button id="reportSpotBtn" style="padding:8px 14px;border-radius:8px;border:1px solid #ddd;background:white;color:#c2410c;cursor:pointer;font-size:13px;">🚩 신고</button>';
    }
    btnRow += '</div><div id="reportReasons" style="display:none;margin-top:8px;font-size:13px;"></div>';
    body += btnRow;

    openModal(spot.name, body);
    fillWeatherLine('spotWeatherLine', spot.lat, spot.lng);
    if (spot.type === 'instagram' && window.instgrm) {
      window.instgrm.Embeds.process();
    }
    if (spot.journey) {
      document.getElementById('viewJourneyBtn').addEventListener('click', function() {
        var groups = getAllJourneyGroups(liveSpots);
        var key = (spot.ownerId || 'unknown') + '|' + normalizeJourney(spot.journey);
        var g = groups[key];
        if (g) openJourneyModal(g.name, g.spots);
      });
    }

    if (spot.id) {
      document.getElementById('shareSpotBtn').addEventListener('click', function() {
        copyToClipboard(getSpotShareUrl(spot));
      });
    }

    var edBtn = document.getElementById('editSpotBtn');
    if (edBtn) edBtn.addEventListener('click', function() { openEditSpotForm(spot); });

    var vsBtn = document.getElementById('visSpotBtn');
    if (vsBtn) vsBtn.addEventListener('click', function() {
      var next = spot.visibility === VISIBILITY.PUBLIC ? VISIBILITY.PRIVATE : VISIBILITY.PUBLIC;
      vsBtn.disabled = true;
      db.collection('spots').doc(spot.id).update({ visibility: next }).then(function() {
        spot.visibility = next;
        showStatus(next === VISIBILITY.PUBLIC ? '🌐 공개로 바꿨습니다.' : '🔒 나만 보기로 바꿨습니다.');
        setTimeout(function() { openSpotModal(spot); }, 350); // 구독 갱신 후 창을 다시 그림
      }).catch(function(e) {
        vsBtn.disabled = false;
        // 예전 방식(u_...)으로 등록된 기록은 서버가 소유자를 확인할 수 없어 거부된다.
        // 그 경우 원인을 정확히 알려준다 - "실패했습니다"만으로는 무엇을 해야 할지 알 수 없다.
        alert(String(spot.ownerId || '').indexOf('u_') === 0
          ? '이 기록은 예전 방식으로 등록되어 서버가 소유자를 확인하지 못합니다.\n관리자 콘솔의 "소유자 통합"을 한 번 실행해주세요.'
          : '바꾸지 못했습니다: ' + e.message);
      });
    });

    if (canDelete) {
      document.getElementById('deleteSpotBtn').addEventListener('click', function() {
        if (!confirm('"' + spot.name + '"을(를) 삭제하시겠습니까?')) return;
        if (spot.id) {
          // Firestore에 저장된 공유 데이터 → 서버에서 삭제 (모두에게 반영됨)
          db.collection('spots').doc(spot.id).delete().catch(function(err) {
            showStatus('삭제 실패: ' + err.message);
          });
        } else {
          // 샘플(고정 데모) 데이터 → 로컬에서만 제거
          mapRemoveMarker(spot.marker);
          var idx = sampleSpots.indexOf(spot);
          if (idx > -1) sampleSpots.splice(idx, 1);
        }
        document.getElementById('modal').classList.remove('show');
        document.getElementById('modalBody').innerHTML = '';
        showStatus('🗑 삭제되었습니다.');
      });
    }

    if (canReport) {
      document.getElementById('reportSpotBtn').addEventListener('click', function() {
        var box = document.getElementById('reportReasons');
        box.style.display = 'block';
        box.innerHTML =
          '<p style="color:#666;margin-bottom:6px;">신고 사유를 선택해주세요</p>' +
          '<div style="display:flex;gap:6px;flex-wrap:wrap;">' +
          ['얼굴노출', '풍경아님', '위치오류', '무관영상', '기타'].map(function(reason) {
            return '<button class="reportReasonBtn" data-reason="' + reason + '" style="padding:6px 10px;border-radius:6px;border:1px solid #ddd;background:#f9f9f9;cursor:pointer;font-size:12px;">' + reason + '</button>';
          }).join('') + '</div>';

        box.querySelectorAll('.reportReasonBtn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            submitReport(spot, btn.getAttribute('data-reason'));
          });
        });
      });
    }
  }

  // 신고 접수 (같은 브라우저 중복신고 방지, 3건 누적시 자동 숨김 - 관리자 제외)
  function submitReport(spot, reason) {
    var reportedKey = 'gogibiwa_reported_ids';
    var reported = JSON.parse(localStorage.getItem(reportedKey) || '[]');
    if (reported.indexOf(spot.id) > -1) {
      showStatus('이미 신고하신 스팟입니다.');
      return;
    }
    db.collection('spots').doc(spot.id).update({
      reportCount: firebase.firestore.FieldValue.increment(1)
    }).then(function() {
      reported.push(spot.id);
      localStorage.setItem(reportedKey, JSON.stringify(reported));
      document.getElementById('modal').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
      showStatus('🚩 신고(' + reason + ')가 접수되었습니다. 검토 후 조치됩니다.');
    }).catch(function(err) {
      showStatus('신고 처리 실패: ' + err.message);
    });
  }

  // 샘플 스팟들을 지도에 핀으로 항상 표시 (타입별 색상 구분)
  function addLiveSpotPins() {
    sampleSpots.forEach(function(spot) {
      var marker = mapCreateMarker(spot.lat, spot.lng, {
        color: spot.type === 'instagram' ? 'blue' : 'red',
        onClick: function() { openSpotModal(spot); }
      });
      spot.marker = marker;
      markers.push(marker);
    });
  }
  addLiveSpotPins();
  renderFilterBar();
  applyFilter();

  // Firestore 실시간 구독: 누군가 등록/삭제/신고하면 모든 접속자의 화면에 즉시 반영됨
  var sharedMarkers = [];
  var REPORT_HIDE_THRESHOLD = 3; // 이 값 이상 신고 누적시 일반 사용자에게는 숨김 (관리자는 계속 보임)

  // 공유 링크(?spot=아이디)로 접속한 경우, 데이터 로드 후 해당 스팟으로 자동 이동 + 정보창 오픈
  function getUrlSpotId() {
    try {
      return new URLSearchParams(location.search).get('spot');
    } catch (e) {
      return null;
    }
  }
  var pendingShareId = getUrlSpotId();
  var pendingShareResolved = !pendingShareId;

  function resolvePendingShareSpot() {
    if (pendingShareResolved) return;
    var target = sharedSpots.filter(function(s) { return s.id === pendingShareId; })[0];
    pendingShareResolved = true;
    if (target) {
      mapSetCenter(target.lat, target.lng);
      mapSetLevel(3);
      openSpotModal(target);
      showStatus('🔗 공유된 스팟을 불러왔습니다: ' + target.name);
    } else {
      showStatus('⚠️ 공유된 스팟을 찾을 수 없습니다. (삭제되었거나 비공개 처리되었을 수 있습니다)');
    }
    // 주소창을 깔끔하게 정리 (뒤로가기/새로고침 시 재오픈 방지)
    if (window.history && window.history.replaceState) {
      window.history.replaceState(null, '', location.pathname);
    }
  }

  // ================================================================
  // 공개범위 (ID97 · IV-10 · IV-13, 2026-09)
  // ----------------------------------------------------------------
  // 예전에는 db.collection('spots')를 통째로 구독했다. 그때는 모든 기록이 공개였으므로
  // 문제가 없었지만, 나만 보기가 생기면 그 방식으로는 남의 비공개 기록까지 브라우저로
  // 내려온다. 화면에서 거르는 것은 보호가 아니다 - 소스가 공개된 정적 호스팅에서는
  // 브라우저의 판정을 누구나 우회할 수 있다(이 파일 985행, firestore.rules 머리말과 같은 원칙).
  //
  // 그래서 서버 규칙이 "공개이거나 내 것"만 읽히도록 막고, 클라이언트는 그 규칙을
  // 통과할 수 있는 두 개의 좁은 질의로 나눠서 구독한 뒤 합친다. Firestore는 한 질의에서
  // "공개 OR 내 것"을 표현할 수 없기 때문이다(OR은 같은 필드에만 쓸 수 있다).
  //
  // ⚠️ 기존 데이터: visibility 필드가 없는 문서는 where('visibility','==','public')에
  // 잡히지 않는다(없는 필드는 어떤 값과도 일치하지 않는다). 그래서 관리자 콘솔에
  // 일회성 채우기 버튼을 두었다 - 그것을 한 번 돌리기 전까지 기존 기록은 소유자와
  // 관리자에게만 보인다. 소급해서 비공개로 만드는 것이 아니라, 공개로 명시하는 작업이다.
  var publicDocs = {};   // 공개 질의 결과   (id -> 원본 데이터)
  var mineDocs = {};     // 내 것 질의 결과
  var unsubPublic = null, unsubMine = null;
  var subscribedUid = null;

  function snapshotToMap(querySnapshot) {
    var m = {};
    querySnapshot.forEach(function(docSnap) { m[docSnap.id] = docSnap.data(); });
    return m;
  }

  function toSpot(id, d) {
    return {
      id: id, name: d.name, lat: d.lat, lng: d.lng,
      type: d.type, videoId: d.videoId, permalink: d.permalink, ownerId: d.ownerId,
      reportCount: d.reportCount || 0, category: d.category || null,
      journey: d.journey || null,
      // 필드가 없는 기존 문서는 공개로 읽는다. 이미 링크가 공유됐을 수 있으므로
      // 소급해서 비공개로 만들면 남이 보던 것이 갑자기 사라진다.
      visibility: d.visibility || VISIBILITY.PUBLIC,
      viewCount: d.viewCount || 0,
      createdAt: (d.createdAt && d.createdAt.toMillis) ? d.createdAt.toMillis() : 0
    };
  }

  // 두 질의 결과를 합쳐 지도를 다시 그린다. 같은 문서가 양쪽에 다 들어올 수 있으므로
  // id를 키로 합치면 중복이 자연히 사라진다(내 공개 기록이 그 경우다).
  function rebuildSpots() {
    sharedMarkers.forEach(mapRemoveMarker);
    sharedMarkers = [];
    sharedSpots = [];

    var merged = {}, id;
    for (id in publicDocs) { if (publicDocs.hasOwnProperty(id)) merged[id] = publicDocs[id]; }
    for (id in mineDocs) { if (mineDocs.hasOwnProperty(id)) merged[id] = mineDocs[id]; }

    Object.keys(merged).forEach(function(docId) {
      var d = merged[docId];
      var hiddenByReports = (d.reportCount || 0) >= REPORT_HIDE_THRESHOLD && !isAdmin;
      if (hiddenByReports) return; // 신고 누적 스팟은 일반 사용자 화면에서 제외 (데이터는 삭제되지 않음)

      var spot = toSpot(docId, d);
      // 숨김·보관은 지도에 올리지 않는다. 목록(내 기록)에서만 관리한다.
      // 관리자에게도 마커를 만들지 않는다 - 예외를 두면 "지도에서 안 보인다"는 사용자의
      // 신고를 관리자가 재현하지 못한다. applyFilter는 marker 없는 항목을 건너뛴다.
      if (spot.visibility === VISIBILITY.HIDDEN || spot.visibility === VISIBILITY.ARCHIVED) {
        sharedSpots.push(spot);
        return;
      }
      var marker = mapCreateMarker(spot.lat, spot.lng, {
        color: spot.type === 'instagram' ? 'blue' : 'red',
        onClick: function() { openSpotModal(spot); }
      });
      spot.marker = marker;
      sharedMarkers.push(marker);
      sharedSpots.push(spot);
    });

    liveSpots = sampleSpots.concat(sharedSpots); // 거리 매칭 대상 갱신
    applyFilter(); // 새로 들어온 공유 스팟에도 현재 필터 상태 적용
    renderFilterBar(); // 카테고리별 등록 건수 배지 갱신 (ID 66)
    resolvePendingShareSpot(); // 공유 링크로 접속했다면 첫 데이터 로드 시 자동으로 열기
  }

  function onSpotsError(err) {
    showStatus('⚠️ 데이터 연결 오류: ' + err.message);
    console.warn('[NowThere] spots 구독 오류', err && err.code, err && err.message);
  }

  // 로그인 상태(익명 uid 포함)가 바뀔 때마다 "내 것" 구독을 다시 건다.
  // 공개 구독은 로그인과 무관하므로 한 번만 건다.
  function subscribeSpots(uid) {
    if (!unsubPublic) {
      unsubPublic = db.collection('spots').where('visibility', '==', VISIBILITY.PUBLIC)
        .onSnapshot(function(qs) { publicDocs = snapshotToMap(qs); rebuildSpots(); }, onSpotsError);
    }
    if (subscribedUid === uid) return;
    subscribedUid = uid;
    if (unsubMine) { unsubMine(); unsubMine = null; }
    mineDocs = {};
    if (!uid) { rebuildSpots(); return; }

    // ⚠️ 2026-09 수정: 관리자는 조건 없이 전체를 구독한다.
    // 서버 규칙은 관리자에게 모든 문서를 열어주는데, 클라이언트가 "공개"와 "내 것" 두
    // 질의만 걸고 있어서 남의 비공개 기록을 아예 불러오지 않았다. 권한은 있는데 물어보질
    // 않는 상태였고, 그래서 관리자 화면에서도 남의 비공개가 없는 것처럼 보였다.
    // 조건 없는 질의는 일반 사용자에게는 규칙이 거부한다(그게 맞다). 관리자만 통과한다.
    if (isAdmin) {
      unsubMine = db.collection('spots')
        .onSnapshot(function(qs) { mineDocs = snapshotToMap(qs); rebuildSpots(); }, onSpotsError);
      return;
    }
    unsubMine = db.collection('spots').where('ownerId', '==', uid)
      .onSnapshot(function(qs) { mineDocs = snapshotToMap(qs); rebuildSpots(); }, onSpotsError);
  }

  subscribeSpots(null);
  recordVisit(); // ID100 - 방문·유입 집계 (하루 1회, 개인 식별 없음)

  // 3. 검색 기능
  // 기록 이름 비교용 정규화: 공백/특수문자 무시, 대소문자 무시 (예: "26년 지리산 여행" == "26년지리산여행")
  function normalizeJourney(s) {
    return (s || '').toLowerCase().replace(/[\s\-_.,·]+/g, '');
  }

  // 여정을 "등록자 + 기록이름" 조합으로 그룹핑 (동명이인 여정이 서로 섞이지 않도록)
  function getAllJourneyGroups(list) {
    var groups = {};
    list.forEach(function(s) {
      if (!s.journey) return;
      var key = (s.ownerId || 'unknown') + '|' + normalizeJourney(s.journey);
      if (!groups[key]) groups[key] = { name: s.journey, ownerId: s.ownerId, spots: [] };
      groups[key].spots.push(s);
    });
    Object.keys(groups).forEach(function(k) {
      groups[k].spots.sort(function(a, b) { return (a.createdAt || 0) - (b.createdAt || 0); });
    });
    return groups;
  }

  // 검색어와 일치하는 여정 그룹들을 최근 활동순으로 반환 (여러 사람의 동명 여정도 각각 구분됨)
  function findJourneyGroupsByKeyword(keyword) {
    var normKeyword = normalizeJourney(keyword);
    if (!normKeyword) return [];
    var groups = getAllJourneyGroups(liveSpots);
    return Object.keys(groups).map(function(k) { return groups[k]; })
      .filter(function(g) { return normalizeJourney(g.name).indexOf(normKeyword) > -1; })
      .sort(function(a, b) {
        var aLatest = Math.max.apply(null, a.spots.map(function(s) { return s.createdAt || 0; }).concat([0]));
        var bLatest = Math.max.apply(null, b.spots.map(function(s) { return s.createdAt || 0; }).concat([0]));
        return bLatest - aLatest; // 최근 활동순
      });
  }

  // 내가(이 브라우저가) 만든 여정 그룹 목록
  function getMyJourneyGroups() {
    var groups = getAllJourneyGroups(sharedSpots);
    return Object.keys(groups).map(function(k) { return groups[k]; })
      .filter(function(g) { return isMine(g.ownerId); });
  }

  var journeyPolyline = null;
  function clearJourneyPolyline() {
    mapRemovePolyline(journeyPolyline);
    journeyPolyline = null;
  }
  function drawJourneyPath(list) {
    clearJourneyPolyline();
    if (list.length < 2) return;
    journeyPolyline = mapDrawPolyline(list.map(function(s) { return { lat: s.lat, lng: s.lng }; }));
  }

  // 등록시각 기준 상대적 일자 라벨 (예: "1일차 · 7/15") - 국내 근거리든 해외 원거리든 동일 로직
  function dayLabel(list, s) {
    var times = list.map(function(x) { return x.createdAt; }).filter(Boolean);
    if (!s.createdAt || !times.length) return '';
    var minTime = Math.min.apply(null, times);
    var diffDays = Math.floor((s.createdAt - minTime) / 86400000);
    var d = new Date(s.createdAt);
    return (diffDays + 1) + '일차 · ' + (d.getMonth() + 1) + '/' + d.getDate() + ' ';
  }

  function openJourneyPickerModal(keyword, groups) {
    var body = '<p style="color:#666;margin-bottom:10px;">"' + keyword + '"이(가) 포함된 기록이 ' + groups.length + '건 있습니다. 하나를 선택해주세요.</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">' +
      groups.map(function(g, idx) {
        var mine = isMine(g.ownerId) ? ' <span style="color:#4338ca;">· 내 기록</span>' : '';
        return '<button class="journeyPickBtn" data-idx="' + idx + '" style="text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #eee;background:#f9f9f9;cursor:pointer;font-size:14px;">🧭 ' + g.name + ' <span style="color:#999;font-size:12px;">(' + g.spots.length + '곳)</span>' + mine + '</button>';
      }).join('') + '</div>';
    openModal('🔎 "' + keyword + '" 검색 결과', body);
    document.querySelectorAll('.journeyPickBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var g = groups[parseInt(btn.getAttribute('data-idx'), 10)];
        openJourneyModal(g.name, g.spots);
      });
    });
  }

  function openJourneyModal(journeyName, spotsList) {
    if (spotsList.length > 0) {
      mapFitBounds(spotsList.map(function(s) { return { lat: s.lat, lng: s.lng }; }));
    }
    drawJourneyPath(spotsList);

    var body = '<p style="color:#666;margin-bottom:10px;">등록 순서대로 ' + spotsList.length + '곳의 기록입니다.</p><div style="display:flex;flex-direction:column;gap:8px;">' +
      spotsList.map(function(s, idx) {
        var label = dayLabel(spotsList, s);
        return '<button class="journeySpotBtn" data-idx="' + idx + '" style="text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #eee;background:#f9f9f9;cursor:pointer;font-size:14px;">' +
          (idx + 1) + '. ' + s.name + (s.category ? ' · ' + categoryLabel(s.category) : '') +
          (label ? '<br><span style="font-size:11px;color:#999;">' + label + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    openModal('🧭 ' + journeyName, body);
    document.querySelectorAll('.journeySpotBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        openSpotModal(spotsList[parseInt(btn.getAttribute('data-idx'), 10)]);
      });
    });
  }

  function searchPlace() {
    var keyword = document.getElementById('searchInput').value.trim();
    if (!keyword) return;

    // 0. 여행기록(여정) 이름과 먼저 매칭 - 실제 저장된 기록 이름 기준, 여러 사람의 동명 여정은 구분됨
    var journeyGroups = findJourneyGroupsByKeyword(keyword);
    if (journeyGroups.length === 1) {
      clearMarkers();
      var g = journeyGroups[0];
      openJourneyModal(g.name, g.spots);
      showStatus('"' + g.name + '" 여정 ' + g.spots.length + '곳을 지도에 표시했습니다');
      return;
    } else if (journeyGroups.length > 1) {
      clearMarkers();
      openJourneyPickerModal(keyword, journeyGroups);
      return;
    }

    // 먼저 등록된 스팟 이름 자체와 일치하는지 확인 (예: "강강유" 검색시 바로 그 스팟으로 이동)
    var nameMatch = liveSpots.find(function(s) {
      return s.name.toLowerCase().indexOf(keyword.toLowerCase()) > -1;
    });
    if (nameMatch) {
      clearMarkers();
      mapSetCenter(nameMatch.lat, nameMatch.lng);
      mapSetLevel(4);
      openSpotModal(nameMatch);
      showStatus('"' + keyword + '" 등록된 스팟을 찾았습니다!');
      return;
    }

    mapSearchPlace(keyword, function(res) {
      if (res.ok) {
        clearMarkers();
        var data = res.results;

        // 검색된 장소들 중 첫 번째(가장 관련성 높은 결과) 기준으로 최근접 라이브 스팟을 매칭
        var topPlace = data[0];
        var lat = topPlace.lat, lng = topPlace.lng;
        var result = findNearestSpot(lat, lng);

        data.slice(0, 5).forEach(function(place, idx) {
          // 회색 마커: 검색 결과 자체 위치 (참고용)
          var marker = mapCreateMarker(place.lat, place.lng, {
            onClick: function() {
              var d = getDistanceKm(place.lat, place.lng, result.spot.lat, result.spot.lng);
              var body = '<p>주소: ' + place.address + '</p>';
              if (d <= DISTANCE_THRESHOLD_KM) {
                body += '<p style="margin-top:8px;">가장 가까운 스팟: <b>' + result.spot.name + '</b> (' + d.toFixed(1) + 'km)</p>' +
                        '<button id="viewNearestBtn" style="margin-top:8px;padding:8px 14px;border-radius:8px;border:none;background:#e11d48;color:white;cursor:pointer;">이 스팟 보기</button>';
              } else {
                body += '<p style="color:#c2410c;font-size:13px;margin-top:8px;">⚠️ 반경 ' + DISTANCE_THRESHOLD_KM + 'km 내에 등록된 스팟이 없습니다. (가장 가까운 곳: ' + result.spot.name + ', ' + d.toFixed(1) + 'km — 참고용으로만 보세요)</p>';
              }
              openModal(place.name, body);
              var viewBtn = document.getElementById('viewNearestBtn');
              if (viewBtn) {
                viewBtn.addEventListener('click', function() { openSpotModal(result.spot); });
              }
            }
          });
          markers.push(marker);
        });

        mapFitBounds(data.slice(0, 5).map(function(p) { return { lat: p.lat, lng: p.lng }; }));
        var topDist = getDistanceKm(lat, lng, result.spot.lat, result.spot.lng);
        if (topDist <= DISTANCE_THRESHOLD_KM) {
          showStatus('"' + keyword + '" 근처 ' + topDist.toFixed(1) + 'km 지점에 라이브 스팟이 있습니다!');
        } else {
          showStatus('"' + keyword + '" 근처엔 등록된 라이브 스팟이 없습니다 (가장 가까운 곳 ' + topDist.toFixed(1) + 'km)');
        }
      } else if (res.zeroResult) {
        showStatus('검색 결과가 없습니다.');
      } else {
        showStatus('검색 중 오류가 발생했습니다.');
      }
    });
  }

  // ⚠️ ID103: 예전에는 [검색]이 지도만 옮기고 [CCTV로 날씨보기]를 또 눌러야 화면이 나왔다.
  // 두 동작이 분리돼 있어 관계가 보이지 않았고, "충주를 치고 아래 버튼을 누르는 것인가"
  // 하는 혼란이 있었다(실사용 지적). 검색 자체가 "그곳의 지금 모습 보여주기"가 되어야 한다.
  // 입력(검색·지도·현위치)이 셋이어도 결과는 하나로 모인다.
  // 검색어가 기록·기록이름·지명 중 여럿에 맞을 때 무엇을 볼지 고르게 한다 (ID111)
  function showSearchChoice(query, journeyHits, nameHits) {
    var body = '<p style="margin:0 0 12px;font-size:13px;color:#475569;">"' + escapeHtml(query) + '"으로 찾은 것입니다.</p>' +
      '<div style="display:flex;flex-direction:column;gap:8px;">';
    journeyHits.forEach(function(g, i) {
      body += '<button class="scJourney" data-i="' + i + '" style="text-align:left;border:1px solid #e0e7ff;background:#eef2ff;border-radius:10px;padding:11px 13px;font-size:14px;color:#4338ca;cursor:pointer;">' +
        '🧭 <b>' + escapeHtml(g.name) + '</b> <span style="font-size:12px;color:#6366f1;">기록 ' + g.spots.length + '곳</span></button>';
    });
    nameHits.slice(0, 5).forEach(function(s, i) {
      body += '<button class="scSpot" data-i="' + i + '" style="text-align:left;border:1px solid #eee;background:#fff;border-radius:10px;padding:11px 13px;font-size:14px;cursor:pointer;">' +
        '📍 ' + escapeHtml(s.name) + '</button>';
    });
    body += '<button id="scCctv" style="text-align:left;border:1px solid #fecdd3;background:#fff1f2;border-radius:10px;padding:11px 13px;font-size:14px;color:#be123c;cursor:pointer;">' +
      '📷 <b>' + escapeHtml(query) + ' 주변 CCTV</b> <span style="font-size:12px;">지금 모습 보기</span></button>' +
      '</div>';
    openModal('🔎 ' + query, body);
    document.querySelectorAll('.scJourney').forEach(function(b) {
      b.addEventListener('click', function() {
        var g = journeyHits[parseInt(b.getAttribute('data-i'), 10)];
        clearMarkers();
        openJourneyModal(g.name, g.spots);
      });
    });
    document.querySelectorAll('.scSpot').forEach(function(b) {
      b.addEventListener('click', function() {
        var s = nameHits[parseInt(b.getAttribute('data-i'), 10)];
        mapSetCenter(s.lat, s.lng); mapSetLevel(4);
        openSpotModal(s);
      });
    });
    document.getElementById('scCctv').addEventListener('click', function() {
      document.getElementById('modal').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
      showStatus('🔎 "' + query + '" 지금 모습을 불러오는 중…');
      var gc = new kakao.maps.services.Geocoder();
      gc.addressSearch(query, function(result, status) {
        if (status === kakao.maps.services.Status.OK && result[0]) {
          openDistrictWeatherView(query, { lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
          return;
        }
        ps.keywordSearch(query, function(data, psStatus) {
          if (psStatus === kakao.maps.services.Status.OK && data[0]) {
            openDistrictWeatherView(query, { lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
          } else {
            showStatus('⚠️ "' + query + '" 위치를 찾지 못했습니다.');
          }
        });
      });
    });
  }

  function searchAndShow() {
    var query = document.getElementById('searchInput').value.trim();
    if (!query) { showStatus('⚠️ 보고 싶은 지역이나 장소를 입력해주세요'); return; }
    bumpStat({ searches: 1 });
    // CCTV 기능이 공개되지 않은 상태면 예전처럼 지도 이동만 한다(안전한 실패)
    if (!CCTV_ENABLED && !isAdmin) { searchPlace(); return; }

    // ⚠️ 2026-09 복구(ID111 · IV-4). ID103에서 "검색"과 "CCTV 날씨보기"를 한 버튼으로
    // 합치면서 searchPlace()를 CCTV가 꺼진 상태의 폴백으로 밀어넣었고, 그 안에 있던
    // 기록 이름 검색이 통째로 실행되지 않게 됐다. 코드는 멀쩡한데 부를 수 없는 상태로
    // 몇 달을 있었다 - 기록 이름은 사용자가 입력하는 기능인데 그 이름으로 부를 수 없었다.
    //
    // 조용히 한쪽만 보여주면 같은 문제가 다시 생기므로, 둘 다 맞으면 둘 다 제시한다.
    var journeyHits = findJourneyGroupsByKeyword(query);
    var nameHits = sharedSpots.filter(function(s) {
      return s.name && s.name.toLowerCase().indexOf(query.toLowerCase()) > -1;
    });
    if (journeyHits.length || nameHits.length) {
      showSearchChoice(query, journeyHits, nameHits);
      return;
    }

    showStatus('🔎 "' + query + '" 지금 모습을 불러오는 중…');
    var geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(query, function(result, status) {
      if (status === kakao.maps.services.Status.OK && result[0]) {
        openDistrictWeatherView(query, { lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
        return;
      }
      ps.keywordSearch(query, function(data, psStatus) {
        if (psStatus === kakao.maps.services.Status.OK && data[0]) {
          openDistrictWeatherView(query, { lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
        } else {
          showStatus('⚠️ "' + query + '" 위치를 찾지 못했습니다. 다른 이름으로 시도해보세요.');
        }
      });
    });
  }

  document.getElementById('searchBtn').addEventListener('click', searchAndShow);
  document.getElementById('searchInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') searchAndShow();
  });

  // 5. 라이브/기록 등록 기능
  var placingMode = false;
  var pendingLatLng = null;
  var myLocationMarker = null;

  // 현위치 버튼은 항상 보인다(지도 조작). 위치를 지정하는 중에는 누르면 그 자리를
  // 바로 등록 위치로 잡는다 - 안내 문구로 역할이 바뀐 것을 알린다.
  function enterPlacingMode() {
    placingMode = true;
    document.getElementById('placingBanner').classList.add('show');
    var b = document.getElementById('locateBtn');
    if (b) b.title = '현위치로 지정';
  }
  function exitPlacingMode() {
    placingMode = false;
    document.getElementById('placingBanner').classList.remove('show');
    var b2 = document.getElementById('locateBtn');
    if (b2) b2.title = '지도를 내 위치로';
  }

  // ================================================================
  // 롱프레스로 등록모드 즉시 진입 (ID 67, 2026-07 / 2026-07-28 모바일 수정) - 기존
  // "등록 버튼 클릭 → 지도 클릭" 2단계 방식과 별개로, 지도를 약간 오래(550ms) 누르고
  // 있으면 그 자리를 바로 등록 위치로 잡아서 등록폼을 엶. 등록 버튼 방식은 그대로
  // 남겨두고 병행 지원(완료기준 참고).
  // 누르는 중 일정 거리(12px) 이상 움직이거나(지도를 옮기려는 손동작), 카카오 SDK가
  // 실제 드래그/확대축소를 인식하면 "지도 조작 의도"로 보고 취소함.
  // 롱프레스가 성립되면 뒤이어 손을 뗄 때 카카오 SDK가 별개로 'click' 이벤트를 한 번 더
  // 보내는데(짧은 이동 없는 누름은 click으로도 인식됨), 이걸 그대로 두면 이미 열린
  // 등록폼이 다시 초기화되며 두 번째로 열려 입력하던 내용이 날아갈 수 있어 suppressNextMapClick
  // 플래그로 그 뒤따라오는 click 한 번만 무시하도록 처리함.
  var LONG_PRESS_MS = 550;
  var LONG_PRESS_MOVE_TOLERANCE_PX = 12;
  var longPressTimer = null;
  var longPressStartLatLng = null;
  var longPressStartXY = null;
  var suppressNextMapClick = false;

  mapOnPressStart(function(pos, x, y) {
    longPressStartLatLng = pos;
    longPressStartXY = { x: x, y: y };
    if (longPressTimer) clearTimeout(longPressTimer);
    longPressTimer = setTimeout(function() {
      longPressTimer = null;
      if (!longPressStartLatLng) return;
      suppressNextMapClick = true;
      // ⚠️ 2026-07-28 수정: 여기서 enterPlacingMode()를 부르면 placingMode가 계속 true로
      // 남아, 기존 "등록모드일 때는 지도를 몇 번을 클릭해도 항상 등록창이 뜸" 로직(아래
      // mapOnClick 핸들러) 때문에 등록폼을 닫아도(취소 링크가 아니라 X로 닫으면) 계속
      // placingMode가 true인 채로 남아 이후 지도의 모든 클릭(마커 클릭 포함, 클릭이
      // 마커 위에서 나도 카카오 내부적으로 지도 click까지 함께 발생함)마다 등록폼이
      // 다시 뜨는 문제가 실사용에서 발견됨(우산 클릭 시 CCTV 팝업과 등록폼이 동시에
      // 뜨는 것도 같은 원인). 롱프레스는 "이 한 번의 위치에 대해 등록폼을 연다"는
      // 일회성 동작이지 등록모드 자체를 켜는 것과는 다르므로, placingMode는 건드리지
      // 않고 pendingLatLng만 지정해서 등록폼을 엶(placingBanner도 뜨지 않음 - 이미
      // 위치를 지정한 뒤라 "지도를 클릭해서 위치를 지정하라"는 안내가 맞지 않기 때문).
      var confirmedLatLng = longPressStartLatLng;
      // ⚠️ 2026-07-29: PC에서 롱프레스 중에는 카카오맵 기본 드래그 커서(주먹 쥔 손)가
      // 계속 보이다가, 등록창이 곧바로 뜨면 "방금 그게 확정된 거 맞나?" 싶은 순간이
      // 있다는 피드백을 받음. 등록창을 열기 직전 잠깐(180ms) 커서를 기본 화살표로
      // 바꿔 "여기가 확정된 지점입니다"라는 시각적 확인을 준 다음 폼을 엶(모바일은
      // 커서 개념이 없어 이 변경이 아무 영향도 주지 않음 - 무해).
      mapContainer.style.cursor = 'default';
      setTimeout(function() {
        mapContainer.style.cursor = '';
        pendingLatLng = confirmedLatLng;
        openRegisterForm();
        showStatus('📍 길게 누른 위치로 등록창을 열었습니다');
      }, 180);
    }, LONG_PRESS_MS);
  });
  mapOnPressMove(function(x, y) {
    if (!longPressTimer || !longPressStartXY) return;
    var dx = x - longPressStartXY.x, dy = y - longPressStartXY.y;
    if (Math.sqrt(dx * dx + dy * dy) > LONG_PRESS_MOVE_TOLERANCE_PX) {
      clearTimeout(longPressTimer); longPressTimer = null; longPressStartLatLng = null;
    }
  });
  mapOnPressEnd(function() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
  });
  mapOnDragStart(function() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    longPressStartLatLng = null;
  });
  mapOnZoomStart(function() {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; }
    longPressStartLatLng = null;
  });

  // URL을 보고 유튜브인지 인스타그램인지 자동 감지
  // ⚠️ 2026-08: 쇼츠(youtube.com/shorts/…)가 어느 패턴에도 걸리지 않아 등록이 막혀 있었음.
  // 쇼츠는 일반 영상과 같은 11자리 영상 아이디를 쓰므로 embed 재생 자체는 문제없고,
  // 다만 세로 영상이라 16:9 틀에 넣으면 좌우가 검게 남아서 vertical 표시를 같이 남김
  // (buildEmbedHtml에서 9:16 세로 비율로 그림). 모바일 공유 링크에 흔히 붙는
  // ?si=… 같은 꼬리표는 11자리만 잡으면 자연히 무시됨.
  function extractContentInfo(url) {
    var yt = url.match(/(?:youtube\.com\/(?:watch\?v=|live\/|embed\/|shorts\/|v\/)|youtu\.be\/)([a-zA-Z0-9_-]{11})/);
    if (yt) {
      var isShorts = /youtube\.com\/shorts\//.test(url);
      return { type: 'youtube', videoId: yt[1], vertical: isShorts, kind: isShorts ? 'shorts' : 'video' };
    }

    // 인스타그램은 릴스 주소가 reel(단수)과 reels(복수) 두 가지로 공유됨
    var ig = url.match(/instagram\.com\/(?:reels?|p|tv)\/([a-zA-Z0-9_-]+)/);
    if (ig) {
      var isReel = /instagram\.com\/reels?\//.test(url);
      return { type: 'instagram', permalink: url.split('?')[0], vertical: isReel, kind: isReel ? 'reels' : 'post' };
    }

    return null;
  }

  // 입력한 링크를 무엇으로 알아봤는지 사용자에게 그대로 말해주기 위한 이름표
  function contentKindLabel(info) {
    if (!info) return '';
    if (info.type === 'youtube') return info.kind === 'shorts' ? '유튜브 쇼츠' : '유튜브 영상';
    return info.kind === 'reels' ? '인스타그램 릴스' : '인스타그램 게시물';
  }

  document.getElementById('registerBtn').addEventListener('click', function() {
    if (placingMode) { exitPlacingMode(); return; } // 토글: 이미 등록모드면 끄기
    enterPlacingMode();
    showStatus('📍 지도에서 남기고 싶은 자리를 눌러주세요 (유튜브·인스타 링크만 있으면 됩니다)');
  });

  // ================================================================
  // 내 기록 (ID107~110 · IV-1·2·3·10·11, 2026-09 배포2)
  // ----------------------------------------------------------------
  // ⚠️ 예전 화면은 "기록 이름을 붙인 묶음"만 보여줬다. 기록 이름은 선택 입력인데,
  // 비워두고 올린 기록은 이 목록에 영영 나타나지 않았다 - 선택 항목을 비웠다고
  // 자기 기록이 사라지는 것은 말이 안 된다. 이제 내 것 전부를 보여주고, 묶음은
  // 그 위에 얹는 방식으로 바꾼다.
  //
  // 그리고 배포1에서 "나만 보기"를 고르게 해놓고 그것을 바꾸는 화면을 만들지 않았다.
  // 사용자에게 이 넷은 하나의 흐름이다 - 남긴다 / 내 것으로 본다 / 고친다 / 공개를 정한다.
  // 이 화면이 뒤의 셋을 담당한다.
  // 관리자는 전부를 이 화면에서 관리한다 - 남의 비공개까지 손대야 하는 것이 운영이고,
  // 그럴 화면이 따로 없으면 결국 Firebase 콘솔로 들어가게 된다. 남의 것은 표시로 구분한다.
  function getMyAllSpots() {
    return sharedSpots.filter(function(s) { return s.id && (isAdmin || isMine(s.ownerId)); })
      .sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
  }

  function myRecordCount() { return getMyAllSpots().length; }

  function visBadgeHtml(v) {
    var key = v || VISIBILITY.PUBLIC;
    var color = key === VISIBILITY.PUBLIC ? '#0a7d2c' : '#4338ca';
    var bg = key === VISIBILITY.PUBLIC ? '#e8f5ec' : '#eef2ff';
    var icon = key === VISIBILITY.PUBLIC ? '🌐' : (key === VISIBILITY.PRIVATE ? '🔒' : '📦');
    return '<span style="display:inline-block;padding:2px 8px;border-radius:10px;background:' + bg +
      ';color:' + color + ';font-size:11.5px;">' + icon + ' ' + (VISIBILITY_LABEL[key] || key) + '</span>';
  }

  function openMyRecords() {
    var mine = getMyAllSpots();
    var groups = getMyJourneyGroups();

    var head = isAdmin
      ? '<p style="margin:0 0 4px;font-size:13px;color:#374151;">전체 기록 <b>' + mine.length + '곳</b> <span style="color:#b45309;font-size:12px;">(관리자 · 남의 비공개 포함)</span></p>' +
        '<p style="margin:0 0 12px;font-size:11.5px;color:#94a3b8;">관리자 계정은 브라우저가 바뀌어도 같습니다.</p>'
      : '<p style="margin:0 0 4px;font-size:13px;color:#374151;">내가 남긴 기록 <b>' + mine.length + '곳</b></p>' +
        '<p style="margin:0 0 12px;font-size:11.5px;color:#94a3b8;">🖥 이 브라우저에서만 보입니다 · 브라우저를 바꾸거나 저장기록을 지우면 이어지지 않습니다</p>';

    if (mine.length === 0) {
      openModal(isAdmin ? '🧭 전체 기록 (관리자)' : '🧭 내 기록', head + '<p style="color:#888;font-size:13px;">아직 남긴 기록이 없습니다. 지도를 눌러 첫 기록을 남겨보세요.</p>');
      return;
    }

    var groupChips = groups.length
      ? '<div style="margin:0 0 12px;display:flex;flex-wrap:wrap;gap:6px;">' +
        groups.map(function(g, i) {
          return '<button class="myGrpBtn" data-idx="' + i + '" style="border:1px solid #ddd;background:#fff;border-radius:14px;padding:4px 11px;font-size:12px;color:#4338ca;cursor:pointer;">🧭 ' +
            g.name + ' ' + g.spots.length + '</button>';
        }).join('') + '</div>'
      : '';

    var rows = mine.map(function(s, i) {
      return '<div style="border:1px solid #eee;border-radius:10px;padding:10px 12px;">' +
        '<div style="font-size:14px;font-weight:600;color:#111827;word-break:break-all;">' + escapeHtml(s.name) + '</div>' +
        '<div style="margin:5px 0 8px;display:flex;flex-wrap:wrap;gap:5px;align-items:center;">' +
          visBadgeHtml(s.visibility) +
          (s.category ? '<span style="font-size:11.5px;color:#64748b;">' + categoryLabel(s.category) + '</span>' : '') +
          (s.journey ? '<span style="font-size:11.5px;color:#4338ca;">🧭 ' + escapeHtml(s.journey) + '</span>' : '') +
          '<span style="font-size:11.5px;color:#94a3b8;">👁 ' + (s.viewCount || 0) + '</span>' +
          (isAdmin && !isMine(s.ownerId)
            ? '<span style="font-size:11px;color:#b45309;background:#fffbeb;padding:2px 7px;border-radius:9px;">👤 남의 기록</span>' : '') +
        '</div>' +

  // 등록 링크를 다시 문자열로 (고치기 화면의 입력값 채우기용)
  function spotSourceUrl(spot) {
    if (spot.type === 'youtube' && spot.videoId) return 'https://www.youtube.com/watch?v=' + spot.videoId;
    return spot.permalink || '';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];

  // 등록량이 늘어날수록 오래된 제보까지 계속 섞여 나와 "최근"이라는 의미가 흐려지는 문제가 있어,

  // 어려워 코드에 고정하지 않고 Firestore(config/settings)에 저장해 관리자가 직접 조정 가능하게 함

  // ⚠️ 2026-08 (ID69 확장): CCTV 소스가 다섯 개로 늘면서 "전체 켜기/끄기" 하나로는
  // 운영이 안 됨. 소스마다 우리 서버 비용이 다르기 때문임(실측).
  //   its         국토부 고속도로·국도 정지영상 - 브라우저가 원본에서 직접 받음. 비용 0
  //   uticCity    경찰청 UTIC 도심 CCTV(2,016대) - 대부분 CORS 허용이라 직접 재생. 비용 0

  //   uticStill   UTIC 고속도로·국도 정지영상 중계 - 장당 110KB, 15초 공유캐시. 비용 매우 작음
  //   gg          경기 GITS 실시간 - CORS가 없어 중계 필수. 시청 1시간당 약 0.9GB. 유일한 실질 비용
  // 커버리지 분석 결과 유료 소스(gg + 도심 일부)가 추가로 덮는 5km 격자는 전체 2,463개
  // 중 34개뿐이었다. 그래서 gg는 기본값을 꺼두고, 필요할 때 관리자가 켜도록 한다.
  var CCTV_SOURCES = { its: true, uticStill: true, uticCity: true, local: true, gg: false };
  var CCTV_SOURCE_INFO = [
    { key: 'its',       label: '국토부 고속도로·국도(정지영상)', cost: '무료' },

  db.collection('config').doc('settings').get().then(function(doc) {

  // ================================================================

  var cctvMarkers = [];
  var cctvVisible = false;

  // 공개설정(CCTV_ENABLED)이 꺼져 있어도 관리자는 사전 검증을 위해 버튼을 계속 볼 수 있음
  function updateCctvButtonVisibility() {
