  }

  // ⚠️ 2026-07: 지금까지는 지도 화면(bounds)에 걸리는 CCTV를 확대·축소 단계와 무관하게
  // 전부 마커로 찍어서, 도로 위에서는 아이콘이 줄지어 보이고 전국 단위로 축소하면
  // 아이콘 무더기만 보이는 문제가 있었음(네이버는 축소할수록 주요 지점만 보이다가
  // 확대하면 비율적으로 늘어남).
  // 처음엔 카카오맵 SDK 공식 클러스터러(MarkerClusterer)로 시도했는데, 이건 마커가
  // 겹칠 정도로 축소되면 개별 아이콘 대신 "숫자가 적힌 원형 배지" 하나로 뭉쳐 보여주는
  // 방식이라 사용자가 원하는 그림(네이버처럼 숫자로 뭉치지 않고, 개별 우산 아이콘이
  // 항상 유지된 채로 그 개수만 지도 스케일에 비례해서 고르게 줄었다 늘었다 하는 것)과
  // 다르다는 피드백을 받아 폐기함.
  // 대신 격자(그리드) 기반 솎아내기를 직접 구현: 현재 화면(bounds)을 cellsPerAxis x
  // cellsPerAxis 칸으로 나누고, 한 칸에는 대표 CCTV 1개만 남김. 칸 개수는 확대 단계
  // (level, 카카오맵 기준 숫자가 작을수록 확대)에 따라 달라져서, 축소할수록(level 큼)
  // 칸이 커져 소수만 고르게 보이고, 확대할수록(level 작음) 칸이 촘촘해져 개별 카메라가
  // 거의 다 보이게 됨 - 숫자 배지 없이 "아이콘 개수만" 스케일에 비례해서 변함.
  // ⚠️ 2026-07 조정(1차): 전국 단위로 축소했을 때 8개 정도만 남아 휑해 보인다는
  // 피드백으로 최소 칸 개수를 3→8(최소 8x8=64칸)로 올렸었음.
  // ⚠️ 2026-07 조정(2차): 사용자가 보내준 네이버 지도 스크린샷(전국이 거의 다 보이는
  // 축소 단계)을 픽셀로 세어보니 그 화면 안에만 CCTV 아이콘이 대략 70~100개 정도
  // 고르게 깔려 있었음 - 64칸으로는 어차피 최대 64개까지밖에 못 채우니 부족했던
  // 것으로 보임. 최소 칸 개수 하한선을 8→14(최소 14x14=196칸)로 다시 올리고,
  // 확대할 때 더 촘촘해지는 상한도 16→26으로 같이 올림.
  // ⚠️ 2026-07: 네이버는 축소할수록 "고속도로가 만나는 교차점" 같은 주요 지점 위주로
  // 남기는데, 이전 버전은 격자 한 칸에 "먼저 나온 항목"을 그냥 대표로 뽑아서 실제로는
  // 국도(its) 카메라가 뽑히는 경우가 많았음(고속도로는 국도보다 커버리지가 훨씬 좁아서
  // 칸 안에 아예 없는 경우가 많기 때문). 이제 서버가 각 항목에 roadType('ex'=고속도로,
  // 'its'=국도)을 붙여주므로, 1차로 고속도로만으로 격자를 채우고 → 2차로 아직 빈 칸만
  // 국도로 채우는 2단계 방식으로 바꿈. 이러면 축소했을 때는 고속도로 위주로, 확대하면
  // 국도까지 촘촘히 채워지는 흐름이 자연스럽게 나옴.
  function decimateCctvList(list, bounds, level) {
    var cellsPerAxis = Math.max(14, Math.min(26, 30 - level));
    var lngSpan = Math.max(bounds.maxX - bounds.minX, 0.0001);
    var latSpan = Math.max(bounds.maxY - bounds.minY, 0.0001);
    var cellLng = lngSpan / cellsPerAxis;
    var cellLat = latSpan / cellsPerAxis;
    var picked = {};
    var out = [];
    function cellKeyFor(item) {
      var lat = parseFloat(item.coordy), lng = parseFloat(item.coordx);
      if (isNaN(lat) || isNaN(lng)) return null;
      var col = Math.floor((lng - bounds.minX) / cellLng);
      var row = Math.floor((lat - bounds.minY) / cellLat);
      return row + '_' + col;
    }
    function fillPass(items) {
      items.forEach(function(item) {
        var key = cellKeyFor(item);
        if (key === null || picked[key]) return; // 좌표 이상하거나 이 칸엔 이미 대표가 있음
        picked[key] = true;
        out.push(item);
      });
    }
    fillPass(list.filter(function(item) { return item.roadType === 'ex'; }));  // 1차: 고속도로부터
    fillPass(list.filter(function(item) { return item.roadType !== 'ex'; }));  // 2차: 남은 빈 칸을 국도/경기(gg) 등으로
    return out;
  }

  function clearCctvMarkers() {
    cctvMarkers.forEach(mapRemoveMarker);
    cctvMarkers = [];
  }

  // entry: { name, lat, lng, imageUrl, streamUrl } - 마커를 처음 클릭했을 때도,
  // 하단 "확인한 곳" 목록(restoreBar)에서 다시 클릭했을 때도 이 함수 하나로 처리함
  // (openCctvPopup 분리 전에는 마커 클릭 핸들러 안에만 있어서 목록에서 재사용할 수 없었음).
  function openCctvPopup(entry) {
    bumpStat({ cctvOpens: 1 });
    var name = entry.name, lat = entry.lat, lng = entry.lng;
    var streamUrl = entry.streamUrl, imageUrl = entry.imageUrl;
    if (!imageUrl && !streamUrl && !entry.streamResolve) {
      showStatus('⚠️ ' + name + ' - 영상 정보를 받아오지 못했습니다.');
      return;
    }
    recordCctvHistory(entry); // 다시 열람해도 "최근 확인"으로 맨 앞으로 이동
    // ⚠️ 2026-07: 실시간 스트리밍(hls.js, 새 창 모두)은 cctvsec.ktict.co.kr이
    // 우리 서버(데이터센터 IP)와 브라우저 직접요청(CORS로 추정) 양쪽 다 막아서
    // 페이지 안 재생이 사실상 불가능함을 확인함. 반면 이 기능의 실제 목적("그
    // 위치에 지금 비/눈이 오는지 확인")에는 정지영상(사진) 한 장으로 충분하고,
    // ITS의 cctvType=3(정지영상) 주소는 세션 토큰 없는 단순 파일이라 우리 서버·
    // 브라우저 모두 문제없이 받아짐이 실제 테스트로 확인됨. 그래서 사진을 기본으로
    // 페이지 안에 바로 보여주고(스트리밍처럼 CORS/차단 문제가 없어 로딩 지연·
    // 검은 화면 없이 즉시 표시됨), 실시간 영상은 원하는 사람만 보는 보조 옵션으로 남겨둠.
    if (imageUrl || streamUrl || entry.streamResolve) {
      // 위치 이름이 제목표시줄과 본문에 중복 표시되던 것을 정리 - 제목표시줄은
      // "이곳 날씨도 확인"(공통 안내)+아이콘을 담당하고, 위치 이름은 본문에 한
      // 번만 표시. 아이콘도 이모지(☔) 대신 지도 마커와 같은 SVG 이미지를 써서
      // 기기마다 다르게 보이던 문제를 없앰(weatherIconSvgDataUrl 참고).
      // ⚠️ 2026-07: ITS 정지영상은 카메라 원본 해상도가 4:3 프레임보다 좁아서(예:
      // 320x240 안에 실제 화면이 4:3보다 좁게 들어있는 경우) 여백이 남는 경우가
      // 있음을 확인함 - object-fit:cover로 크롭해도 원본 이미지 자체에 이미 여백이
      // 있으면 CSS로는 없앨 수 없고, 카메라마다 여백 위치/크기가 달라서 어떤 카메라는
      // 버튼이 빈 공간 위에, 어떤 카메라는 실제 화면 위에 겹쳐 보일 수 있음(기기 차이가
      // 아니라 카메라별 원본 이미지 차이로 추정).
      // ⚠️ 2026-07 재조정: "LIVE"라는 단어만 있으니 지금 보이는 화면(정지영상)이 실시간
      // 재생 중인 것처럼 오해할 수 있다는 피드백을 받음 - 그래서 (1)이미지 좌상단에
      // "정지영상 · 자동새로고침" 배지를 따로 붙여 지금 보이는 게 정지 사진이라는 걸
      // 먼저 명시하고, (2)우상단 버튼 문구를 "LIVE" → "🔴 LIVE 보기"로 바꿔 클릭해야
      // 실시간 화면으로 이동하는 "동작"임을 분명히 함, (3)하단 안내문도 "재생됩니다"
      // 대신 "정지영상입니다"를 먼저 말하도록 순서를 바꿈.
      // ⚠️ 2026-07 추가: LIVE 보기를 새 창이 아니라 팝업 안에서 바로 재생(hls.js)하도록
      // 변경 - 실제 배포 환경(HTTPS)에서 재생 성공을 확인함(CCTV_LIVE_INLINE_ENABLED
      // 참고). 실패 시(구형 브라우저, 특정 카메라 오류 등)에는 자동으로 정지영상+새 창
      // 링크로 되돌아감(아래 onError 콜백).
      var body = '<p style="margin:0 0 8px;color:#888;font-size:12.5px;">' + name + '</p>' +
        weatherLinePlaceholder('cctvWeatherLine', true) +
        '<div style="position:relative;">' +
        '<img id="cctvSnapshotImg" style="width:100%;max-width:480px;aspect-ratio:4/3;' +
        'object-fit:cover;border-radius:8px;background:#eee;display:block;" />' +
        '<video id="cctvLiveVideo" style="display:none;width:100%;max-width:480px;' +
        'aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#000;" ' +
        'controls muted playsinline></video>' +
        '<span id="cctvStillBadge" style="position:absolute;top:8px;left:8px;background:rgba(17,24,39,0.7);' +
        'color:#fff;font-size:10.5px;padding:4px 9px;border-radius:12px;">📷 정지영상 · 자동새로고침</span>' +
        (streamUrl ? '<button id="cctvLiveBtn" type="button" ' +
          'style="position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;' +
          'background:rgba(17,24,39,0.82);color:#fff;font-size:11.5px;font-weight:bold;' +
          'padding:6px 11px;border-radius:14px;border:none;cursor:pointer;">🔴 LIVE 보기</button>' : '') +
        '</div>' +
        '<p id="cctvSnapshotErr" style="display:none;margin-top:8px;font-size:12.5px;color:#c0392b;"></p>' +
        '<p id="cctvCaption" style="margin:8px 0 0;font-size:11.5px;color:#aaa;">지금 보이는 화면은 정지영상이며 약 20초마다 자동으로 새로고침됩니다' +
        (streamUrl ? ' · 실시간으로 보려면 우측 상단의 LIVE 보기 버튼을 눌러주세요' : '') +
        '</p>' +
        // ⚠️ 2026-09(DC-32): 컨셉 뷰 큐레이션의 유일한 입구. 관리자가 이 화면을 눈으로
        // 확인한 자리에서 바로 담게 한다 - 목록에서 이름만 보고 고르면 바다인 줄 알았던
        // 카메라가 방파제 안쪽 도로를 보고 있는 일이 생긴다.
        (isAdmin ? '<button id="cctvConceptBtn" type="button" style="margin-top:10px;width:100%;' +
          'padding:9px 12px;border:1px dashed #cbd5e1;border-radius:9px;background:#f8fafc;' +
          'color:#475569;font-size:12.5px;cursor:pointer;">📌 이 화면을 컨셉에 담기</button>' : '');
      openModal('이곳 날씨도 확인', body, weatherIconSvgDataUrl());
      // 화면이 흐리거나 밤이라 영상만으로는 판단이 어려울 때를 위한 보완 정보
      fillWeatherLine('cctvWeatherLine', lat, lng);
      var img = document.getElementById('cctvSnapshotImg');
      var video = document.getElementById('cctvLiveVideo');
      var errMsg = document.getElementById('cctvSnapshotErr');
      var stillBadge = document.getElementById('cctvStillBadge');
      var caption = document.getElementById('cctvCaption');
      var conceptBtnEl = document.getElementById('cctvConceptBtn');
      if (conceptBtnEl) conceptBtnEl.addEventListener('click', function() {
        openConceptPicker({ name: name, lat: parseFloat(lat), lng: parseFloat(lng) });
      });
      var liveBtn = document.getElementById('cctvLiveBtn');
      var imageLoadedOnce = false; // 정지영상이 한 번이라도 성공적으로 떴는지 - 실시간 실패 시 되돌아갈 수 있는지 판단용
      img.onload = function() { imageLoadedOnce = true; };

      // ⚠️ 2026-07-29: 경기 GITS 연동 후 일부 카메라(주로 cctvsec.ktict.co.kr 호스트)의
      // 정지영상이 401(Unauthorized)로 막혀 있는 사례가 실사용에서 발견됨(ITS 자체
      // 정지영상은 계속 토큰 없이 정상 동작 - 이 문제는 GG 소스 일부 카메라에 한정).
      // 예전에는 사진이 실패하면 에러 메시지만 띄우고 사용자가 직접 LIVE 버튼을
      // 눌러야 했는데, 이제는 사진이 실패하면 자동으로 실시간 영상으로 전환을
      // 시도해서 사용자가 추가로 클릭할 필요가 없도록 함.
      img.onerror = function() {
        img.style.display = 'none';
        if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
        if (streamUrl) {
          switchToLive();
        } else {
          errMsg.style.display = 'block';
          errMsg.textContent = '사진을 불러오지 못했습니다.';
        }
      };
      function refreshSnapshot() {
        var el = document.getElementById('cctvSnapshotImg');
        if (!el) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; return; }
        el.src = imageUrl + (imageUrl.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
      }
      // ⚠️ 2026-08: 지자체 자체 CCTV(충주 등)는 정지영상 없이 HLS 실시간만 제공함.
      // 그런 카메라는 사진 관련 동작을 아예 건너뛰고 곧바로 실시간으로 연다.
      // (예전에는 사진 주소가 없으면 새 창을 열었는데, .m3u8 주소는 브라우저가
      // 재생할 수 있는 페이지가 아니라 주소 글자만 보이는 무의미한 창이 됐음)
      if (imageUrl) {
        refreshSnapshot();
        cctvImageRefreshTimer = setInterval(refreshSnapshot, 20000);
      } else {
        img.style.display = 'none';
        if (stillBadge) stillBadge.style.display = 'none';
      }

      // ⚠️ 2026-07-29: 경기 GITS 일부 카메라의 liveUrl은 hls.js로도 재생이 안 되는
      // 경우가 발견됨(예: gitsview.gg.go.kr:8082의 wmsAuthSign 토큰 방식 - ITS/KTICT
      // 계열과 다른 별도 스트리밍 서버로 추정). 예전에는 인라인 재생 실패 시 무조건
      // window.open(streamUrl)로 새 창을 열었는데, .m3u8 주소 자체는 브라우저가
      // 재생할 수 있는 페이지가 아니라 그냥 원본 URL 텍스트만 보이는 무의미한 새 창이
      // 열리는 문제가 있었음(사용자 실사용으로 확인됨). 이제는 새 창을 자동으로 열지
      // 않고, 정지영상이 있었다면 그쪽으로 되돌아가고(realtime 실패 안내 포함),
      // 정지영상도 없었다면 "이 카메라는 지금 영상을 볼 수 없다"는 명확한 안내와 함께
      // 원하는 사람만 눌러볼 수 있는 링크만 남겨둠(자동 새 창 없음).
      // ⚠️ 2026-08: 국도·고속도로 카메라는 실시간(HLS) 외에 "최근 녹화분(mp4)" 주소도
      // 함께 받아 둔다. 실시간이 실패했을 때 빈 화면 대신 이걸 틀어준다 - 파일이라
      // 시작 지연도 버퍼링도 없고, 브라우저가 <video>로 직접 재생하므로 CORS도 중계도
      // 필요 없다. 실시간은 아니지만 "지금 거기 어떤지"에는 충분히 답이 된다.
      var mp4Tried = false;
      function tryMp4Fallback() {
        if (mp4Tried || !entry.mp4Url || !video) return false;
        mp4Tried = true;
        stopCctvPlayback();
        if (img) img.style.display = 'none';
        if (stillBadge) stillBadge.style.display = 'none';
        if (errMsg) errMsg.style.display = 'none';
        video.style.display = 'block';
        video.src = entry.mp4Url;
        video.loop = true;
        video.play().catch(function() {});
        caption.innerHTML = '📼 최근 녹화 영상입니다 (실시간 연결이 되지 않아 대신 보여드립니다) · ' +
          '<a href="' + entry.mp4Url + '" target="_blank" rel="noopener" style="color:#4a90d9;">새 창에서 크게 보기</a>';
        return true;
      }

      function showLiveFailure() {
        console.warn('[CCTV] 실패 처리 호출됨 · 카메라=' + name);
        // 재생이 실패했으면 시청 제한 타이머도 의미가 없으므로 함께 정리한다
        // (안 그러면 실패 안내 뒤에 "30초 후 멈췄습니다"가 겹쳐 뜬다 - 실제 발생)
        if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); cctvLiveLimitTimer = null; }
        // 빈 화면·안내문으로 끝내기 전에 최근 녹화분을 한 번 시도한다.
        // 화면을 보여주는 것이 이 서비스의 목적이므로, 실시간이 아니더라도
        // 그림이 나오는 쪽이 언제나 낫다.
        if (tryMp4Fallback()) return;
        if (video) video.style.display = 'none';
        if (!errMsg) return;
        errMsg.style.display = 'block';
        if (imageLoadedOnce) {
          if (img) img.style.display = 'block';
          if (stillBadge) stillBadge.style.display = '';
          if (liveBtn) liveBtn.style.display = '';
          errMsg.textContent = '실시간 재생에 실패해 정지영상으로 되돌아갑니다.';
          caption.textContent = '지금 보이는 화면은 정지영상이며 약 20초마다 자동으로 새로고침됩니다';
          refreshSnapshot();
          cctvImageRefreshTimer = setInterval(refreshSnapshot, 20000);
        } else {
          if (liveBtn) liveBtn.style.display = 'none';
          errMsg.textContent = imageUrl
            ? '이 카메라는 사진과 실시간 영상 모두 지금 불러올 수 없습니다 - 카메라 제공사 사정으로 추정됩니다.'
            : '이 카메라는 지금 영상을 불러올 수 없습니다 - 카메라 제공사 사정으로 추정됩니다.';
          caption.innerHTML = streamUrl
            ? '<a href="' + streamUrl + '" target="_blank" rel="noopener" style="color:#4a90d9;">그래도 원본 주소 열어보기(재생 안 될 수 있음)</a>'
            : '잠시 후 다시 시도해주세요.';
        }
      }
      // 경기(GITS) 영상은 주소가 http로 오는 경우가 있어 HTTPS인 우리 페이지에서
      // 브라우저가 아예 차단하고(Mixed Content), CORS 헤더도 없어 hls.js가 직접
      // 읽지 못함. 서버가 relayLive 표시를 붙여준 카메라는 우리 서버의 중계
      // (/api/hls-proxy)를 거쳐 재생함 - 우리 도메인(https) 응답이 되므로 두 문제가
      // 함께 해소됨. 새 창 링크는 원본 주소를 그대로 씀(페이지 밖에서는 직접 열림).
      // ⚠️ 2026-08: 경기(GITS)의 영상 주소에는 유효시간이 있는 토큰이 들어 있어서,
      // 목록을 캐시해둔 뒤(브라우저 30분) 나중에 우산을 누르면 이미 만료된 주소가 됨.
      // 그래서 주소를 들고 있다가 쓰지 않고 좌표만 넘겨, 누르는 순간 서버가 현재
      // 유효한 주소를 새로 받아 중계하도록 함. 이것이 예전부터 "어떤 우산은 되고
      // 어떤 우산은 안 되던" 증상의 원인으로 추정됨(카메라 차이가 아니라 시간 차이).
      var playUrl = streamUrl;
      if (entry.relayLive && CCTV_PROXY_BASE_URL) {
        if (entry.lat != null && entry.lng != null) {
          playUrl = CCTV_PROXY_BASE_URL + '/api/hls-proxy?ggx=' + encodeURIComponent(entry.lng) +
            '&ggy=' + encodeURIComponent(entry.lat);
        } else if (streamUrl) {
          playUrl = CCTV_PROXY_BASE_URL + '/api/hls-proxy?url=' + encodeURIComponent(streamUrl);
        }
      }

      // ⚠️ 2026-08: 제주는 재생주소에 authKey·sessionID가 붙어 있어 미리 저장할 수 없다.
      // 누르는 순간 서버(/api/local-stream)가 받아오고, 받은 주소는 CORS 허용이라
      // 브라우저가 직접 재생한다(우리 대역폭 0). 또 제주는 스스로 시청을 30초로
      // 제한하므로(entry.maxSeconds) 그 시간이 지나면 멈추고 다시 보기 버튼을 준다.
      function startLiveWith(url) {
        if (errMsg) { errMsg.style.display = 'none'; }
        caption.innerHTML = '🔴 실시간 영상입니다' +
          (entry.maxSeconds ? ' · 제공기관 정책상 ' + entry.maxSeconds + '초 후 자동으로 멈춥니다' : '') +
          ' · <a href="' + url + '" target="_blank" rel="noopener" style="color:#4a90d9;">새 창에서 크게 보기</a>';
        playCctvLiveInline(url, video, showLiveFailure);
        if (entry.maxSeconds) {
          if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); }
          cctvLiveLimitTimer = setTimeout(function() {
            stopCctvPlayback();
            if (!errMsg) return;
            errMsg.style.display = 'block';
            errMsg.style.color = '#475569';
            errMsg.innerHTML = '제공기관 정책에 따라 ' + entry.maxSeconds + '초 후 재생이 멈췄습니다. ' +
              '<button id="cctvAgainBtn" style="margin-left:6px;border:none;border-radius:6px;padding:5px 12px;' +
              'background:#111827;color:#fff;font-size:12px;cursor:pointer;">다시 보기</button>';
            var again = document.getElementById('cctvAgainBtn');
            if (again) again.addEventListener('click', function() {
              errMsg.style.display = 'none';
              liveStarted = false; // 다시 보기는 의도적인 재시작이므로 잠금을 푼다
              switchToLive();
            });
          }, entry.maxSeconds * 1000);
        }
      }

      // ⚠️ 2026-08: 경기 카메라에서 재생이 두 번 시작되는 일이 있었다. liveFirst로 이미
      // 실시간을 열었는데, 뒤늦게 실패한 정지영상이 img.onerror를 통해 또 한 번 열었다.
      // 두 번째가 첫 번째를 끊고 다시 시작하니 재생이 눈에 띄게 늦어졌다. 한 번만 연다.
      var liveStarted = false;
      function switchToLive() {
        if (liveStarted) return;
        liveStarted = true;
        if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
        // ⚠️ 2026-08: LIVE 버튼은 streamUrl이 있을 때만 만들어진다. 제주처럼 주소를
        // 나중에 받아오는 카메라는 streamUrl이 비어 있어 버튼이 존재하지 않으므로
        // 여기서 null 검사가 없으면 팝업 자체가 터진다(실제 발생).
        if (img) img.style.display = 'none';
        if (stillBadge) stillBadge.style.display = 'none';
        if (errMsg) errMsg.style.display = 'none';
        if (liveBtn) liveBtn.style.display = 'none';
        if (video) video.style.display = 'block';
        if (entry.streamResolve && CCTV_PROXY_BASE_URL) {
          caption.textContent = '영상 주소를 받아오는 중…';
          fetch(CCTV_PROXY_BASE_URL + '/api/local-stream?ref=' + encodeURIComponent(entry.streamResolve))
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(d) { startLiveWith(d.url); })
            .catch(function(err) {
              console.error('[CCTV] 지자체 영상주소 조회 실패:', err);
              showLiveFailure();
            });
          return;
        }
        // ⚠️ 2026-08: 경기(GITS)도 중계를 걷어냈다. 목록의 주소는 안내소일 뿐이고,
        // 그 안내소가 알려주는 안쪽 주소는 https·CORS * 라 브라우저가 직접 재생한다.
        // 주소에 유효시간 120분 서명이 붙어 미리 저장할 수 없으므로 누를 때 받아온다.
        if (entry.ggResolve && CCTV_PROXY_BASE_URL && entry.lat != null && entry.lng != null) {
          caption.textContent = '영상 주소를 받아오는 중…';
          fetch(CCTV_PROXY_BASE_URL + '/api/gg-stream?ggx=' + encodeURIComponent(entry.lng) +
                '&ggy=' + encodeURIComponent(entry.lat))
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(d) { startLiveWith(d.url); })
            .catch(function(err) {
              console.error('[CCTV] 경기 영상주소 조회 실패:', err);
              showLiveFailure();
            });
          return;
        }
        caption.innerHTML = '🔴 실시간 영상입니다 (연결 상태에 따라 화질/속도가 달라질 수 있습니다) · ' +
          '<a href="' + streamUrl + '" target="_blank" rel="noopener" style="color:#4a90d9;">새 창에서 크게 보기</a>';
        playCctvLiveInline(playUrl, video, showLiveFailure);
      }
      if (liveBtn && streamUrl) {
        liveBtn.addEventListener('click', function() { liveStarted = false; switchToLive(); });
      }
      // 서버가 전수 검사에서 "사진은 죽었고 실시간만 살아있다"고 표시한 카메라는
      // 깨진 이미지를 잠깐 보여줬다가 넘어가지 말고 처음부터 실시간으로 연다.
      if ((entry.liveFirst || !imageUrl) && (streamUrl || entry.streamResolve)) {
        switchToLive();
      }
    } else {
      // 사진 주소를 못 받아온 극히 일부 카메라 - 실시간 영상 새 창으로 폴백
      showStatus('📹 ' + name + ' - 새 창에서 CCTV 영상을 엽니다');
      window.open(streamUrl, '_blank');
    }
  }

  function loadCctvMarkers() {
    showStatus('📹 주변 CCTV 불러오는 중...');
    fetchCctvList(mapGetBounds(), function(result) {
      if (!result.ok) {
        showStatus('⚠️ CCTV 정보를 불러오지 못했습니다. (' + (result.error && result.error.message ? result.error.message : '네트워크/CORS 오류로 추정') + ')');
        return;
      }
      clearCctvMarkers();
      var bounds = mapGetBounds();
      var level = mapGetLevel();
      var shownList = decimateCctvList(result.list, bounds, level);
      var iconSize = weatherIconSizeForLevel(level);
      shownList.forEach(function(item) {
        var lat = parseFloat(item.coordy); // 출력변수 문서 기준 coordy=위도
        var lng = parseFloat(item.coordx); // 출력변수 문서 기준 coordx=경도
        if (isNaN(lat) || isNaN(lng)) return;
        var name = item.cctvname || 'CCTV';
        var streamUrl = item.cctvurl || '';
        var imageUrl = item.imageUrl || '';
        cctvMarkers.push(mapCreateMarker(lat, lng, {
          color: 'purple',
          iconSize: iconSize,
          onClick: function() {
            openCctvPopup({ name: name, lat: lat, lng: lng, imageUrl: imageUrl, streamUrl: streamUrl, mp4Url: item.mp4Url || '', liveFirst: !!item.liveFirst, relayLive: !!item.relayLive, ggResolve: !!item.ggResolve, streamResolve: item.streamResolve || '', maxSeconds: item.maxSeconds || 0 });
          }
        }));
      });
      // 전체 개수 대비 실제로 화면에 찍힌(격자 솎아내기 후) 개수를 함께 보여줘서
      // "줄었다"는 걸 사용자도 체감할 수 있게 함
      showStatus('📹 CCTV ' + shownList.length + '개 표시됨 (주변 전체 ' + result.list.length + '개 중)');
    });
  }

  document.getElementById('cctvToggleBtn').addEventListener('click', function() {
    cctvVisible = !cctvVisible;
    var btn = document.getElementById('cctvToggleBtn');
    btn.classList.toggle('on', cctvVisible);
    btn.title = cctvVisible ? 'CCTV 숨기기' : 'CCTV 표시';
    if (cctvVisible) {
      loadCctvMarkers();
    } else {
      clearCctvMarkers();
      showStatus('📷 지도에서 CCTV를 숨겼습니다');
    }
  });

  // ================================================================
  // 전국보기 (ID73 구체화, 2026-07) - 로그인 없이 누구나 쓰는 공개 기능. 주요 도시
  // 대표지점 근처 CCTV를 모음이미지로 보여줘서 "거기 비 와?"를 지도 조작 없이 한눈에
  // 확인할 수 있게 함. 지점 목록은 우선 사용자가 예시로 든 5개 도시(시청 부근)로 시작 -
  // 나중에 반응 보고 도시를 더 추가하거나 관리자가 조정 가능한 구조로 발전시킬 수 있음.
  // ================================================================
  var NATIONWIDE_CITIES = [
    { name: '서울', lat: 37.5665, lng: 126.9780 },
    { name: '대전', lat: 36.3504, lng: 127.3845 },
    { name: '대구', lat: 35.8714, lng: 128.6014 },
    { name: '광주', lat: 35.1601, lng: 126.8517 },
    { name: '부산', lat: 35.1796, lng: 129.0756 }
  ];

  // 정확한 km 거리가 아니라 "여러 후보 중 어느 게 더 가까운지" 순위만 필요해서 위도/경도
  // 차이로 근사 비교함(위도 1도≈111km로 거의 일정하지만 경도는 위도에 따라 폭이 줄어듦 -
  // 우리나라 위도 범위(33~39도)에서는 이 단순 근사로도 순위가 실제 거리와 크게 다르지 않음).
  function approxDegDistance(lat1, lng1, lat2, lng2) {
    var dLat = lat1 - lat2, dLng = lng1 - lng2;
    return Math.sqrt(dLat * dLat + dLng * dLng);
  }

  // ⚠️ 2026-08 수정: 예전에는 영상주소(cctvurl)를 카메라 식별자로 먼저 썼는데, ITS·경기
  // 영상주소에는 요청할 때마다 새로 발급되는 토큰이 들어 있다. 5칸을 그리면서 반경을
  // 넓혀 여러 번 조회하면 같은 카메라인데 주소가 달라져 "다른 카메라"로 인식되고, 중복
  // 제외가 통하지 않아 중앙·동·서에 같은 사진이 나왔다(실사용 피드백). 좌표는 조회할
  // 때마다 바뀌지 않으므로 좌표를 기본 식별자로 쓴다.
  function cctvIdOf(item) {
    var lat = parseFloat(item.coordy), lng = parseFloat(item.coordx);
    if (!isNaN(lat) && !isNaN(lng)) return lat.toFixed(5) + ',' + lng.toFixed(5);
    return item.cctvurl || (item.roadsectionid + ',' + item.coordx + ',' + item.coordy);
  }

  // 좌표가 미세하게 다르게 들어오는 소스가 있을 수 있어(같은 카메라를 소수점 아래에서
  // 다르게 표기), 실제로 화면에 나오는 "사진 주소"로도 한 번 더 걸러준다. 주소에서
  // 매번 바뀌는 토큰류 값만 떼어내고 비교하므로 같은 카메라면 같은 값이 된다.
  function cctvImageKeyOf(item) {
    if (!item || !item.imageUrl) return '';
    var raw = String(item.imageUrl);
    var qi = raw.indexOf('?');
    if (qi === -1) return 'img:' + raw;
    var base = raw.slice(0, qi);
    var kept = raw.slice(qi + 1).split('&').filter(function(pair) {
      var name = pair.split('=')[0].toLowerCase();
      return !/^(token|key|authkey|auth|wmsauthsign|sessionid|sid|t|ts|time|timestamp|rand|r|_)$/.test(name);
    }).sort();
    return 'img:' + base + (kept.length ? '?' + kept.join('&') : '');
  }

  // 지정한 좌표 근처에서 가장 가까운 CCTV 1개를 찾음. ID73 설계 원칙과 동일하게, 좁은
  // 반경에서 못 찾으면 단계적으로 반경을 넓혀가며 재시도(fetchCctvList의 그리드+캐시를
  // 그대로 재사용하므로 이미 조회한 지역은 새 API 호출 없이 캐시로 처리됨).
  // excludeIds(선택): { cctvId: true, ... } - 이미 같은 그리드(예: 구군검색의 중앙·동서남북)
  // 다른 지점에서 뽑힌 카메라를 제외하기 위한 집합. 지점끼리 거리가 가까우면(2.5km 등)
  // 같은 카메라가 "가장 가까움"으로 여러 번 뽑히는 문제(2026-07 실사용 피드백으로 발견)를
  // 막기 위함 - 제외 후에도 그 반경에 남은 후보가 없으면 반경을 넓혀 계속 찾음.
  // ⚠️ 2026-08 중요한 수정: 이 화면은 "그림으로 한눈에 보는 것"이 목적인데, 소스가
  // 늘면서(UTIC 도심·충주·제주·경기) 정지영상 없이 실시간 영상만 주는 카메라가 많아졌다.
  // 가장 가까운 카메라만 고르다 보니 사진 없는 카메라가 뽑혀 5칸이 전부 "이미지 없음"이
  // 되는 퇴행이 실사용에서 발견됨. 카메라가 늘어난 것이 오히려 이 기능을 망가뜨렸다.
  // 그래서 사진이 있는 카메라를 먼저 찾고, 그런 카메라가 하나도 없을 때만 조건을 푼다.
  function pickNearestFrom(list, lat, lng, excludeIds, imageOnly) {
    var best = null, bestDist = Infinity;
    list.forEach(function(item) {
      if (excludeIds && excludeIds[cctvIdOf(item)]) return;
      if (excludeIds) {
        var imgKey = cctvImageKeyOf(item);
        if (imgKey && excludeIds[imgKey]) return;
      }
      if (imageOnly && !item.imageUrl) return;
      var ilat = parseFloat(item.coordy), ilng = parseFloat(item.coordx);
      if (isNaN(ilat) || isNaN(ilng)) return;
      var d = approxDegDistance(lat, lng, ilat, ilng);
      if (d < bestDist) { bestDist = d; best = item; }
    });
    return best;
  }

  function findNearestCctv(lat, lng, excludeIds, callback, imageOnly) {
    var radii = [0.03, 0.08, 0.2]; // 약 3km, 8km, 20km
    var i = 0;
    function tryNext() {
      if (i >= radii.length) {
        // 사진 있는 카메라를 못 찾았으면 조건을 풀고 한 번 더 찾는다
        if (imageOnly) { findNearestCctv(lat, lng, excludeIds, callback, false); return; }
        callback(null);
        return;
      }
      var r = radii[i++];
      fetchCctvList({ minX: lng - r, maxX: lng + r, minY: lat - r, maxY: lat + r }, function(result) {
        if (!result.ok || !result.list || result.list.length === 0) { tryNext(); return; }
        var best = pickNearestFrom(result.list, lat, lng, excludeIds, imageOnly);
        if (best) callback(best); else tryNext();
      });
    }
    tryNext();
  }

  // ⚠️ 2026-08 추가(조정방향2). 기존 구군검색은 "검색지점에서 동서남북 2.5km 떨어진 가상의
  // 지점 4곳 + 중앙"을 먼저 정해두고 각 지점마다 가장 가까운 카메라를 찾는 방식이었다.
  // 이 방식은 재생 가능한 CCTV가 적던 도입 초기에는 합리적이었지만(넓게 흩어야 뭐라도
  // 잡혔다), 소스가 늘어난 지금은 오히려 해가 된다 - 검색한 바로 그 지점 옆에 카메라가
  // 여러 대 있어도 "북쪽 2.5km 지점에서 가장 가까운 카메라"를 뽑느라 정작 검색지에서
  // 먼 카메라가 올라온다. 특히 "ㅇㅇ휴게소" 같은 좁은 지점을 검색할 때 체감이 크다.
  // 그래서 가상 지점을 없애고, 검색 좌표 하나를 기준으로 실제 거리순 상위 N개를 뽑는다.
  // 위도 1도≈111km, 경도 1도≈111km×cos(위도). approxDegDistance는 경도 보정이 없어
  // 위아래로 긴 나라에서는 동서 거리를 과대평가하므로, "가장 가까운 순서"를 판단하는
  // 이 함수에서는 km 근사식을 따로 쓴다(라벨에 거리도 함께 보여줘야 해서 필요하기도 함).
  function approxKmDistance(lat1, lng1, lat2, lng2) {
    var dLat = (lat1 - lat2) * 111;
    var dLng = (lng1 - lng2) * 111 * Math.cos(lat1 * Math.PI / 180);
    return Math.sqrt(dLat * dLat + dLng * dLng);
  }

  function formatKmLabel(km) {
    if (km < 1) return '약 ' + (Math.round(km * 1000 / 50) * 50 || 50) + 'm';
    return '약 ' + (Math.round(km * 10) / 10) + 'km';
  }

  // 후보 목록에서 "서로 다른" 카메라를 거리순으로 count개 고른다.
  // ⚠️ 5칸이 어떤 경우에도 서로 달라야 한다는 것이 이 함수의 핵심 계약이다. 중복은 두
  // 가지 층위에서 생긴다 - (1) 같은 카메라가 여러 소스/여러 조회에 걸쳐 중복으로 들어오는
  // 경우는 좌표 기반 cctvIdOf로 걸러지고, (2) 서로 다른 카메라인데 같은 정지영상 주소를
  // 돌려주는 경우(일부 기관이 대표 이미지를 공유)는 토큰을 제거한 cctvImageKeyOf로
  // 걸러진다. 두 키 모두 검사해야 화면상 "같은 그림 5장"이 나오지 않는다.
  // 먼저 거리순으로 정렬한 뒤 중복을 제거하므로, 중복 그룹에서는 항상 가장 가까운
  // 카메라가 대표로 남는다(정렬 전에 제거하면 목록 순서에 따라 먼 쪽이 남을 수 있음).
  function pickNearestSet(list, lat, lng, count) {
    var cand = [];
    list.forEach(function(item) {
      var ilat = parseFloat(item.coordy), ilng = parseFloat(item.coordx);
      if (isNaN(ilat) || isNaN(ilng)) return;
      cand.push({ item: item, lat: ilat, lng: ilng, hasImage: !!item.imageUrl,
        km: approxKmDistance(lat, lng, ilat, ilng) });
    });
    cand.sort(function(a, b) { return a.km - b.km; });
    var seen = {}, uniq = [];
    cand.forEach(function(c) {
      var id = cctvIdOf(c.item);
      if (seen[id]) return;
      var imgKey = cctvImageKeyOf(c.item);
      if (imgKey && seen[imgKey]) return;
      seen[id] = true;
      if (imgKey) seen[imgKey] = true;
      uniq.push(c);
    });
    // ⚠️ 사진 유무로 순서를 바꾸지 않는다. 예전 로직은 "정지영상이 있는 카메라 우선"이었고
    // 그때는 맞았다 - 영상만 주는 카메라를 뽑으면 그 칸이 영영 빈 칸이었기 때문이다. 그러나
    // 그 뒤 영상에서 한 장면을 떠 오는 기능이 생겨 빈 칸 문제는 이미 해결됐고, 지금 그
    // 규칙을 그대로 두면 2km 앞의 카메라를 건너뛰고 7km 밖의 카메라가 올라온다. 그것이
    // 바로 이번에 없애기로 한 왜곡이므로(조정방향2), 선정 기준은 거리 하나뿐이다.
    // 사진이 없는 카메라가 뽑히면 renderCctvGrid가 날씨를 먼저 띄우고 이어서 영상에서
    // 한 장면을 떠 그림으로 바꿔 끼운다 - 조금 느릴 뿐 잃는 정보는 없다.
    return uniq.slice(0, count);
  }

  // 검색 좌표 하나를 기준으로 가장 가까운 서로 다른 카메라 count개를 찾는다.
  // findNearestCctv와 같은 방식으로 반경을 넓혀가며 재시도하되, count개를 다 못 채웠으면
  // 아직 남은 더 넓은 반경으로 한 번 더 시도한다(섬·산간처럼 카메라가 드문 곳 대응).
  function findNearestCctvSet(lat, lng, count, callback) {
    var radii = [0.03, 0.08, 0.2, 0.5]; // 약 3km, 8km, 20km, 50km
    var i = 0, bestSoFar = [];
    function tryNext() {
      if (i >= radii.length) { callback(bestSoFar); return; }
      var r = radii[i++];
      fetchCctvList({ minX: lng - r, maxX: lng + r, minY: lat - r, maxY: lat + r }, function(result) {
        if (result.ok && result.list && result.list.length) {
          var picked = pickNearestSet(result.list, lat, lng, count);
          if (picked.length > bestSoFar.length) bestSoFar = picked;
          if (bestSoFar.length >= count) { callback(bestSoFar); return; }
        }
        tryNext();
      });
    }
    tryNext();
  }

  // 전국보기/구군 날씨검색이 공통으로 쓰는 카드 렌더러. points: [{label, lat, lng}, ...] -
  // label은 카드에 표시될 이름(도시명 또는 "중앙"/"북"/"남"/"동"/"서" 등).
  // ⚠️ 2026-07: 지점끼리 거리가 가까운 구군검색(중앙·동서남북, 2.5km 간격)에서 서로 다른
  // 지점인데 같은 카메라가 중복으로 뽑히는 문제가 실사용에서 발견됨 - 지점을 병렬이 아니라
  // "하나씩 순서대로" 처리하면서, 앞서 뽑힌 카메라 id를 계속 제외 목록에 쌓아가는 방식으로
  // 수정(전국보기처럼 지점이 서로 멀리 떨어져 있으면 애초에 중복 가능성이 낮아 체감 차이는
  // 없지만, 로직은 공통 재사용).
  // useDongLabel=true면(구군검색 전용) 카메라를 찾은 뒤 실제 좌표를 행정동 이름으로 역변환해
  // "중앙/북/남/동/서" 대신 실제 동네 이름을 라벨로 보여줌(2026-07, 사용자 피드백 반영).
  // 전국보기는 이미 도시명이 label이라 그대로 둠(호출 시 useDongLabel 생략).
  // 사진이 없거나 사진 로드에 실패했을 때 그 자리에 현재 날씨를 보여준다.
  // 빈 칸보다 낫고, 기상청 실황은 전국 어디서나 응답하므로 항상 무언가는 표시된다.
  // pendingCapture=true 이면 "지금 화면을 불러오는 중"임을 알린다.
  // ⚠️ 2026-08: 영상에서 한 장면을 떠 오기 시작한 뒤에도 안내문이 "사진 없는 카메라 ·
  // 눌러서 영상 보기" 그대로여서, 사용자가 기다려야 하는 상황인지 알 수 없고 문구와
  // 실제 동작이 어긋났다(실사용 지적). 진행 중임을 말해야 기다림이 납득된다.
  function showWeatherInstead(spinner, lat, lng, prefixMsg, pendingCapture) {
    if (!spinner) return;
    var note = pendingCapture
      ? '<span class="nwNote">📷 화면 불러오는 중… 잠시만요</span>'
      : '<span class="nwNote">사진 없는 카메라 · 눌러서 영상 보기</span>';
    spinner.textContent = prefixMsg ? prefixMsg : '날씨 확인 중…';
    if (!CCTV_PROXY_BASE_URL || lat == null || lng == null) return;
    fetch(CCTV_PROXY_BASE_URL + '/api/weather-now?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng))
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(w) {
        var head = w.raining ? '☔ ' + (w.ptyLabel || '강수') : '☀️ 비 없음';
        var sub = [];
        if (w.rain1h) sub.push('1시간 ' + w.rain1h + 'mm');
        if (w.temp != null) sub.push(w.temp + '℃');
        spinner.innerHTML = '<div style="font-size:15px;font-weight:700;color:' +
          (w.raining ? '#2563eb' : '#475569') + ';">' + head + '</div>' +
          (sub.length ? '<div style="font-size:11.5px;color:#94a3b8;margin-top:2px;">' + sub.join(' · ') + '</div>' : '') +
          '<div style="font-size:10.5px;color:#cbd5e1;margin-top:3px;">' + note + '</div>';
      })
      .catch(function() {
        spinner.innerHTML = (prefixMsg ? prefixMsg + '<br>' : '') +
          '<span style="font-size:10.5px;color:#cbd5e1;">' + note + '</span>';
      });
  }

  // 화면 뜨기가 끝났을 때(성공이든 실패든) 안내문을 실제 상태에 맞게 바꾼다.
  function setCardNote(card, text) {
    if (!card) return;
    var el = card.querySelector('.nwNote');
    if (el) el.textContent = text;
  }

  // ---------------------------------------------------------------------------
  // 사진이 없는 카메라의 "한 장면 떠오기" (2026-08)
  // ---------------------------------------------------------------------------
  // 제주·충주·울산 같은 지자체 카메라는 정지영상을 아예 제공하지 않고 실시간 영상만
  // 준다. 그래서 날씨보기 다섯 칸이 회색 카드(날씨 글자)로만 채워졌는데, 이 화면의
  // 목적은 "그림으로 한눈에 보기"라 그것만으로는 부족하다.
  // 브라우저가 영상을 잠깐 열어 첫 화면을 그림으로 떠서 카드에 끼워 넣는다. 영상은
  // 제공기관 서버에서 브라우저로 바로 가므로 우리 서버 대역폭은 0이다.
  // ⚠️ 순서가 중요하다: 날씨 카드를 먼저 즉시 보여주고, 그림은 떠지는 대로 조용히
  // 바꿔 끼운다. 그림을 기다리느라 화면이 비어 있으면 "빨리 보여준다"는 원칙을 잃는다.
  // ⚠️ 한 번에 하나씩만 연다. 다섯 개를 동시에 열면 휴대폰이 버티지 못한다.
  var CAPTURE_TIMEOUT_MS = 12000;

  function resolvePlayUrlFor(item, cb) {
    if (item.ggResolve && CCTV_PROXY_BASE_URL && item.coordx != null && item.coordy != null) {
      fetch(CCTV_PROXY_BASE_URL + '/api/gg-stream?ggx=' + encodeURIComponent(item.coordx) +
            '&ggy=' + encodeURIComponent(item.coordy))
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(d) { cb(d.url || ''); })
        .catch(function() { cb(''); });
      return;
    }
    if (item.streamResolve && CCTV_PROXY_BASE_URL) {
      fetch(CCTV_PROXY_BASE_URL + '/api/local-stream?ref=' + encodeURIComponent(item.streamResolve))
        .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(function(d) { cb(d.url || ''); })
        .catch(function() { cb(''); });
      return;
    }
    cb(item.cctvurl || '');
  }

  function captureFrameFromStream(url, cb) {
    if (!url) { cb(null); return; }
    var v = document.createElement('video');
    v.muted = true;
    v.playsInline = true;
    v.setAttribute('playsinline', '');
    v.crossOrigin = 'anonymous';
    var done = false, hls = null, timer = null;

    function finish(data) {
      if (done) return;
      done = true;
      if (timer) { clearTimeout(timer); timer = null; }
      try { if (hls) hls.destroy(); } catch (e) {}
      try { v.pause(); v.removeAttribute('src'); v.load(); } catch (e) {}
      cb(data);
    }
    function grab() {
      if (done || !v.videoWidth) return;
      try {
        var c = document.createElement('canvas');
        c.width = v.videoWidth;
        c.height = v.videoHeight;
        c.getContext('2d').drawImage(v, 0, 0, c.width, c.height);
        finish(c.toDataURL('image/jpeg', 0.72));
      } catch (e) {
        // 캔버스가 오염된 경우(제공기관이 CORS를 열지 않음) - 그림을 뜰 수 없다
        console.warn('[캡처] 화면을 뜨지 못했습니다: ' + (e && e.name));
        finish(null);
      }
    }
    v.addEventListener('loadeddata', grab);
    v.addEventListener('timeupdate', grab);
    timer = setTimeout(function() { finish(null); }, CAPTURE_TIMEOUT_MS);

    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, function() { v.play().catch(function() {}); });
      hls.on(Hls.Events.ERROR, function(evt, data) { if (data && data.fatal) finish(null); });
    } else {
      v.src = url;
      v.play().catch(function() {});
      v.onerror = function() { finish(null); };
    }
  }

  // 카드에 그림을 끼워 넣는다. 실패하면 원래의 날씨 카드를 그대로 둔다(안전한 실패).
  function fillCardWithFrame(task, next) {
    resolvePlayUrlFor(task.item, function(url) {
      captureFrameFromStream(url, function(dataUrl) {
        if (dataUrl && task.card.isConnected) {
          var img = document.createElement('img');
          img.alt = task.label;
          img.src = dataUrl;
          var sp = task.card.querySelector('.nwSpinner');
          task.card.insertBefore(img, task.card.firstChild);
          if (sp) sp.remove();
        } else {
          setCardNote(task.card, '사진 없는 카메라 · 눌러서 영상 보기');
        }
        next();
      });
    });
  }

  // 아직 차례가 오지 않은 칸은 "잠시만요"가 아니라 순서를 알려준다 - 무작정 기다리는
  // 것과 몇 번째인지 아는 것은 체감이 다르다.
  function markQueuePositions(queue, startIdx) {
    for (var i = startIdx; i < queue.length; i++) {
      setCardNote(queue[i].card, '📷 화면 불러오는 중… ' + (i - startIdx + 1) + '번째 대기');
    }
  }

  function runCaptureQueue(queue) {
    var i = 0;
    function step() {
      if (i >= queue.length) return;
      var task = queue[i++];
      setCardNote(task.card, '📷 화면 불러오는 중… 잠시만요');
      markQueuePositions(queue, i);
      fillCardWithFrame(task, step);
    }
    step();
  }

  function renderCctvGrid(grid, points, useDongLabel, onPicked) {
    var usedIds = {};
    var captureQueue = [];
    function renderOne(idx) {
      if (idx >= points.length) { runCaptureQueue(captureQueue); return; }
      var pt = points[idx];
      var card = document.createElement('div');
      card.className = 'nwCard';
      card.innerHTML = '<div class="nwSpinner">불러오는 중…</div><span class="nwLabel"></span>';
      card.querySelector('.nwLabel').textContent = pt.label; // 지명은 사용자 검색어 유래일 수 있어 textContent로 안전하게 삽입
      grid.appendChild(card);
      // ⚠️ 2026-08(조정방향2): 구군검색은 카메라를 미리 거리순으로 골라 pt.item에 담아
      // 넘긴다. 그 경우 여기서 다시 찾지 않고 넘어온 카메라를 그대로 쓴다. 전국보기는
      // 예전처럼 지점(도시)만 넘어오므로 기존대로 그 지점에서 가장 가까운 것을 찾는다.
      function useItem(item) {
        var spinner = card.querySelector('.nwSpinner');
        if (!item) {
          if (spinner) spinner.textContent = '근처에 다른 CCTV가 없습니다';
          renderOne(idx + 1);
          return;
        }
        usedIds[cctvIdOf(item)] = true;
        var usedImgKey = cctvImageKeyOf(item);
        if (usedImgKey) usedIds[usedImgKey] = true;
        var imageUrl = item.imageUrl || '';
        var streamUrl = item.cctvurl || '';
        var name = item.cctvname || pt.label;
        var ilat = parseFloat(item.coordy), ilng = parseFloat(item.coordx);
        if (imageUrl) {
          var img = document.createElement('img');
          img.alt = pt.item ? (item.cctvname || pt.label) : pt.label;
          img.onload = function() { if (spinner) spinner.remove(); };
          img.onerror = function() { showWeatherInstead(spinner, pt.lat, pt.lng, '사진을 불러오지 못했습니다'); };
          img.src = imageUrl;
          card.insertBefore(img, card.firstChild);
        } else if (spinner) {
          // 사진이 없는 카메라(실시간 영상만 제공)라도 빈 칸을 보여주지 않는다.
          // 먼저 그 지점의 현재 강수·기온을 즉시 보여주고(빠름), 이어서 영상에서 한
          // 장면을 떠 그림으로 바꿔 끼운다(이미지). 그림이 안 떠지면 날씨 카드가 그대로
          // 남으므로 사용자가 잃는 것은 없다.
          showWeatherInstead(spinner, pt.lat, pt.lng, null, true);
          captureQueue.push({ card: card, item: item, label: pt.label });
        }
        if (useDongLabel && !isNaN(ilat) && !isNaN(ilng)) {
          // 카메라의 실제 좌표를 행정동 이름으로 역변환 - 실패해도 기존 방향 라벨(pt.label)이
          // 그대로 남아있으므로 사용자에게 보이는 정보가 없어지는 일은 없음(안전한 실패).
          getRegionGeocoder().coord2RegionCode(ilng, ilat, function(regionResult, regionStatus) {
            if (regionStatus !== kakao.maps.services.Status.OK || !regionResult || !regionResult.length) return;
            var region = null;
            for (var i = 0; i < regionResult.length; i++) {
              if (regionResult[i].region_type === 'H') { region = regionResult[i]; break; }
            }
            if (!region) region = regionResult[0];
            var dongName = region && region.region_3depth_name;
            if (dongName) {
              var labelEl = card.querySelector('.nwLabel');
              if (labelEl) labelEl.textContent = dongName + ' (' + pt.label + ')';
            }
          });
        }
        card.addEventListener('click', function() {
          // ⚠️ 2026-08(조정방향2): 구군검색의 라벨은 이제 방향("북")이 아니라 거리("약
          // 1.2km")라서, 그대로 앞에 붙이면 팝업 제목이 "약 1.2km · 카메라이름"이 되어
          // 어디인지 알려주지 못한다. 미리 고른 카메라를 쓰는 경우에는 카메라 이름을
          // 앞세우고 거리를 괄호로 덧붙인다(전국보기는 라벨이 도시명이라 기존 그대로).
          openCctvPopup({ name: pt.item ? (name + ' (' + pt.label + ')') : (pt.label + ' · ' + name), lat: ilat, lng: ilng, imageUrl: imageUrl, streamUrl: streamUrl, mp4Url: item.mp4Url || '', liveFirst: !!item.liveFirst, relayLive: !!item.relayLive, ggResolve: !!item.ggResolve, streamResolve: item.streamResolve || '', maxSeconds: item.maxSeconds || 0 });
        });
        // 컨셉 뷰(관리자 큐레이션)가 이 칸에 실제로 어떤 카메라가 잡혔는지 알아야
        // "빼기"를 걸 수 있다. 그리드는 카메라를 찾아 쓰기만 하고 밖으로 알려주지
        // 않았기 때문에 알림 통로 하나를 낸다(다른 호출자는 넘기지 않으므로 영향 없음).
        if (onPicked) { try { onPicked(pt, item, card); } catch (e) { console.warn(e); } }
        renderOne(idx + 1);
      }
      if (pt.item) useItem(pt.item);
      // ⚠️ pt.exact: 관리자가 지목한 바로 그 카메라를 써야 하는 경우(컨셉 뷰).
      // imageOnly를 켜면 "사진 있는 카메라 우선" 규칙 때문에 지목한 카메라를 건너뛰고
      // 옆의 다른 카메라가 올라올 수 있다 - 큐레이션이 조용히 무너지는 길이라 끈다.
      // 좌표가 카메라 좌표와 같으므로 거리 0으로 그 카메라가 뽑힌다.
      else if (pt.exact) findNearestCctv(pt.lat, pt.lng, null, useItem, false);
      // 사진 있는 카메라를 우선으로 찾는다(이 화면의 목적이 "그림으로 한눈에 보기"이므로)
      else findNearestCctv(pt.lat, pt.lng, usedIds, useItem, true);
    }
    renderOne(0);
  }

  function openNationwideView() {
    // 모달을 열기 직전에 배경 지도를 전국이 보이는 범위로 부드럽게 이동·축소 - level 13은
    // 대한민국 전역이 대략 한 화면에 들어오는 배율로 우선 고정값을 씀(화면 크기에 따라
    // 살짝 넘치거나 남을 수 있음 - 실사용 화면에서 보고 조정 예정).
    mapFlyToPoints(NATIONWIDE_CITIES.map(function(c) { return { lat: c.lat, lng: c.lng }; }), 13);
    var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">주요 도시 근처 CCTV로 지금 날씨를 한눈에 확인해보세요</p>' +
      '<div id="nationwideGrid" class="nwGrid"></div>';
    openModal('🌍 전국 CCTV 한눈에 보기', body, weatherIconSvgDataUrl());
    // openModal이 위에서 currentReopenFn을 null로 초기화하므로, 그 직후 이 그리드뷰를
    // "다시 열기" 함수로 등록 - 최소화(지도만 보기) 후 복원 시 이 함수가 다시 호출됨.
    currentReopenFn = openNationwideView;
    renderCctvGrid(document.getElementById('nationwideGrid'),
      NATIONWIDE_CITIES.map(function(c) { return { label: c.name, lat: c.lat, lng: c.lng }; }));
  }

  // ===========================================================================
  // 컨셉 뷰 - 관리자가 고른 CCTV 화면 묶음 (2026-09 · DC-32)
  // ===========================================================================
  // 왜 만드는가.
  //   지금까지 CCTV는 "교통·날씨를 확인하는 도구"였다. 네이버·카카오도 딱 거기까지 쓴다.
  //   그런데 실사용에서 다른 것이 발견됐다 - 울산 해안 카메라에는 파도가 보이고, 동해와
  //   서해 카메라는 해 지는 시각이 15~20분 어긋난다. 같은 카메라가 교통정보가 아니라
  //   풍경이 되는 순간이다. 아무도 CCTV를 재료로 쓰지 않는다는 조사 결과(4차 검토)에
  //   대한 답이 여기 있다.
  //
  // 왜 자동이 아니라 관리자 큐레이션인가.
  //   "바다가 보이는 카메라"를 좌표나 이름으로 자동 판별할 방법이 없다. 해안 근처라고
  //   바다가 찍히는 것도 아니고(방파제 안쪽 도로를 보는 카메라가 훨씬 많다), 이름에
  //   '해안'이 들어가도 마찬가지다. 자동으로 뽑으면 열에 여덟은 아스팔트가 나오고,
  //   그 순간 이 기능은 "알아서 살펴보세요"가 되어 아무도 두 번 누르지 않는다.
  //   사람이 한 번 보고 고른 것만 담는다. 담긴 것이 없는 컨셉은 사용자에게 보이지 않는다.
  //
  // 왜 주소가 아니라 좌표를 저장하는가.
  //   ITS·경기 영상주소에는 요청할 때마다 새로 발급되는 토큰이 들어 있어서 저장하면
  //   며칠 안에 전부 죽는다(cctvIdOf 주석 참고). 좌표는 변하지 않으므로 좌표만 적어두고,
  //   화면을 열 때마다 그 좌표의 카메라를 새로 찾아 살아 있는 주소를 받는다.
  var CONCEPT_DEFS = [
    { key: 'sea',    emoji: '🌊', title: '바다 보기',   desc: '파도가 보이는 화면만 골라 담았습니다' },
    { key: 'sunset', emoji: '🌇', title: '노을 보기',   desc: '해 지는 순서대로 - 동쪽이 먼저 저뭅니다', bySunset: true },
    { key: 'night',  emoji: '🌃', title: '밤 풍경',     desc: '불 켜진 거리와 다리' }
  ];
  // { sea: [{name, lat, lng}], ... } - config/settings.conceptViews 에 저장된다.
  var conceptCams = {};

  function conceptDefOf(key) {
    for (var i = 0; i < CONCEPT_DEFS.length; i++) if (CONCEPT_DEFS[i].key === key) return CONCEPT_DEFS[i];
    return null;
  }
  function conceptCamsOf(key) {
    var arr = conceptCams[key];
    return (arr && arr.length) ? arr : [];
  }
  // 사용자에게 보이는 컨셉 = 담긴 화면이 하나라도 있는 것. 관리자에게는 빈 것도 보인다
  // (담을 자리가 보여야 담을 수 있으므로).
  function visibleConcepts() {
    return CONCEPT_DEFS.filter(function(d) { return isAdmin || conceptCamsOf(d.key).length > 0; });
  }
  function anyConceptCurated() {
    return CONCEPT_DEFS.some(function(d) { return conceptCamsOf(d.key).length > 0; });
  }
  function updateConceptButtonVisibility() {
    var btn = document.getElementById('conceptBtn');
    if (!btn) return;
    // CCTV 기능 자체가 비공개면 컨셉 뷰도 없다(같은 재료를 쓰므로).
    var on = (CCTV_ENABLED || isAdmin) && (anyConceptCurated() || isAdmin);
    btn.style.display = on ? 'flex' : 'none';
  }

  function loadConceptViews(data) {
    var saved = data && data.conceptViews;
    conceptCams = {};
    if (saved) {
      CONCEPT_DEFS.forEach(function(d) {
        var arr = saved[d.key];
        if (!Array.isArray(arr)) return;
        conceptCams[d.key] = arr.filter(function(c) {
          return c && typeof c.lat === 'number' && typeof c.lng === 'number';
        });
      });
    }
    updateConceptButtonVisibility();
  }

  function saveConceptViews(done) {
    var payload = {};
    CONCEPT_DEFS.forEach(function(d) { payload[d.key] = conceptCamsOf(d.key); });
    db.collection('config').doc('settings').set({ conceptViews: payload }, { merge: true })
      .then(function() { updateConceptButtonVisibility(); if (done) done(true); })
      .catch(function(err) {
        console.error('컨셉 저장 실패:', err);
        showStatus('⚠️ 저장하지 못했습니다 - 관리자로 로그인되어 있는지 확인해주세요');
        if (done) done(false);
      });
  }

  // ---------------------------------------------------------------------------
  // 일몰 시각 계산 (외부 API 없이)
  // ---------------------------------------------------------------------------
  // 노을 컨셉의 핵심은 "동시에 보는 것"이 아니라 "시차를 보는 것"이다. 경도 1도당 4분,
  // 한국은 동서로 약 4도라 육지 안에서만 15~20분이 어긋난다. 그 순서를 보여주려면 지점별
  // 일몰 시각이 필요한데, 이건 위경도와 날짜만 있으면 계산되는 값이라 API를 부를 이유가
  // 없다(부르면 지점 수만큼 호출이 늘고 실패 지점이 하나 더 생긴다).
  // 표준 일출·일몰 알고리즘(천정각 90.833°, 대기굴절+태양 반지름 보정 포함), 오차 1~2분.
  function sunsetMinutesKST(lat, lng, date) {
    var rad = Math.PI / 180;
    var yearStart = new Date(date.getFullYear(), 0, 0);
    var dayOfYear = Math.floor((date - yearStart) / 86400000);
    var lngHour = lng / 15;
    var t = dayOfYear + ((18 - lngHour) / 24); // 18 = 일몰 기준(일출은 6)
    var M = (0.9856 * t) - 3.289;              // 태양의 평균 근점이각
    var L = M + (1.916 * Math.sin(M * rad)) + (0.020 * Math.sin(2 * M * rad)) + 282.634;
    L = (L % 360 + 360) % 360;                 // 태양의 진황경
    var RA = Math.atan(0.91764 * Math.tan(L * rad)) / rad;
    RA = (RA % 360 + 360) % 360;
    // 적경은 황경과 같은 사분면에 있어야 한다(atan이 사분면을 잃어버리므로 되돌려준다)
    RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
    var sinDec = 0.39782 * Math.sin(L * rad);
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(90.833 * rad) - (sinDec * Math.sin(lat * rad))) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null;    // 백야·극야 (한국에서는 없지만 방어)
    var H = (Math.acos(cosH) / rad) / 15;
    var T = H + RA - (0.06571 * t) - 6.622;
    var UT = ((T - lngHour) % 24 + 24) % 24;
    return Math.round((((UT + 9) % 24) * 60));  // 한국 표준시(UTC+9)
  }
  function hhmm(mins) {
    if (mins == null) return '';
    var h = Math.floor(mins / 60), m = mins % 60;
    return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
  }
  function nowMinutesKST() {
    var d = new Date();
    // 사용자의 기기 시간대가 한국이 아닐 수 있으므로 UTC 기준으로 계산해 +9를 더한다.
    return ((d.getUTCHours() + 9) % 24) * 60 + d.getUTCMinutes();
  }
  // "23분 뒤" / "12분 전" - 지금이 볼 때인지 알려주는 것이 이 컨셉의 절반이다.
  function sunsetRelLabel(sunMin) {
    if (sunMin == null) return '';
    var diff = sunMin - nowMinutesKST();
    if (diff > 720) diff -= 1440;
    if (diff < -720) diff += 1440;
    if (Math.abs(diff) <= 3) return '지금';
    if (diff > 0) return (diff >= 60 ? Math.floor(diff / 60) + '시간 ' : '') + (diff % 60) + '분 뒤';
    var a = -diff;
    return (a >= 60 ? Math.floor(a / 60) + '시간 ' : '') + (a % 60) + '분 전';
  }

  // ---------------------------------------------------------------------------
  // 컨셉 고르기 → 컨셉 보기
  // ---------------------------------------------------------------------------
  function openConceptList() {
    var list = visibleConcepts();
    var rows = list.map(function(d) {
      var n = conceptCamsOf(d.key).length;
      var right = n ? (n + '곳') : '<span style="color:#cbd5e1;">아직 담긴 화면 없음</span>';
      return '<div class="cvRow" data-key="' + d.key + '" style="display:flex;align-items:center;gap:11px;' +
        'padding:12px 4px;border-bottom:1px solid #f1f5f9;cursor:pointer;">' +
        '<span style="font-size:22px;line-height:1;">' + d.emoji + '</span>' +
        '<span style="min-width:0;flex:1;"><b style="font-size:14px;">' + d.title + '</b>' +
        '<br><span style="font-size:11.5px;color:#94a3b8;">' + d.desc + '</span></span>' +
        '<span style="font-size:12px;color:#64748b;flex:0 0 auto;">' + right + '</span></div>';
    }).join('');
    var body = '<p style="margin:0 0 6px;color:#888;font-size:12.5px;">' +
      'CCTV를 교통이 아니라 풍경으로 봅니다. 사람이 직접 보고 고른 화면만 담겨 있습니다.</p>' +
      '<div>' + (rows || '<p style="color:#94a3b8;font-size:12.5px;">담긴 화면이 아직 없습니다.</p>') + '</div>' +
      (isAdmin ? '<p style="margin:12px 0 0;font-size:11.5px;color:#64748b;background:#f8fafc;padding:9px 11px;border-radius:8px;">' +
        '⚙️ 담는 방법: 지도에서 CCTV를 열어 화면을 확인한 뒤, 팝업 안의 <b>“📌 컨셉에 담기”</b>를 누르세요. ' +
        '저장되는 것은 좌표와 이름뿐입니다(영상주소는 토큰이 붙어 있어 며칠이면 죽습니다).</p>' : '');
    openModal('🏞️ 풍경으로 보기', body);
    currentReopenFn = openConceptList;
    Array.prototype.forEach.call(document.querySelectorAll('#modalBody .cvRow'), function(el) {
      el.addEventListener('click', function() { openConceptView(el.getAttribute('data-key')); });
    });
  }

  function openConceptView(key) {
    var def = conceptDefOf(key);
    if (!def) return;
    var cams = conceptCamsOf(key).slice();
    if (!cams.length) {
      showStatus('아직 담긴 화면이 없습니다' + (isAdmin ? ' - 지도에서 CCTV를 열어 담아주세요' : ''));
      return;
    }
    var today = new Date();
    if (def.bySunset) {
      // 동쪽이 먼저 저문다. 일몰이 이른 순 = 동 → 서.
      cams.forEach(function(c) { c._sun = sunsetMinutesKST(c.lat, c.lng, today); });
      cams.sort(function(a, b) { return (a._sun == null ? 99999 : a._sun) - (b._sun == null ? 99999 : b._sun); });
    }
    mapFlyToPoints(cams.map(function(c) { return { lat: c.lat, lng: c.lng }; }), 13);
    var head = def.desc;
    if (def.bySunset && cams.length > 1) {
      var first = cams[0]._sun, last = cams[cams.length - 1]._sun;
      if (first != null && last != null && last > first) {
        head += ' · 오늘은 ' + hhmm(first) + ' ~ ' + hhmm(last) + ', ' + (last - first) + '분 차이';
      }
    }
    var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">' + head + '</p>' +
      '<div id="conceptGrid" class="nwGrid"></div>' +
      (isAdmin ? '<p style="margin:10px 0 0;font-size:11.5px;color:#94a3b8;">각 칸의 ✕를 누르면 이 컨셉에서 뺍니다.</p>' : '');
    openModal(def.emoji + ' ' + def.title, body, weatherIconSvgDataUrl());
    currentReopenFn = function() { openConceptView(key); };

    var points = cams.map(function(c) {
      var label = c.name || '이름 없음';
      if (def.bySunset && c._sun != null) {
        var rel = sunsetRelLabel(c._sun);
        label = hhmm(c._sun) + ' 일몰' + (rel ? ' · ' + rel : '') + ' — ' + label;
      }
      return { label: label, lat: c.lat, lng: c.lng, exact: true, _cam: c };
    });
    renderCctvGrid(document.getElementById('conceptGrid'), points, false, function(pt, item, card) {
      if (!isAdmin || !card) return;
      var x = document.createElement('button');
      x.type = 'button';
      x.textContent = '✕';
      x.title = '이 컨셉에서 빼기';
      x.style.cssText = 'position:absolute;top:6px;right:6px;z-index:3;border:none;border-radius:50%;' +
        'width:24px;height:24px;background:rgba(185,28,28,0.88);color:#fff;font-size:12px;cursor:pointer;';
      x.addEventListener('click', function(ev) {
        ev.stopPropagation();
        conceptCams[key] = conceptCamsOf(key).filter(function(c) {
          return !(Math.abs(c.lat - pt._cam.lat) < 1e-6 && Math.abs(c.lng - pt._cam.lng) < 1e-6);
        });
        saveConceptViews(function(ok) {
          if (!ok) return;
          showStatus('뺐습니다 · ' + def.title + ' ' + conceptCamsOf(key).length + '곳');
          openConceptView(key);
        });
      });
      if (getComputedStyle(card).position === 'static') card.style.position = 'relative';
      card.appendChild(x);
    });
  }

  // 지도에서 CCTV를 열어둔 상태에서 "이 화면을 담는다" - 큐레이션의 유일한 입구다.
  // 관리자가 실제로 그 화면을 눈으로 본 뒤에만 담기게 되므로, 잘못 담길 여지가 적다.
  function openConceptPicker(entry) {
    var rows = CONCEPT_DEFS.map(function(d) {
      var has = conceptCamsOf(d.key).some(function(c) {
        return Math.abs(c.lat - entry.lat) < 1e-6 && Math.abs(c.lng - entry.lng) < 1e-6;
      });
      return '<div class="cpRow" data-key="' + d.key + '" style="display:flex;align-items:center;gap:10px;' +
        'padding:12px 4px;border-bottom:1px solid #f1f5f9;cursor:' + (has ? 'default' : 'pointer') + ';opacity:' + (has ? '0.5' : '1') + ';">' +
        '<span style="font-size:20px;">' + d.emoji + '</span>' +
        '<b style="flex:1;font-size:14px;">' + d.title + '</b>' +
        '<span style="font-size:12px;color:#64748b;">' + (has ? '이미 담김' : conceptCamsOf(d.key).length + '곳') + '</span></div>';
    }).join('');
    var name = entry.name || '이름 없는 카메라';
    openModal('📌 컨셉에 담기',
      '<p style="margin:0 0 8px;font-size:12.5px;color:#475569;">' + escapeHtml(name) + '</p>' +
      '<p style="margin:0 0 10px;font-size:11.5px;color:#94a3b8;">좌표와 이름만 저장합니다. 화면을 열 때마다 이 좌표의 카메라를 새로 찾습니다.</p>' +
      rows);
    Array.prototype.forEach.call(document.querySelectorAll('#modalBody .cpRow'), function(el) {
      el.addEventListener('click', function() {
        var key = el.getAttribute('data-key');
        var dup = conceptCamsOf(key).some(function(c) {
          return Math.abs(c.lat - entry.lat) < 1e-6 && Math.abs(c.lng - entry.lng) < 1e-6;
        });
        if (dup) return;
        conceptCams[key] = conceptCamsOf(key).concat([{ name: name, lat: entry.lat, lng: entry.lng }]);
        saveConceptViews(function(ok) {
          if (!ok) return;
          var d = conceptDefOf(key);
          showStatus('✅ ' + d.title + '에 담았습니다 · 모두 ' + conceptCamsOf(key).length + '곳');
          closeModal();
        });
      });
    });
  }

  document.getElementById('conceptBtn').addEventListener('click', function() {
    openConceptList();
  });

  // "지금 여기" - 현위치로 이동한 뒤 그 지점의 지금 모습을 바로 보여준다.
  // ⚠️ 예전에는 현위치 버튼(지도만 이동)과 날씨보기(화면 표시)가 따로 있어 관계가
  // 보이지 않았다. 입력 방식만 다를 뿐 사용자가 원하는 결과는 하나다.
  // ================================================================
  // 현재위치 사용 동의 (ID106 · DC-25, 2026-09)
  // ----------------------------------------------------------------
  // 위치정보법 제15조의 수범 대상은 "누구든지"다. 사업자냐 아니냐, 신고 대상이냐 아니냐와
  // 무관하게 적용된다. 그리고 브라우저가 띄우는 권한 팝업은 브라우저의 것이지 우리의
  // 동의 절차가 아니다 - 그 팝업은 "이 사이트에 위치를 주겠는가"만 묻고, 우리가 그것을
  // 무엇에 쓰고 어디까지 보내는지는 말해주지 않는다. 그래서 한 번은 우리가 말해야 한다.
  var GEO_CONSENT_KEY = 'nt_geo_consent_v1';
  function hasGeoConsent() {
    try { return localStorage.getItem(GEO_CONSENT_KEY) === '1'; } catch (e) { return false; }
  }
  function askGeoConsent(onAgree) {
    if (hasGeoConsent()) { onAgree(); return; }
    openModal('📍 현재 위치를 사용합니다',
      '<div style="font-size:13.5px;line-height:1.75;color:#374151;">' +
      '<p style="margin:0 0 10px;">지금 계신 곳 주변의 CCTV와 날씨를 찾기 위해 위치를 한 번 확인합니다.</p>' +
      '<ul style="margin:0 0 12px;padding-left:18px;color:#475569;">' +
      '<li>확인한 좌표는 <b>그 조회에만</b> 쓰고 저장하지 않습니다.</li>' +
      '<li>누가 어디 있었는지 <b>기록으로 쌓지 않습니다.</b></li>' +
      '<li>언제든 브라우저 설정에서 위치 권한을 다시 막을 수 있습니다.</li>' +
      '</ul>' +
      '<div style="display:flex;gap:8px;">' +

  function runHereFlow() {
    if (!navigator.geolocation) { showStatus('이 브라우저는 위치 확인을 지원하지 않습니다.'); return; }
    if (!window.isSecureContext) {
      showStatus('⚠️ 위치 기능은 https 주소에서만 동작합니다 — https://nowthere.net 으로 열어주세요.');
      return;
    }
    showStatus('📡 지금 계신 곳을 확인하는 중…');
    navigator.geolocation.getCurrentPosition(function(pos) {
      var here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      mapSetCenter(here.lat, here.lng);
      mapSetLevel(5);
      mapRemoveMarker(myLocationMarker);
      myLocationMarker = mapCreateLocationMarker(here.lat, here.lng);
      if (!CCTV_ENABLED && !isAdmin) { showStatus('현재 위치로 이동했습니다.'); return; }
      openDistrictWeatherView('지금 계신 곳', here);
    }, function(err) {
      console.warn('[위치] 실패 코드=' + (err && err.code) + ' · ' + (err && err.message));
      if (err && err.code === 1) {
        showStatus('⚠️ 위치 권한이 거부되어 있습니다 — 주소창 왼쪽 자물쇠(또는 ⓘ)를 눌러 이 사이트의 위치 권한을 허용으로 바꿔주세요.');
      } else if (err && err.code === 2) {
        showStatus('⚠️ 위치를 찾지 못했습니다 — 실내이거나 신호가 약할 수 있습니다.');
      } else {
        showStatus('⚠️ 위치 확인이 오래 걸립니다 — 잠시 후 다시 시도해주세요.');
      }
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }


  // ================================================================
  // 구/군 날씨검색 (ID73 구체화 ②, 2026-07) - 검색창에 지역명(예: 강남구)을 입력하고
  // 옆의 빨간 "날씨검색" 버튼을 누르면, 그 지역 중앙 및 동서남북 대표지점 근처 CCTV를
  // 모음이미지로 보여줌. 기존 파란 "검색" 버튼(장소/캠핑장 검색)과는 별개 동작 -
  // 오조작 방지를 위해 검색창은 공유하되 버튼을 분리(마스터플랜 ID73 설계 원칙).
  // ================================================================
  // ⚠️ 2026-08(조정방향2): DISTRICT_OFFSET_KM(중앙에서 동서남북 대표지점까지 2.5km)은
  // 더 이상 쓰지 않는다. 아래 openDistrictWeatherView 주석 참고 - 가상 지점을 만드는
  // 대신 검색 좌표에서 가까운 순서로 카메라를 직접 고른다. offsetLatLng는 다른 곳에서도
  // 쓰일 수 있어 함수는 남겨둔다.
  var DISTRICT_CCTV_COUNT = 5; // 한 화면에 보여줄 카메라 수(2×3 격자에 맞춘 값)

  // 위도 1도≈111km, 경도 1도≈111km×cos(위도) 근사식으로 남북/동서 오프셋 좌표 계산.
  // 정밀 측지 계산은 아니지만 "동서남북 대표지점 하나씩 잡기" 용도로는 충분함.
  function offsetLatLng(lat, lng, dLatKm, dLngKm) {
    return {
      lat: lat + (dLatKm / 111),
      lng: lng + (dLngKm / (111 * Math.cos(lat * Math.PI / 180)))
    };
  }

  function openDistrictWeatherView(query, center) {
    // ⚠️ 2026-08 회귀 수정: 검색과 화면보기를 하나로 합치면서 "지도가 그 지역으로
    // 이동하는 것"을 함께 옮기지 않아, 제주를 검색해도 지도가 서울에 머무는 문제가
    // 생겼다(실사용 지적). 화면을 닫았을 때 그 지역에 있어야 이어서 둘러볼 수 있다.
    // 팝업 뒤 배경 지도도 그 지역을 비추고 있어야 결과가 어디인지 납득된다.
    mapSetCenter(center.lat, center.lng);
    mapSetLevel(6);
    var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">검색하신 곳에서 가까운 순서로 CCTV 5곳입니다 · 눌러서 크게 보기</p>' +
      '<div id="districtGrid" class="nwGrid"></div>';
    // ⚠️ 2026-08 제목 변경(조정방향1): 예전 제목은 "ㅇㅇ 지금 모습"이었다. 검색어가
    // "충주" 같은 지역명일 때는 문제가 없었지만, "ㅇㅇ휴게소"처럼 좁은 지점을 검색하면
    // 화면에 뜨는 것은 그 휴게소가 아니라 근처 도로 카메라인데도 제목이 그곳을 보여주는
    // 것처럼 읽혀, 사용자가 착각하고 실망한다는 지적을 받음(실사용 피드백). 이 화면이
    // 보여주는 것은 언제나 "검색지 자체"가 아니라 "검색지 주변 CCTV"이므로 제목이
    // 그렇게 말해야 한다. 아래 안내문과 각 칸의 거리 표시도 같은 사실을 반복해서 알린다.
    // 제목에 검색어(query)를 그대로 넣지만, openModal의 제목 처리는 createTextNode를
    // 써서 HTML로 해석되지 않으므로(위 openModal 참고) 사용자가 입력한 임의 문자열이
    // 섞여도 안전함 - 본문(body)에는 검색어를 넣지 않음.
    openModal('📷 ' + query + ' 주변 CCTV', body, weatherIconSvgDataUrl());
    // 위와 동일한 이유로, 이 지역(query/center)을 다시 열 수 있도록 등록해둠 -
    // query/center를 클로저로 그대로 캡처하므로 재호출 시 동일한 지역이 다시 열림.
    currentReopenFn = function() { openDistrictWeatherView(query, center); };
    // ⚠️ 2026-08(조정방향2): 가상의 동서남북 지점을 만들지 않고, 검색 좌표에서 실제
    // 거리순으로 서로 다른 카메라 5대를 먼저 고른 뒤 그걸 그대로 칸에 채운다.
    var grid = document.getElementById('districtGrid');
    // 카메라를 고르는 동안(반경을 넓혀가며 조회하므로 몇 초 걸릴 수 있음) 빈 화면을
    // 두지 않는다 - 기다려야 하는 상황인지 알 수 없다는 지적을 이미 받은 적이 있다.
    grid.innerHTML = '<div class="nwCard"><div class="nwSpinner">가까운 CCTV를 찾는 중…</div></div>';
    findNearestCctvSet(center.lat, center.lng, DISTRICT_CCTV_COUNT, function(picked) {
      if (!grid || !document.body.contains(grid)) return; // 화면이 이미 닫혔으면 그리지 않음
      grid.innerHTML = '';
      if (!picked.length) {
        grid.innerHTML = '<p style="margin:0;color:#888;font-size:13px;">이 근처에서 볼 수 있는 CCTV를 찾지 못했습니다.</p>';
        return;
      }
      if (picked.length < DISTRICT_CCTV_COUNT) {
        var note = document.createElement('p');
        note.style.cssText = 'margin:0 0 8px;color:#888;font-size:12.5px;';
        note.textContent = '이 근처에서 볼 수 있는 CCTV는 ' + picked.length + '곳입니다.';
        grid.parentNode.insertBefore(note, grid);
      }
      renderCctvGrid(grid, picked.map(function(c) {
        return { label: formatKmLabel(c.km), lat: c.lat, lng: c.lng, item: c.item };
      }), true);
    });
  }

    (function loadVisits() {
      var el = document.getElementById('admVisits');
      if (!el) return;
      var days = [];
      for (var i = 6; i >= 0; i--) {
        var d = new Date(); d.setDate(d.getDate() - i);
        days.push(d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2));
      }
      Promise.all(days.map(function(k) {
        return db.collection('stats').doc(k).get().then(function(s) {
          return { key: k, d: s.exists ? s.data() : null };
        }).catch(function() { return { key: k, d: null }; });
      })).then(function(list) {
        var any = list.some(function(x) { return x.d; });
        if (!any) { el.innerHTML = '<span style="color:#94a3b8;">아직 집계된 방문이 없습니다. (이 버전 배포 이후부터 쌓입니다)</span>'; return; }
        var refs = {};
        var rows = list.map(function(x) {
          var d = x.d || {};
          if (d.referrers) { Object.keys(d.referrers).forEach(function(k) { refs[k] = (refs[k] || 0) + d.referrers[k]; }); }
          return '<tr><td style="padding:3px 8px 3px 0;white-space:nowrap;">' + x.key.slice(5) + '</td>' +
            '<td style="padding:3px 8px;text-align:right;">' + (d.visits || 0) + '</td>' +
            '<td style="padding:3px 8px;text-align:right;color:#0a7d2c;">' + (d.newVisitors || 0) + '</td>' +
            '<td style="padding:3px 8px;text-align:right;">' + (d.searches || 0) + '</td>' +
            '<td style="padding:3px 8px;text-align:right;">' + (d.cctvOpens || 0) + '</td>' +
            '<td style="padding:3px 8px;text-align:right;">' + (d.spotOpens || 0) + '</td>' +
            '<td style="padding:3px 0 3px 8px;text-align:right;">' + (d.registers || 0) + '</td></tr>';
        }).join('');
        var refRows = Object.keys(refs).sort(function(a, b) { return refs[b] - refs[a]; }).slice(0, 8)
          .map(function(k) { return k + ' ' + refs[k]; }).join(' · ');
        el.innerHTML =
          '<div style="overflow-x:auto;"><table style="border-collapse:collapse;font-size:12px;color:#475569;">' +
          '<tr style="color:#94a3b8;"><th style="text-align:left;padding-right:8px;">날짜</th><th style="padding:0 8px;">방문</th>' +
          '<th style="padding:0 8px;">신규</th><th style="padding:0 8px;">검색</th><th style="padding:0 8px;">CCTV</th>' +
          '<th style="padding:0 8px;">기록</th><th style="padding-left:8px;">등록</th></tr>' + rows + '</table></div>' +
          '<div style="margin-top:6px;font-size:11.5px;color:#64748b;">유입: ' + (refRows || '없음') + '</div>' +
          '<p style="margin:6px 0 0;font-size:11.5px;color:#94a3b8;">개인을 식별하는 값(IP·기기식별값·이메일)은 저장하지 않습니다. ' +
          '유입은 도메인만 남기며, 링크에 <b>?from=yt&amp;v=이름</b>을 붙이면 영상 단위로 구분됩니다.</p>';
      });
    })();

    // 소유자 통합 - 미리보기 먼저, 확인 후 실행
    var mgBtn = document.getElementById('admMerge');
    if (mgBtn) mgBtn.addEventListener('click', function() {
      var box = document.getElementById('admMergeBox');
      var me = firebase.auth().currentUser && firebase.auth().currentUser.uid;
      if (!me) { box.textContent = '관리자 로그인 상태가 아닙니다.'; return; }
      mgBtn.disabled = true; mgBtn.textContent = '조회 중…';
      db.collection('spots').get().then(function(qs) {
        var byOwner = {}, targets = [];
        qs.forEach(function(d) {
          var o = d.data().ownerId || '(없음)';
          byOwner[o] = (byOwner[o] || 0) + 1;
          if (o !== me) targets.push(d.ref);
        });
        var lines = Object.keys(byOwner).sort(function(a, b) { return byOwner[b] - byOwner[a]; })
          .map(function(o) {
            var mark = o === me ? ' ← 관리자(그대로)' : '';
            return '<div>' + o.slice(0, 12) + '… <b>' + byOwner[o] + '건</b>' + mark + '</div>';
          }).join('');
        box.innerHTML = '<div style="margin:8px 0;padding:10px;background:#f8fafc;border-radius:8px;">' + lines +
          '<div style="margin-top:8px;color:#b91c1c;">옮길 대상: <b>' + targets.length + '건</b> → 관리자 계정</div>' +
          (targets.length ? '<button id="admMergeGo" style="margin-top:8px;border:none;border-radius:6px;padding:7px 14px;font-size:12px;cursor:pointer;background:#b91c1c;color:#fff;">' +
            targets.length + '건 옮기기</button>' : '<div style="margin-top:6px;color:#0a7d2c;">이미 모두 관리자 소유입니다.</div>') +
          '</div>';
        mgBtn.disabled = false; mgBtn.textContent = '다시 확인';
        var go = document.getElementById('admMergeGo');
        if (go) go.addEventListener('click', function() {
          if (!confirm(targets.length + '건의 소유자를 관리자 계정으로 옮깁니다.\n내용은 바뀌지 않습니다. 진행할까요?')) return;
          go.disabled = true; go.textContent = '옮기는 중…';
          // Firestore 배치는 한 번에 500건까지라 나눠서 보낸다
          var chunks = [];
          for (var i = 0; i < targets.length; i += 400) chunks.push(targets.slice(i, i + 400));
          var p = Promise.resolve();
          chunks.forEach(function(c) {
            p = p.then(function() {
              var b = db.batch();
              c.forEach(function(ref) { b.update(ref, { ownerId: me }); });
              return b.commit();
            });
          });
          p.then(function() {
            showStatus('✅ ' + targets.length + '건의 소유자를 통합했습니다.');
            renderAdminConsole();
          }).catch(function(e) { alert('통합 실패: ' + e.message); go.disabled = false; go.textContent = '다시 시도'; });
        });
      }).catch(function(e) {
        box.textContent = '조회 실패: ' + e.message;
        mgBtn.disabled = false; mgBtn.textContent = '확인';
      });
    });

    // 7. 기존 기록 공개범위 채우기 (일회성)
    var bfBtn = document.getElementById('admBackfill');
    if (bfBtn) bfBtn.addEventListener('click', function() {
      if (!confirm('공개범위 필드가 없는 기존 기록에 "공개"를 명시합니다.\n이미 공유된 링크가 깨지지 않도록 공개로 채웁니다. 진행할까요?')) return;
      bfBtn.disabled = true; bfBtn.textContent = '진행 중…';
      db.collection('spots').get().then(function(qs) {
        var targets = [];
        qs.forEach(function(s) { if (!s.data().visibility) targets.push(s.ref); });
        if (!targets.length) { showStatus('채울 기록이 없습니다. 이미 모두 설정되어 있어요.'); bfBtn.disabled = false; bfBtn.textContent = '실행'; return; }
        var batch = db.batch();
        targets.forEach(function(ref) { batch.update(ref, { visibility: VISIBILITY.PUBLIC }); });
        return batch.commit().then(function() {
          showStatus('✅ ' + targets.length + '건에 공개범위를 채웠습니다.');
          bfBtn.disabled = false; bfBtn.textContent = '실행';
        });
      }).catch(function(err) {
        alert('채우기 실패: ' + err.message);
        bfBtn.disabled = false; bfBtn.textContent = '실행';
      });
    });

    document.querySelectorAll('.admSrcBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var k = btn.getAttribute('data-key');
        CCTV_SOURCES[k] = !CCTV_SOURCES[k];
        db.collection('config').doc('settings').set({ cctvSources: CCTV_SOURCES }, { merge: true })
          .then(function() {
            cctvClientCache = {}; // 소스가 바뀌었으니 캐시를 버리고 다시 받아야 함
            showStatus('✅ ' + k + ' 소스를 ' + (CCTV_SOURCES[k] ? 'ON' : 'OFF') + '으로 저장했습니다.');
            if (cctvVisible) loadCctvMarkers();
            renderAdminConsole();
          })
          .catch(function(err) { alert('저장 실패: ' + err.message); });
      });
    });

    var outBtn = document.getElementById('admLogoutBtn');
    if (outBtn) outBtn.addEventListener('click', function() {
      firebase.auth().signOut().then(function() {
        closeModal();
        showStatus('관리자 모드를 해제했습니다.');
      }).catch(function(err) { alert('로그아웃 실패: ' + err.message); });
    });

    var enBtn = document.getElementById('admCctvEnable');
    if (enBtn) enBtn.addEventListener('click', function() {
      var newVal = !CCTV_ENABLED;
      db.collection('config').doc('settings').set({ cctvEnabled: newVal }, { merge: true }).then(function() {
        CCTV_ENABLED = newVal;
        updateCctvButtonVisibility();
        updateConceptButtonVisibility();
        renderAdminConsole();
      }).catch(function(err) { alert('저장 실패: ' + err.message); });
    });

    var hBtn = document.getElementById('admHours');
    if (hBtn) hBtn.addEventListener('click', function() {
      var val = prompt('현장 제보를 "최근"으로 표시할 기준 시간(시간 단위)', RECENT_REPORTS_HOURS);
      if (val === null) return;
      var n = parseInt(val, 10);
      if (isNaN(n) || n <= 0) { alert('1 이상의 숫자를 입력해주세요.'); return; }
      db.collection('config').doc('settings').set({ recentReportsHours: n }, { merge: true }).then(function() {
        RECENT_REPORTS_HOURS = n;
        renderAdminConsole();
      }).catch(function(err) { alert('저장 실패: ' + err.message); });
    });

    // 커버리지 현황 - "어디가 되고 어디가 안 되는지"를 상시 확인.
    // 전국을 5km 격자로 나눠 시군구별로 묶은 값(coverage-build.js가 미리 산출).
    // 카메라가 없는 격자도 기상청 실황은 100% 덮으므로 그 대비도 함께 보여준다.
    if (CCTV_PROXY_BASE_URL) {
      fetch(CCTV_PROXY_BASE_URL + '/api/coverage').then(function(r) {
        if (!r.ok) throw new Error(r.status === 404 ? '아직 산출 전' : ('HTTP ' + r.status));
        return r.json();
      }).then(function(cv) {
        var el = document.getElementById('admCoverage');
        if (!el) return;
        var sm = cv.summary || {};
        // ⚠️ 격자(5km)보다 작은 구는 카메라가 옆 구 격자로 집계돼 0대처럼 보인다.
        // 광주 동구가 그 예로, 실제로는 그 범위에 UTIC 카메라만 41대가 있다.
        // 데이터 공백이 아니라 집계 방식의 한계이므로 취약 지역 목록에서 제외한다 -
        // 그러지 않으면 멀쩡한 도심을 계속 취약지역으로 오인하게 된다.
        var worst = (cv.regions || []).filter(function(g) { return !g.tooSmall; })
          .slice(0, 8).map(function(g) {
            return g.sido + ' ' + g.sigungu + ' ' + g.rate + '%(' + g.total + '대)';
          }).join(' · ');
        var smallN = (cv.summary || {}).smallRegionsUnknown || 0;
        var d = (cv.builtAt || '').slice(0, 10);
        el.innerHTML =
          '전국 육지 격자 ' + sm.landCells + '개 중 <b>' + sm.coveredCells + '개 커버 (' + sm.coverageRate + '%)</b><br>' +
          '카메라 ' + sm.cameras + '대 · 시군구 ' + sm.regions + '곳 · 기준일 ' + d + '<br>' +
          '<span style="color:#c2410c;">취약 지역: ' + (worst || '-') + '</span><br>' +
          (smallN ? '<span style="color:#94a3b8;">격자보다 작아 지표를 유보한 구 ' + smallN + '곳(실제로는 카메라가 있음)</span><br>' : '') +
          '<span style="color:#64748b;">카메라가 없는 격자도 기상청 실황은 전국 100% 응답합니다.</span>';
        el.style.color = '#475569';
      }).catch(function(e) {
        var el = document.getElementById('admCoverage');
        if (el) {
          el.textContent = '커버리지 자료 없음 (' + e.message + ') — 서버에서 coverage-build.js 실행 필요';
          el.style.color = '#c2410c';
        }
      });
    }

    // 서버가 살아있는지, 각 소스가 실제로 응답하는지 관리자 화면에서 바로 확인
    var el = document.getElementById('admHealth');
    if (el && CCTV_PROXY_BASE_URL) {
      // ⚠️ 2026-08 수정: 예전에는 네 소스를 모두 "서울 도심" 한 좌표로 찔러봤다.
      // 그런데 국토부(고속도로·국도)와 지자체(충주·제주·울산) 카메라는 서울 도심에
      // 없는 것이 정상이라 늘 0대로 나왔고, 소스가 죽은 것과 구분이 되지 않았다.
      // 점검은 "그 소스가 실제로 카메라를 가진 지역"에서 해야 의미가 있다.
      var checks = [
        ['국토부(천안 부근 고속·국도)', '/api/its-cctv?minX=127.05&maxX=127.25&minY=36.75&maxY=36.95'],
        ['UTIC(서울 도심)', '/api/utic-snapshot-list?minX=126.95&maxX=127.05&minY=37.53&maxY=37.60'],
        ['지자체(울산)', '/api/local-cctv?minX=129.20&maxX=129.45&minY=35.45&maxY=35.65'],
        ['경기(수원)', '/api/gg-cctv?minX=126.95&maxX=127.10&minY=37.20&maxY=37.35']
      ];
      Promise.all(checks.map(function(c) {
        return fetch(CCTV_PROXY_BASE_URL + c[1]).then(function(r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).then(function(d) {
          return c[0] + ' ' + (extractCctvItems(d).length) + '대';
        }).catch(function(e) { return c[0] + ' 실패(' + e.message + ')'; });
      })).then(function(rows) {
        var el2 = document.getElementById('admHealth');
        if (el2) {
          el2.innerHTML = rows.join('<br>') +
            '<br><span style="color:#94a3b8;">소스마다 카메라가 실제로 있는 지역을 표본으로 점검합니다. 0대나 실패가 보이면 그 소스가 응답하지 않는 것입니다.</span>';
          el2.style.color = '#475569';
        }
      });
    }
  }

  // 관리자 전용: 전체 사용자에게 CCTV 기능을 공개할지(cctvEnabled) 조정
  function renderCctvAdminModal() {
    var body = '<p style="margin-bottom:14px;">현재 전체 사용자에게 CCTV 기능이 ' +
      (CCTV_ENABLED ? '<b style="color:#0a7d2c;">켜져</b>' : '<b style="color:#c0392b;">꺼져</b>') + ' 있습니다.</p>' +
      '<button id="cctvEnableToggleBtn" style="padding:10px 16px;border-radius:8px;border:none;background:' +
      (CCTV_ENABLED ? '#c0392b' : '#0a7d2c') + ';color:white;cursor:pointer;">' +
      (CCTV_ENABLED ? '전체 사용자 대상 끄기' : '전체 사용자 대상 켜기') + '</button>' +
      '<p style="margin-top:12px;font-size:12px;color:#888;">관리자 화면에는 이 설정과 무관하게 항상 CCTV 버튼이 보입니다(사전 검증용).</p>';
    openModal('⚙️ CCTV 공개 설정', body);
    var t = document.getElementById('cctvEnableToggleBtn');
    if (t) t.addEventListener('click', function() {
      var newVal = !CCTV_ENABLED;
      db.collection('config').doc('settings').set({ cctvEnabled: newVal }, { merge: true }).then(function() {
        CCTV_ENABLED = newVal;
        showStatus('✅ CCTV 공개 설정이 ' + (newVal ? 'ON' : 'OFF') + '으로 저장되었습니다.');
        renderCctvAdminModal();
      }).catch(function(err) { alert('저장 실패: ' + err.message); });
    });
  }
  // 관리자 콘솔은 더보기 시트에서 연다(ID103) - 떠 있는 ⚙️ 버튼은 제거

  function renderRecentReports() {
    var cutoff = Date.now() - RECENT_REPORTS_HOURS * 3600 * 1000;
    var sceneSpots = sharedSpots.filter(function(s) {
      return s.category === 'scene' && s.createdAt && s.createdAt >= cutoff;
    }).sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    // 관리자에게만 보이는 기준 조정 안내 - 일반 사용자는 조정 여부를 알 필요가 없어 숨김
    var adminControl = isAdmin
      ? '<div style="margin-bottom:10px;padding:8px 10px;background:#eef2ff;border-radius:8px;font-size:12px;color:#4338ca;display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
        '<span>표시 기준: 최근 ' + RECENT_REPORTS_HOURS + '시간 이내</span>' +
        '<button id="recentReportsThresholdBtn" style="flex:0 0 auto;border:none;background:#4338ca;color:white;padding:5px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;">기준 변경</button></div>'
      : '';

    if (sceneSpots.length === 0) {
      openModal('🚨 최근 현장 제보', adminControl + '<p style="color:#888;">최근 ' + RECENT_REPORTS_HOURS + '시간 이내 등록된 현장 제보가 없습니다.</p>');
    } else {
      var body = adminControl + '<div style="display:flex;flex-direction:column;gap:8px;">' +
        sceneSpots.map(function(s, idx) {
          var ago = s.createdAt ? timeAgoLabel(s.createdAt) : '';
          return '<button class="recentReportBtn" data-idx="' + idx + '" style="text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #fecaca;background:#fff7f7;cursor:pointer;font-size:14px;">🚨 ' + s.name +
            (ago ? '<br><span style="font-size:11px;color:#c2410c;">' + ago + ' 등록</span>' : '') + '</button>';
        }).join('') + '</div>';
      openModal('🚨 최근 현장 제보 (' + sceneSpots.length + '건)', body);
      document.querySelectorAll('.recentReportBtn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          openSpotModal(sceneSpots[parseInt(btn.getAttribute('data-idx'), 10)]);
        });
      });
    }

    var thresholdBtn = document.getElementById('recentReportsThresholdBtn');
    if (thresholdBtn) {
      thresholdBtn.addEventListener('click', function() {
        var val = prompt('현장 제보를 "최근"으로 표시할 기준 시간을 입력하세요 (시간 단위, 현재: ' + RECENT_REPORTS_HOURS + '시간)', RECENT_REPORTS_HOURS);
        if (val === null) return;
        var n = parseInt(val, 10);
        if (isNaN(n) || n <= 0) { alert('1 이상의 숫자를 입력해주세요.'); return; }
        RECENT_REPORTS_HOURS = n;
        db.collection('config').doc('settings').set({ recentReportsHours: n }, { merge: true }).then(function() {
          showStatus('✅ 최근 제보 기준이 ' + n + '시간으로 저장되었습니다.');
          renderRecentReports();
        }).catch(function(err) {
          alert('저장 실패: ' + err.message);
        });
      });
    }
  }
  // recentReportsBtn 은 더보기 시트로 이동(ID103)

  // 등록모드일 때는 지도를 몇 번을 클릭(줌 조정 후 재클릭 포함)해도 항상 등록창이 뜸
  mapOnClick(function(pos) {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } // 짧게 뗀 경우 롱프레스 타이머 취소
    if (suppressNextMapClick) { suppressNextMapClick = false; return; } // 롱프레스로 이미 처리된 클릭은 무시(ID 67)
    if (!placingMode) return;
    // 고치기 화면에서 "지도에서 다시 지정"으로 들어온 경우 - 등록이 아니라 위치만 옮긴다
    if (pendingRelocate) {
      var targetId = pendingRelocate;
      pendingRelocate = null;
      exitPlacingMode();
      db.collection('spots').doc(targetId).update({ lat: pos.lat, lng: pos.lng }).then(function() {
        showStatus('📍 위치를 옮겼습니다.');
        setTimeout(openMyRecords, 350);
      }).catch(function(e) { alert('위치를 옮기지 못했습니다: ' + e.message); });
      return;
    }
    pendingLatLng = pos; // {lat, lng}
    openRegisterForm();
  });

  // 현위치 버튼: 평소엔 지도만 이동, 등록모드 중이면 그 자리로 바로 등록창까지 오픈
  document.getElementById('locateBtn').addEventListener('click', function() {
    askGeoConsent(runLocateFlow); // ID106 - 지도 이동도 같은 측위이므로 같은 동의를 거친다
  });
  function runLocateFlow() {
    if (!navigator.geolocation) {
      showStatus('이 브라우저는 위치 확인을 지원하지 않습니다.');
      return;
    }
    // ⚠️ 2026-08: 위치 기능은 https에서만 동작한다. 휴대폰에서 주소창에 nowthere.net만
    // 치면 http로 열리는 경우가 있는데, 그러면 브라우저가 위치를 아예 차단하면서도
    // 겉으로는 "권한 거부"와 똑같이 보인다. 도메인 전환 직후 실사용에서 이 혼동이
    // 발생했다(권한 문제로 오해). 원인을 구분해서 알려준다.
    if (!window.isSecureContext) {
      showStatus('⚠️ 위치 기능은 https 주소에서만 동작합니다 — https://nowthere.net 으로 열어주세요.');
      return;
    }
    showStatus('📡 위치 확인 중...');
    navigator.geolocation.getCurrentPosition(function(pos) {
      var here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      mapSetCenter(here.lat, here.lng);
      mapSetLevel(3);

      mapRemoveMarker(myLocationMarker);
      myLocationMarker = mapCreateLocationMarker(here.lat, here.lng);

      if (placingMode) {
        pendingLatLng = here;
        openRegisterForm();
      } else {
        showStatus('현재 위치로 이동했습니다.');
      }
    }, function(err) {
      // 실패 사유를 구분해서 안내한다. 도메인이 바뀌면 위치 권한은 새 주소에 대해
      // 처음부터 다시 받아야 하는데(주소별로 따로 관리됨), 예전 주소에서 허용했던
      // 기억 때문에 "권한은 이미 줬는데 왜 안 되지"로 헤매게 된다.
      console.warn('[위치] 실패 코드=' + (err && err.code) + ' · ' + (err && err.message));
      var msg = '⚠️ 위치 확인 실패 — 위치 권한을 확인해주세요.';
      if (err && err.code === 1) {
        msg = '⚠️ 위치 권한이 거부되어 있습니다 — 주소창 왼쪽 자물쇠(또는 ⓘ)를 눌러 이 사이트의 위치 권한을 허용으로 바꿔주세요.';
      } else if (err && err.code === 2) {
        msg = '⚠️ 위치를 찾지 못했습니다 — 실내이거나 신호가 약할 수 있습니다. 잠시 후 다시 시도해주세요.';
      } else if (err && err.code === 3) {
        msg = '⚠️ 위치 확인이 오래 걸립니다 — 잠시 후 다시 시도해주세요.';
      }
      showStatus(msg);
    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
  }

      if (!urlInput || !urlHint) return;
      var v = urlInput.value.trim();

  // CCTV 영상(hls.js)이 재생 중일 때 모달이 다른 내용으로 바뀌거나 닫히면 재생을 확실히
  // 멈추기 위한 핸들 - 안 멈추면 화면엔 안 보여도 백그라운드에서 계속 스트림을 받습니다.
  var currentCctvHls = null;
  var cctvImageRefreshTimer = null;
  var cctvLiveLimitTimer = null; // 제공기관이 건 시청 제한(제주 30초)용 // CCTV 정지영상 자동 새로고침 타이머 - 모달이 바뀌거나 닫히면 반드시 정리
  function stopCctvPlayback() {
    if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); cctvLiveLimitTimer = null; }
    if (currentCctvHls) { currentCctvHls.destroy(); currentCctvHls = null; }
    if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
  }

  // ================================================================
  // 실시간 인라인 재생 (ID 74, 2026-07)
  // 예전엔 cctvsec.ktict.co.kr이 CORS/혼합콘텐츠로 막힐 것으로 추정되어 비활성 상태로
