  // 최근 현장(공익 제보) 목록 — 최신 등록순, 등록시각 강조 표시 (대관령 사례형 공익 제보 지원)
  // 등록량이 늘어날수록 오래된 제보까지 계속 섞여 나와 "최근"이라는 의미가 흐려지는 문제가 있어,
  // 일정 시간(RECENT_REPORTS_HOURS) 이내 등록된 것만 표시. 데이터가 느는 속도를 미리 예측하기
  // 어려워 코드에 고정하지 않고 Firestore(config/settings)에 저장해 관리자가 직접 조정 가능하게 함
  var RECENT_REPORTS_HOURS = 48; // Firestore에 설정값이 없을 때 쓰는 기본값
  // CCTV 연동 전체 공개 여부 - 관리자가 config/settings.cctvEnabled로 조정 (ID 69)
  // 검증 전까지는 기본값 false로 두어 일반 사용자에게는 노출하지 않음
  var CCTV_ENABLED = false;

  // ⚠️ 2026-08 (ID69 확장): CCTV 소스가 다섯 개로 늘면서 "전체 켜기/끄기" 하나로는
  // 운영이 안 됨. 소스마다 우리 서버 비용이 다르기 때문임(실측).
  //   its         국토부 고속도로·국도 정지영상 - 브라우저가 원본에서 직접 받음. 비용 0
  //   uticCity    경찰청 UTIC 도심 CCTV(2,016대) - 대부분 CORS 허용이라 직접 재생. 비용 0
  //   local       지자체 자체 사이트(충주 등) - HLS·CORS 허용. 비용 0
  //   uticStill   UTIC 고속도로·국도 정지영상 중계 - 장당 110KB, 15초 공유캐시. 비용 매우 작음
  //   gg          경기 GITS 실시간 - CORS가 없어 중계 필수. 시청 1시간당 약 0.9GB. 유일한 실질 비용
  // 커버리지 분석 결과 유료 소스(gg + 도심 일부)가 추가로 덮는 5km 격자는 전체 2,463개
  // 중 34개뿐이었다. 그래서 gg는 기본값을 꺼두고, 필요할 때 관리자가 켜도록 한다.
  var CCTV_SOURCES = { its: true, uticStill: true, uticCity: true, local: true, gg: false };
  var CCTV_SOURCE_INFO = [
    { key: 'its',       label: '국토부 고속도로·국도(정지영상)', cost: '무료' },
    { key: 'uticCity',  label: '경찰청 UTIC 도심 CCTV',        cost: '무료' },
    { key: 'local',     label: '지자체 자체(충주 등)',          cost: '무료' },
    { key: 'uticStill', label: 'UTIC 고속도로·국도 중계',       cost: '거의 없음' },
    { key: 'gg',        label: '경기 GITS 실시간',             cost: '유료(중계)' }
  ];

  db.collection('config').doc('settings').get().then(function(doc) {
    if (doc.exists && typeof doc.data().recentReportsHours === 'number') {
      RECENT_REPORTS_HOURS = doc.data().recentReportsHours;
    }
    if (doc.exists && typeof doc.data().cctvEnabled === 'boolean') {
      CCTV_ENABLED = doc.data().cctvEnabled;
    }
    if (doc.exists && doc.data().cctvSources) {
      var saved = doc.data().cctvSources;
      Object.keys(CCTV_SOURCES).forEach(function(k) {
        if (typeof saved[k] === 'boolean') CCTV_SOURCES[k] = saved[k];
      });
    }
    updateCctvButtonVisibility();
  }).catch(function(err) { console.error('설정 로드 실패:', err); });

  // ================================================================
  // CCTV 연동 (ID 69) - 관리자 온/오프 스위치 + 지도 표시
  // ================================================================
  var cctvMarkers = [];
  var cctvVisible = false;

  // 공개설정(CCTV_ENABLED)이 꺼져 있어도 관리자는 사전 검증을 위해 버튼을 계속 볼 수 있음
  function updateCctvButtonVisibility() {
    var toggleBtn = document.getElementById('cctvToggleBtn');
    var adminBtn = document.getElementById('cctvAdminBtn');
    if (toggleBtn) toggleBtn.style.display = (CCTV_ENABLED || isAdmin) ? 'block' : 'none';
    if (adminBtn) adminBtn.style.display = isAdmin ? 'block' : 'none';
  }

  // ⚠️ 2026-07: 지금까지는 지도 화면(bounds)에 걸리는 CCTV를 확대·축소 단계와 무관하게
  // 전부 마커로 찍어서, 도로 위에서는 아이콘이 줄지어 보이고 전국 단위로 축소하면
  // 아이콘 무더기만 보이는 문제가 있었음(네이버는 축소할수록 주요 지점만 보이다가
  // 확대하면 비율적으로 늘어남).
  // 처음엔 카카오맵 SDK 공식 클러스터러(MarkerClusterer)로 시도했는데, 이건 마커가
  // 겹칠 정도로 축소되면 개별 아이콘 대신 "숫자가 적힌 원형 배지" 하나로 뭉쳐 보여주는
  // 방식이라 사용자가 원하는 그림(네이버처럼 숫자로 뭉치지 않고, 개별 우산 아이콘이
  // 항상 유지된 채로 그 개수만 지도 스케일에 비례해서 고르게 줄었다 늘었다 하는 것)과
  // 다르다는 피드백을 받아 폐기함.
  // 대신 격자(그리드) 기반 솎아내기를 직접 구현: 현재 화면(bounds)을 cellsPerAxis x
  // cellsPerAxis 칸으로 나누고, 한 칸에는 대표 CCTV 1개만 남김. 칸 개수는 확대 단계
  // (level, 카카오맵 기준 숫자가 작을수록 확대)에 따라 달라져서, 축소할수록(level 큼)
  // 칸이 커져 소수만 고르게 보이고, 확대할수록(level 작음) 칸이 촘촘해져 개별 카메라가
  // 거의 다 보이게 됨 - 숫자 배지 없이 "아이콘 개수만" 스케일에 비례해서 변함.
  // ⚠️ 2026-07 조정(1차): 전국 단위로 축소했을 때 8개 정도만 남아 휑해 보인다는
  // 피드백으로 최소 칸 개수를 3→8(최소 8x8=64칸)로 올렸었음.
  // ⚠️ 2026-07 조정(2차): 사용자가 보내준 네이버 지도 스크린샷(전국이 거의 다 보이는
  // 축소 단계)을 픽셀로 세어보니 그 화면 안에만 CCTV 아이콘이 대략 70~100개 정도
  // 고르게 깔려 있었음 - 64칸으로는 어차피 최대 64개까지밖에 못 채우니 부족했던
  // 것으로 보임. 최소 칸 개수 하한선을 8→14(최소 14x14=196칸)로 다시 올리고,
  // 확대할 때 더 촘촘해지는 상한도 16→26으로 같이 올림.
  // ⚠️ 2026-07: 네이버는 축소할수록 "고속도로가 만나는 교차점" 같은 주요 지점 위주로
  // 남기는데, 이전 버전은 격자 한 칸에 "먼저 나온 항목"을 그냥 대표로 뽑아서 실제로는
  // 국도(its) 카메라가 뽑히는 경우가 많았음(고속도로는 국도보다 커버리지가 훨씬 좁아서
  // 칸 안에 아예 없는 경우가 많기 때문). 이제 서버가 각 항목에 roadType('ex'=고속도로,
  // 'its'=국도)을 붙여주므로, 1차로 고속도로만으로 격자를 채우고 → 2차로 아직 빈 칸만
  // 국도로 채우는 2단계 방식으로 바꿈. 이러면 축소했을 때는 고속도로 위주로, 확대하면
  // 국도까지 촘촘히 채워지는 흐름이 자연스럽게 나옴.
  function decimateCctvList(list, bounds, level) {
    var cellsPerAxis = Math.max(14, Math.min(26, 30 - level));
    var lngSpan = Math.max(bounds.maxX - bounds.minX, 0.0001);
    var latSpan = Math.max(bounds.maxY - bounds.minY, 0.0001);
    var cellLng = lngSpan / cellsPerAxis;
    var cellLat = latSpan / cellsPerAxis;
    var picked = {};
    var out = [];
    function cellKeyFor(item) {
      var lat = parseFloat(item.coordy), lng = parseFloat(item.coordx);
      if (isNaN(lat) || isNaN(lng)) return null;
      var col = Math.floor((lng - bounds.minX) / cellLng);
      var row = Math.floor((lat - bounds.minY) / cellLat);
      return row + '_' + col;
    }
    function fillPass(items) {
      items.forEach(function(item) {
        var key = cellKeyFor(item);
        if (key === null || picked[key]) return; // 좌표 이상하거나 이 칸엔 이미 대표가 있음
        picked[key] = true;
        out.push(item);
      });
    }
    fillPass(list.filter(function(item) { return item.roadType === 'ex'; }));  // 1차: 고속도로부터
    fillPass(list.filter(function(item) { return item.roadType !== 'ex'; }));  // 2차: 남은 빈 칸을 국도/경기(gg) 등으로
    return out;
  }

  function clearCctvMarkers() {
    cctvMarkers.forEach(mapRemoveMarker);
    cctvMarkers = [];
  }

  // entry: { name, lat, lng, imageUrl, streamUrl } - 마커를 처음 클릭했을 때도,
  // 하단 "확인한 곳" 목록(restoreBar)에서 다시 클릭했을 때도 이 함수 하나로 처리함
  // (openCctvPopup 분리 전에는 마커 클릭 핸들러 안에만 있어서 목록에서 재사용할 수 없었음).
  function openCctvPopup(entry) {
    var name = entry.name, lat = entry.lat, lng = entry.lng;
    var streamUrl = entry.streamUrl, imageUrl = entry.imageUrl;
    if (!imageUrl && !streamUrl && !entry.streamResolve) {
      showStatus('⚠️ ' + name + ' - 영상 정보를 받아오지 못했습니다.');
      return;
    }
    recordCctvHistory(entry); // 다시 열람해도 "최근 확인"으로 맨 앞으로 이동
    // ⚠️ 2026-07: 실시간 스트리밍(hls.js, 새 창 모두)은 cctvsec.ktict.co.kr이
    // 우리 서버(데이터센터 IP)와 브라우저 직접요청(CORS로 추정) 양쪽 다 막아서
    // 페이지 안 재생이 사실상 불가능함을 확인함. 반면 이 기능의 실제 목적("그
    // 위치에 지금 비/눈이 오는지 확인")에는 정지영상(사진) 한 장으로 충분하고,
    // ITS의 cctvType=3(정지영상) 주소는 세션 토큰 없는 단순 파일이라 우리 서버·
    // 브라우저 모두 문제없이 받아짐이 실제 테스트로 확인됨. 그래서 사진을 기본으로
    // 페이지 안에 바로 보여주고(스트리밍처럼 CORS/차단 문제가 없어 로딩 지연·
    // 검은 화면 없이 즉시 표시됨), 실시간 영상은 원하는 사람만 보는 보조 옵션으로 남겨둠.
    if (imageUrl || streamUrl || entry.streamResolve) {
      // 위치 이름이 제목표시줄과 본문에 중복 표시되던 것을 정리 - 제목표시줄은
      // "이곳 날씨도 확인"(공통 안내)+아이콘을 담당하고, 위치 이름은 본문에 한
      // 번만 표시. 아이콘도 이모지(☔) 대신 지도 마커와 같은 SVG 이미지를 써서
      // 기기마다 다르게 보이던 문제를 없앰(weatherIconSvgDataUrl 참고).
      // ⚠️ 2026-07: ITS 정지영상은 카메라 원본 해상도가 4:3 프레임보다 좁아서(예:
      // 320x240 안에 실제 화면이 4:3보다 좁게 들어있는 경우) 여백이 남는 경우가
      // 있음을 확인함 - object-fit:cover로 크롭해도 원본 이미지 자체에 이미 여백이
      // 있으면 CSS로는 없앨 수 없고, 카메라마다 여백 위치/크기가 달라서 어떤 카메라는
      // 버튼이 빈 공간 위에, 어떤 카메라는 실제 화면 위에 겹쳐 보일 수 있음(기기 차이가
      // 아니라 카메라별 원본 이미지 차이로 추정).
      // ⚠️ 2026-07 재조정: "LIVE"라는 단어만 있으니 지금 보이는 화면(정지영상)이 실시간
      // 재생 중인 것처럼 오해할 수 있다는 피드백을 받음 - 그래서 (1)이미지 좌상단에
      // "정지영상 · 자동새로고침" 배지를 따로 붙여 지금 보이는 게 정지 사진이라는 걸
      // 먼저 명시하고, (2)우상단 버튼 문구를 "LIVE" → "🔴 LIVE 보기"로 바꿔 클릭해야
      // 실시간 화면으로 이동하는 "동작"임을 분명히 함, (3)하단 안내문도 "재생됩니다"
      // 대신 "정지영상입니다"를 먼저 말하도록 순서를 바꿈.
      // ⚠️ 2026-07 추가: LIVE 보기를 새 창이 아니라 팝업 안에서 바로 재생(hls.js)하도록
      // 변경 - 실제 배포 환경(HTTPS)에서 재생 성공을 확인함(CCTV_LIVE_INLINE_ENABLED
      // 참고). 실패 시(구형 브라우저, 특정 카메라 오류 등)에는 자동으로 정지영상+새 창
      // 링크로 되돌아감(아래 onError 콜백).
      var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">' + name + '</p>' +
        '<div style="position:relative;">' +
        '<img id="cctvSnapshotImg" style="width:100%;max-width:480px;aspect-ratio:4/3;' +
        'object-fit:cover;border-radius:8px;background:#eee;display:block;" />' +
        '<video id="cctvLiveVideo" style="display:none;width:100%;max-width:480px;' +
        'aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#000;" ' +
        'controls muted playsinline></video>' +
        '<span id="cctvStillBadge" style="position:absolute;top:8px;left:8px;background:rgba(17,24,39,0.7);' +
        'color:#fff;font-size:10.5px;padding:4px 9px;border-radius:12px;">📷 정지영상 · 자동새로고침</span>' +
        (streamUrl ? '<button id="cctvLiveBtn" type="button" ' +
          'style="position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;' +
          'background:rgba(17,24,39,0.82);color:#fff;font-size:11.5px;font-weight:bold;' +
          'padding:6px 11px;border-radius:14px;border:none;cursor:pointer;">🔴 LIVE 보기</button>' : '') +
        '</div>' +
        '<p id="cctvSnapshotErr" style="display:none;margin-top:8px;font-size:12.5px;color:#c0392b;"></p>' +
        '<p id="cctvCaption" style="margin:8px 0 0;font-size:11.5px;color:#aaa;">지금 보이는 화면은 정지영상이며 약 20초마다 자동으로 새로고침됩니다' +
        (streamUrl ? ' · 실시간으로 보려면 우측 상단의 LIVE 보기 버튼을 눌러주세요' : '') +
        '</p>' +
        weatherLinePlaceholder('cctvWeatherLine');
      openModal('이곳 날씨도 확인', body, weatherIconSvgDataUrl());
      // 화면이 흐리거나 밤이라 영상만으로는 판단이 어려울 때를 위한 보완 정보
      fillWeatherLine('cctvWeatherLine', lat, lng);
      var img = document.getElementById('cctvSnapshotImg');
      var video = document.getElementById('cctvLiveVideo');
      var errMsg = document.getElementById('cctvSnapshotErr');
      var stillBadge = document.getElementById('cctvStillBadge');
      var caption = document.getElementById('cctvCaption');
      var liveBtn = document.getElementById('cctvLiveBtn');
      var imageLoadedOnce = false; // 정지영상이 한 번이라도 성공적으로 떴는지 - 실시간 실패 시 되돌아갈 수 있는지 판단용
      img.onload = function() { imageLoadedOnce = true; };

      // ⚠️ 2026-07-29: 경기 GITS 연동 후 일부 카메라(주로 cctvsec.ktict.co.kr 호스트)의
      // 정지영상이 401(Unauthorized)로 막혀 있는 사례가 실사용에서 발견됨(ITS 자체
      // 정지영상은 계속 토큰 없이 정상 동작 - 이 문제는 GG 소스 일부 카메라에 한정).
      // 예전에는 사진이 실패하면 에러 메시지만 띄우고 사용자가 직접 LIVE 버튼을
      // 눌러야 했는데, 이제는 사진이 실패하면 자동으로 실시간 영상으로 전환을
      // 시도해서 사용자가 추가로 클릭할 필요가 없도록 함.
      img.onerror = function() {
        img.style.display = 'none';
        if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
        if (streamUrl) {
          switchToLive();
        } else {
          errMsg.style.display = 'block';
          errMsg.textContent = '사진을 불러오지 못했습니다.';
        }
      };
      function refreshSnapshot() {
        var el = document.getElementById('cctvSnapshotImg');
        if (!el) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; return; }
        el.src = imageUrl + (imageUrl.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now();
      }
      // ⚠️ 2026-08: 지자체 자체 CCTV(충주 등)는 정지영상 없이 HLS 실시간만 제공함.
      // 그런 카메라는 사진 관련 동작을 아예 건너뛰고 곧바로 실시간으로 연다.
      // (예전에는 사진 주소가 없으면 새 창을 열었는데, .m3u8 주소는 브라우저가
      // 재생할 수 있는 페이지가 아니라 주소 글자만 보이는 무의미한 창이 됐음)
      if (imageUrl) {
        refreshSnapshot();
        cctvImageRefreshTimer = setInterval(refreshSnapshot, 20000);
      } else {
        img.style.display = 'none';
        if (stillBadge) stillBadge.style.display = 'none';
      }

      // ⚠️ 2026-07-29: 경기 GITS 일부 카메라의 liveUrl은 hls.js로도 재생이 안 되는
      // 경우가 발견됨(예: gitsview.gg.go.kr:8082의 wmsAuthSign 토큰 방식 - ITS/KTICT
      // 계열과 다른 별도 스트리밍 서버로 추정). 예전에는 인라인 재생 실패 시 무조건
      // window.open(streamUrl)로 새 창을 열었는데, .m3u8 주소 자체는 브라우저가
      // 재생할 수 있는 페이지가 아니라 그냥 원본 URL 텍스트만 보이는 무의미한 새 창이
      // 열리는 문제가 있었음(사용자 실사용으로 확인됨). 이제는 새 창을 자동으로 열지
      // 않고, 정지영상이 있었다면 그쪽으로 되돌아가고(realtime 실패 안내 포함),
      // 정지영상도 없었다면 "이 카메라는 지금 영상을 볼 수 없다"는 명확한 안내와 함께
      // 원하는 사람만 눌러볼 수 있는 링크만 남겨둠(자동 새 창 없음).
      function showLiveFailure() {
        // 재생이 실패했으면 시청 제한 타이머도 의미가 없으므로 함께 정리한다
        // (안 그러면 실패 안내 뒤에 "30초 후 멈췄습니다"가 겹쳐 뜬다 - 실제 발생)
        if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); cctvLiveLimitTimer = null; }
        if (video) video.style.display = 'none';
        if (!errMsg) return;
        errMsg.style.display = 'block';
        if (imageLoadedOnce) {
          if (img) img.style.display = 'block';
          if (stillBadge) stillBadge.style.display = '';
          if (liveBtn) liveBtn.style.display = '';
          errMsg.textContent = '실시간 재생에 실패해 정지영상으로 되돌아갑니다.';
          caption.textContent = '지금 보이는 화면은 정지영상이며 약 20초마다 자동으로 새로고침됩니다';
          refreshSnapshot();
          cctvImageRefreshTimer = setInterval(refreshSnapshot, 20000);
        } else {
          if (liveBtn) liveBtn.style.display = 'none';
          errMsg.textContent = imageUrl
            ? '이 카메라는 사진과 실시간 영상 모두 지금 불러올 수 없습니다 - 카메라 제공사 사정으로 추정됩니다.'
            : '이 카메라는 지금 영상을 불러올 수 없습니다 - 카메라 제공사 사정으로 추정됩니다.';
          caption.innerHTML = streamUrl
            ? '<a href="' + streamUrl + '" target="_blank" rel="noopener" style="color:#4a90d9;">그래도 원본 주소 열어보기(재생 안 될 수 있음)</a>'
            : '잠시 후 다시 시도해주세요.';
        }
      }
      // 경기(GITS) 영상은 주소가 http로 오는 경우가 있어 HTTPS인 우리 페이지에서
      // 브라우저가 아예 차단하고(Mixed Content), CORS 헤더도 없어 hls.js가 직접
      // 읽지 못함. 서버가 relayLive 표시를 붙여준 카메라는 우리 서버의 중계
      // (/api/hls-proxy)를 거쳐 재생함 - 우리 도메인(https) 응답이 되므로 두 문제가
      // 함께 해소됨. 새 창 링크는 원본 주소를 그대로 씀(페이지 밖에서는 직접 열림).
      // ⚠️ 2026-08: 경기(GITS)의 영상 주소에는 유효시간이 있는 토큰이 들어 있어서,
      // 목록을 캐시해둔 뒤(브라우저 30분) 나중에 우산을 누르면 이미 만료된 주소가 됨.
      // 그래서 주소를 들고 있다가 쓰지 않고 좌표만 넘겨, 누르는 순간 서버가 현재
      // 유효한 주소를 새로 받아 중계하도록 함. 이것이 예전부터 "어떤 우산은 되고
      // 어떤 우산은 안 되던" 증상의 원인으로 추정됨(카메라 차이가 아니라 시간 차이).
      var playUrl = streamUrl;
      if (entry.relayLive && CCTV_PROXY_BASE_URL) {
        if (entry.lat != null && entry.lng != null) {
          playUrl = CCTV_PROXY_BASE_URL + '/api/hls-proxy?ggx=' + encodeURIComponent(entry.lng) +
            '&ggy=' + encodeURIComponent(entry.lat);
        } else if (streamUrl) {
          playUrl = CCTV_PROXY_BASE_URL + '/api/hls-proxy?url=' + encodeURIComponent(streamUrl);
        }
      }

      // ⚠️ 2026-08: 제주는 재생주소에 authKey·sessionID가 붙어 있어 미리 저장할 수 없다.
      // 누르는 순간 서버(/api/local-stream)가 받아오고, 받은 주소는 CORS 허용이라
      // 브라우저가 직접 재생한다(우리 대역폭 0). 또 제주는 스스로 시청을 30초로
      // 제한하므로(entry.maxSeconds) 그 시간이 지나면 멈추고 다시 보기 버튼을 준다.
      function startLiveWith(url) {
        if (errMsg) { errMsg.style.display = 'none'; }
        caption.innerHTML = '🔴 실시간 영상입니다' +
          (entry.maxSeconds ? ' · 제공기관 정책상 ' + entry.maxSeconds + '초 후 자동으로 멈춥니다' : '') +
          ' · <a href="' + url + '" target="_blank" rel="noopener" style="color:#4a90d9;">새 창에서 크게 보기</a>';
        playCctvLiveInline(url, video, showLiveFailure);
        if (entry.maxSeconds) {
          if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); }
          cctvLiveLimitTimer = setTimeout(function() {
            stopCctvPlayback();
            if (!errMsg) return;
            errMsg.style.display = 'block';
            errMsg.style.color = '#475569';
            errMsg.innerHTML = '제공기관 정책에 따라 ' + entry.maxSeconds + '초 후 재생이 멈췄습니다. ' +
              '<button id="cctvAgainBtn" style="margin-left:6px;border:none;border-radius:6px;padding:5px 12px;' +
              'background:#111827;color:#fff;font-size:12px;cursor:pointer;">다시 보기</button>';
            var again = document.getElementById('cctvAgainBtn');
            if (again) again.addEventListener('click', function() {
              errMsg.style.display = 'none';
              switchToLive();
            });
          }, entry.maxSeconds * 1000);
        }
      }

      function switchToLive() {
        if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
        // ⚠️ 2026-08: LIVE 버튼은 streamUrl이 있을 때만 만들어진다. 제주처럼 주소를
        // 나중에 받아오는 카메라는 streamUrl이 비어 있어 버튼이 존재하지 않으므로
        // 여기서 null 검사가 없으면 팝업 자체가 터진다(실제 발생).
        if (img) img.style.display = 'none';
        if (stillBadge) stillBadge.style.display = 'none';
        if (errMsg) errMsg.style.display = 'none';
        if (liveBtn) liveBtn.style.display = 'none';
        if (video) video.style.display = 'block';
        if (entry.streamResolve && CCTV_PROXY_BASE_URL) {
          caption.textContent = '영상 주소를 받아오는 중…';
          fetch(CCTV_PROXY_BASE_URL + '/api/local-stream?ref=' + encodeURIComponent(entry.streamResolve))
            .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
            .then(function(d) { startLiveWith(d.url); })
            .catch(function(err) {
              console.error('[CCTV] 지자체 영상주소 조회 실패:', err);
              showLiveFailure();
            });
          return;
        }
        caption.innerHTML = '🔴 실시간 영상입니다 (연결 상태에 따라 화질/속도가 달라질 수 있습니다) · ' +
          '<a href="' + streamUrl + '" target="_blank" rel="noopener" style="color:#4a90d9;">새 창에서 크게 보기</a>';
        playCctvLiveInline(playUrl, video, showLiveFailure);
      }
      if (liveBtn && streamUrl) {
        liveBtn.addEventListener('click', switchToLive);
      }
      // 서버가 전수 검사에서 "사진은 죽었고 실시간만 살아있다"고 표시한 카메라는
      // 깨진 이미지를 잠깐 보여줬다가 넘어가지 말고 처음부터 실시간으로 연다.
      if ((entry.liveFirst || !imageUrl) && (streamUrl || entry.streamResolve)) {
        switchToLive();
      }
    } else {
      // 사진 주소를 못 받아온 극히 일부 카메라 - 실시간 영상 새 창으로 폴백
      showStatus('📹 ' + name + ' - 새 창에서 CCTV 영상을 엽니다');
      window.open(streamUrl, '_blank');
    }
  }

  function loadCctvMarkers() {
    showStatus('📹 주변 CCTV 불러오는 중...');
    fetchCctvList(mapGetBounds(), function(result) {
      if (!result.ok) {
        showStatus('⚠️ CCTV 정보를 불러오지 못했습니다. (' + (result.error && result.error.message ? result.error.message : '네트워크/CORS 오류로 추정') + ')');
        return;
      }
      clearCctvMarkers();
      var bounds = mapGetBounds();
      var level = mapGetLevel();
      var shownList = decimateCctvList(result.list, bounds, level);
      var iconSize = weatherIconSizeForLevel(level);
      shownList.forEach(function(item) {
        var lat = parseFloat(item.coordy); // 출력변수 문서 기준 coordy=위도
        var lng = parseFloat(item.coordx); // 출력변수 문서 기준 coordx=경도
        if (isNaN(lat) || isNaN(lng)) return;
        var name = item.cctvname || 'CCTV';
        var streamUrl = item.cctvurl || '';
        var imageUrl = item.imageUrl || '';
        cctvMarkers.push(mapCreateMarker(lat, lng, {
          color: 'purple',
          iconSize: iconSize,
          onClick: function() {
            openCctvPopup({ name: name, lat: lat, lng: lng, imageUrl: imageUrl, streamUrl: streamUrl, liveFirst: !!item.liveFirst, relayLive: !!item.relayLive, streamResolve: item.streamResolve || '', maxSeconds: item.maxSeconds || 0 });
          }
        }));
      });
      // 전체 개수 대비 실제로 화면에 찍힌(격자 솎아내기 후) 개수를 함께 보여줘서
      // "줄었다"는 걸 사용자도 체감할 수 있게 함
      showStatus('📹 CCTV ' + shownList.length + '개 표시됨 (주변 전체 ' + result.list.length + '개 중)');
    });
  }

  document.getElementById('cctvToggleBtn').addEventListener('click', function() {
    cctvVisible = !cctvVisible;
    var btn = document.getElementById('cctvToggleBtn');
    if (cctvVisible) {
      btn.textContent = '📹 CCTV 끄기';
      loadCctvMarkers();
    } else {
      btn.textContent = '📹 CCTV';
      clearCctvMarkers();
    }
  });

  // ================================================================
  // 전국보기 (ID73 구체화, 2026-07) - 로그인 없이 누구나 쓰는 공개 기능. 주요 도시
  // 대표지점 근처 CCTV를 모음이미지로 보여줘서 "거기 비 와?"를 지도 조작 없이 한눈에
  // 확인할 수 있게 함. 지점 목록은 우선 사용자가 예시로 든 5개 도시(시청 부근)로 시작 -
  // 나중에 반응 보고 도시를 더 추가하거나 관리자가 조정 가능한 구조로 발전시킬 수 있음.
  // ================================================================
  var NATIONWIDE_CITIES = [
    { name: '서울', lat: 37.5665, lng: 126.9780 },
    { name: '대전', lat: 36.3504, lng: 127.3845 },
    { name: '대구', lat: 35.8714, lng: 128.6014 },
    { name: '광주', lat: 35.1601, lng: 126.8517 },
    { name: '부산', lat: 35.1796, lng: 129.0756 }
  ];

  // 정확한 km 거리가 아니라 "여러 후보 중 어느 게 더 가까운지" 순위만 필요해서 위도/경도
  // 차이로 근사 비교함(위도 1도≈111km로 거의 일정하지만 경도는 위도에 따라 폭이 줄어듦 -
  // 우리나라 위도 범위(33~39도)에서는 이 단순 근사로도 순위가 실제 거리와 크게 다르지 않음).
  function approxDegDistance(lat1, lng1, lat2, lng2) {
    var dLat = lat1 - lat2, dLng = lng1 - lng2;
    return Math.sqrt(dLat * dLat + dLng * dLng);
  }

  function cctvIdOf(item) {
    return item.cctvurl || (item.roadsectionid + ',' + item.coordx + ',' + item.coordy);
  }

  // 지정한 좌표 근처에서 가장 가까운 CCTV 1개를 찾음. ID73 설계 원칙과 동일하게, 좁은
  // 반경에서 못 찾으면 단계적으로 반경을 넓혀가며 재시도(fetchCctvList의 그리드+캐시를
  // 그대로 재사용하므로 이미 조회한 지역은 새 API 호출 없이 캐시로 처리됨).
  // excludeIds(선택): { cctvId: true, ... } - 이미 같은 그리드(예: 구군검색의 중앙·동서남북)
  // 다른 지점에서 뽑힌 카메라를 제외하기 위한 집합. 지점끼리 거리가 가까우면(2.5km 등)
  // 같은 카메라가 "가장 가까움"으로 여러 번 뽑히는 문제(2026-07 실사용 피드백으로 발견)를
  // 막기 위함 - 제외 후에도 그 반경에 남은 후보가 없으면 반경을 넓혀 계속 찾음.
  // ⚠️ 2026-08 중요한 수정: 이 화면은 "그림으로 한눈에 보는 것"이 목적인데, 소스가
  // 늘면서(UTIC 도심·충주·제주·경기) 정지영상 없이 실시간 영상만 주는 카메라가 많아졌다.
  // 가장 가까운 카메라만 고르다 보니 사진 없는 카메라가 뽑혀 5칸이 전부 "이미지 없음"이
  // 되는 퇴행이 실사용에서 발견됨. 카메라가 늘어난 것이 오히려 이 기능을 망가뜨렸다.
  // 그래서 사진이 있는 카메라를 먼저 찾고, 그런 카메라가 하나도 없을 때만 조건을 푼다.
  function pickNearestFrom(list, lat, lng, excludeIds, imageOnly) {
    var best = null, bestDist = Infinity;
    list.forEach(function(item) {
      if (excludeIds && excludeIds[cctvIdOf(item)]) return;
      if (imageOnly && !item.imageUrl) return;
      var ilat = parseFloat(item.coordy), ilng = parseFloat(item.coordx);
      if (isNaN(ilat) || isNaN(ilng)) return;
      var d = approxDegDistance(lat, lng, ilat, ilng);
      if (d < bestDist) { bestDist = d; best = item; }
    });
    return best;
  }

  function findNearestCctv(lat, lng, excludeIds, callback, imageOnly) {
    var radii = [0.03, 0.08, 0.2]; // 약 3km, 8km, 20km
    var i = 0;
    function tryNext() {
      if (i >= radii.length) {
        // 사진 있는 카메라를 못 찾았으면 조건을 풀고 한 번 더 찾는다
        if (imageOnly) { findNearestCctv(lat, lng, excludeIds, callback, false); return; }
        callback(null);
        return;
      }
      var r = radii[i++];
      fetchCctvList({ minX: lng - r, maxX: lng + r, minY: lat - r, maxY: lat + r }, function(result) {
        if (!result.ok || !result.list || result.list.length === 0) { tryNext(); return; }
        var best = pickNearestFrom(result.list, lat, lng, excludeIds, imageOnly);
        if (best) callback(best); else tryNext();
      });
    }
    tryNext();
  }

  // 전국보기/구군 날씨검색이 공통으로 쓰는 카드 렌더러. points: [{label, lat, lng}, ...] -
  // label은 카드에 표시될 이름(도시명 또는 "중앙"/"북"/"남"/"동"/"서" 등).
  // ⚠️ 2026-07: 지점끼리 거리가 가까운 구군검색(중앙·동서남북, 2.5km 간격)에서 서로 다른
  // 지점인데 같은 카메라가 중복으로 뽑히는 문제가 실사용에서 발견됨 - 지점을 병렬이 아니라
  // "하나씩 순서대로" 처리하면서, 앞서 뽑힌 카메라 id를 계속 제외 목록에 쌓아가는 방식으로
  // 수정(전국보기처럼 지점이 서로 멀리 떨어져 있으면 애초에 중복 가능성이 낮아 체감 차이는
  // 없지만, 로직은 공통 재사용).
  // useDongLabel=true면(구군검색 전용) 카메라를 찾은 뒤 실제 좌표를 행정동 이름으로 역변환해
  // "중앙/북/남/동/서" 대신 실제 동네 이름을 라벨로 보여줌(2026-07, 사용자 피드백 반영).
  // 전국보기는 이미 도시명이 label이라 그대로 둠(호출 시 useDongLabel 생략).
  // 사진이 없거나 사진 로드에 실패했을 때 그 자리에 현재 날씨를 보여준다.
  // 빈 칸보다 낫고, 기상청 실황은 전국 어디서나 응답하므로 항상 무언가는 표시된다.
  function showWeatherInstead(spinner, lat, lng, prefixMsg) {
    if (!spinner) return;
    spinner.textContent = prefixMsg ? prefixMsg : '날씨 확인 중…';
    if (!CCTV_PROXY_BASE_URL || lat == null || lng == null) return;
    fetch(CCTV_PROXY_BASE_URL + '/api/weather-now?lat=' + encodeURIComponent(lat) + '&lng=' + encodeURIComponent(lng))
      .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(w) {
        var head = w.raining ? '☔ ' + (w.ptyLabel || '강수') : '☀️ 비 없음';
        var sub = [];
        if (w.rain1h) sub.push('1시간 ' + w.rain1h + 'mm');
        if (w.temp != null) sub.push(w.temp + '℃');
        spinner.innerHTML = '<div style="font-size:15px;font-weight:700;color:' +
          (w.raining ? '#2563eb' : '#475569') + ';">' + head + '</div>' +
          (sub.length ? '<div style="font-size:11.5px;color:#94a3b8;margin-top:2px;">' + sub.join(' · ') + '</div>' : '') +
          '<div style="font-size:10.5px;color:#cbd5e1;margin-top:3px;">사진 없는 카메라 · 눌러서 영상 보기</div>';
      })
      .catch(function() {
        spinner.textContent = prefixMsg ? prefixMsg : '사진 없음 · 눌러서 영상 보기';
      });
  }

  function renderCctvGrid(grid, points, useDongLabel) {
    var usedIds = {};
    function renderOne(idx) {
      if (idx >= points.length) return;
      var pt = points[idx];
      var card = document.createElement('div');
      card.className = 'nwCard';
      card.innerHTML = '<div class="nwSpinner">불러오는 중…</div><span class="nwLabel"></span>';
      card.querySelector('.nwLabel').textContent = pt.label; // 지명은 사용자 검색어 유래일 수 있어 textContent로 안전하게 삽입
      grid.appendChild(card);
      // 사진 있는 카메라를 우선으로 찾는다(이 화면의 목적이 "그림으로 한눈에 보기"이므로)
      findNearestCctv(pt.lat, pt.lng, usedIds, function(item) {
        var spinner = card.querySelector('.nwSpinner');
        if (!item) {
          if (spinner) spinner.textContent = '근처에 다른 CCTV가 없습니다';
          renderOne(idx + 1);
          return;
        }
        usedIds[cctvIdOf(item)] = true;
        var imageUrl = item.imageUrl || '';
        var streamUrl = item.cctvurl || '';
        var name = item.cctvname || pt.label;
        var ilat = parseFloat(item.coordy), ilng = parseFloat(item.coordx);
        if (imageUrl) {
          var img = document.createElement('img');
          img.alt = pt.label;
          img.onload = function() { if (spinner) spinner.remove(); };
          img.onerror = function() { showWeatherInstead(spinner, pt.lat, pt.lng, '사진을 불러오지 못했습니다'); };
          img.src = imageUrl;
          card.insertBefore(img, card.firstChild);
        } else if (spinner) {
          // 사진이 없는 카메라(실시간 영상만 제공)라도 빈 칸을 보여주지 않는다.
          // "이미지 없음"은 사용자에게 아무 값도 주지 않으므로, 그 지점의 현재 강수·기온을
          // 대신 보여준다. 카드를 누르면 실시간 영상은 그대로 열린다.
          showWeatherInstead(spinner, pt.lat, pt.lng, null);
        }
        if (useDongLabel && !isNaN(ilat) && !isNaN(ilng)) {
          // 카메라의 실제 좌표를 행정동 이름으로 역변환 - 실패해도 기존 방향 라벨(pt.label)이
          // 그대로 남아있으므로 사용자에게 보이는 정보가 없어지는 일은 없음(안전한 실패).
          getRegionGeocoder().coord2RegionCode(ilng, ilat, function(regionResult, regionStatus) {
            if (regionStatus !== kakao.maps.services.Status.OK || !regionResult || !regionResult.length) return;
            var region = null;
            for (var i = 0; i < regionResult.length; i++) {
              if (regionResult[i].region_type === 'H') { region = regionResult[i]; break; }
            }
            if (!region) region = regionResult[0];
            var dongName = region && region.region_3depth_name;
            if (dongName) {
              var labelEl = card.querySelector('.nwLabel');
              if (labelEl) labelEl.textContent = dongName + ' (' + pt.label + ')';
            }
          });
        }
        card.addEventListener('click', function() {
          openCctvPopup({ name: pt.label + ' · ' + name, lat: ilat, lng: ilng, imageUrl: imageUrl, streamUrl: streamUrl, liveFirst: !!item.liveFirst, relayLive: !!item.relayLive, streamResolve: item.streamResolve || '', maxSeconds: item.maxSeconds || 0 });
        });
        renderOne(idx + 1);
      }, true);
    }
    renderOne(0);
  }

  function openNationwideView() {
    // 모달을 열기 직전에 배경 지도를 전국이 보이는 범위로 부드럽게 이동·축소 - level 13은
    // 대한민국 전역이 대략 한 화면에 들어오는 배율로 우선 고정값을 씀(화면 크기에 따라
    // 살짝 넘치거나 남을 수 있음 - 실사용 화면에서 보고 조정 예정).
    mapFlyToPoints(NATIONWIDE_CITIES.map(function(c) { return { lat: c.lat, lng: c.lng }; }), 13);
    var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">주요 도시 근처 CCTV로 지금 날씨를 한눈에 확인해보세요</p>' +
      '<div id="nationwideGrid" class="nwGrid"></div>';
    openModal('🌍 전국 CCTV 한눈에 보기', body, weatherIconSvgDataUrl());
    // openModal이 위에서 currentReopenFn을 null로 초기화하므로, 그 직후 이 그리드뷰를
    // "다시 열기" 함수로 등록 - 최소화(지도만 보기) 후 복원 시 이 함수가 다시 호출됨.
    currentReopenFn = openNationwideView;
    renderCctvGrid(document.getElementById('nationwideGrid'),
      NATIONWIDE_CITIES.map(function(c) { return { label: c.name, lat: c.lat, lng: c.lng }; }));
  }

  document.getElementById('nationwideBtn').addEventListener('click', openNationwideView);

  // ================================================================
  // 구/군 날씨검색 (ID73 구체화 ②, 2026-07) - 검색창에 지역명(예: 강남구)을 입력하고
  // 옆의 빨간 "날씨검색" 버튼을 누르면, 그 지역 중앙 및 동서남북 대표지점 근처 CCTV를
  // 모음이미지로 보여줌. 기존 파란 "검색" 버튼(장소/캠핑장 검색)과는 별개 동작 -
  // 오조작 방지를 위해 검색창은 공유하되 버튼을 분리(마스터플랜 ID73 설계 원칙).
  // ================================================================
  var DISTRICT_OFFSET_KM = 2.5; // 중앙에서 동서남북 대표지점까지의 거리 - 우선 고정값으로
  // 시작하고, 지역별 크기 차이에 따른 체감 오차는 실사용 피드백을 보고 조정할 예정.

  // 위도 1도≈111km, 경도 1도≈111km×cos(위도) 근사식으로 남북/동서 오프셋 좌표 계산.
  // 정밀 측지 계산은 아니지만 "동서남북 대표지점 하나씩 잡기" 용도로는 충분함.
  function offsetLatLng(lat, lng, dLatKm, dLngKm) {
    return {
      lat: lat + (dLatKm / 111),
      lng: lng + (dLngKm / (111 * Math.cos(lat * Math.PI / 180)))
    };
  }

  function openDistrictWeatherView(query, center) {
    var north = offsetLatLng(center.lat, center.lng, DISTRICT_OFFSET_KM, 0);
    var south = offsetLatLng(center.lat, center.lng, -DISTRICT_OFFSET_KM, 0);
    var east = offsetLatLng(center.lat, center.lng, 0, DISTRICT_OFFSET_KM);
    var west = offsetLatLng(center.lat, center.lng, 0, -DISTRICT_OFFSET_KM);
    var points = [
      { label: '중앙', lat: center.lat, lng: center.lng },
      { label: '북', lat: north.lat, lng: north.lng },
      { label: '남', lat: south.lat, lng: south.lng },
      { label: '동', lat: east.lat, lng: east.lng },
      { label: '서', lat: west.lat, lng: west.lng }
    ];
    var body = '<p style="margin:0 0 10px;color:#888;font-size:12.5px;">중앙·동서남북 근처 CCTV로 날씨·교통 상황을 확인해보세요</p>' +
      '<div id="districtGrid" class="nwGrid"></div>';
    // 제목에 검색어(query)를 그대로 넣지만, openModal의 제목 처리는 createTextNode를
    // 써서 HTML로 해석되지 않으므로(위 openModal 참고) 사용자가 입력한 임의 문자열이
    // 섞여도 안전함 - 본문(body)에는 검색어를 넣지 않음.
    openModal('📹 ' + query + ' CCTV로 날씨보기', body, weatherIconSvgDataUrl());
    // 위와 동일한 이유로, 이 지역(query/center)을 다시 열 수 있도록 등록해둠 -
    // query/center를 클로저로 그대로 캡처하므로 재호출 시 동일한 지역이 다시 열림.
    currentReopenFn = function() { openDistrictWeatherView(query, center); };
    renderCctvGrid(document.getElementById('districtGrid'), points, true);
  }

  document.getElementById('weatherSearchBtn').addEventListener('click', function() {
    var query = document.getElementById('searchInput').value.trim();
    if (!query) {
      showStatus('⚠️ 먼저 지역명을 입력해주세요 (예: 강남구)');
      return;
    }
    showStatus('🔎 "' + query + '" 위치 확인 중...');
    var geocoder = new kakao.maps.services.Geocoder();
    geocoder.addressSearch(query, function(result, status) {
      if (status === kakao.maps.services.Status.OK && result[0]) {
        openDistrictWeatherView(query, { lat: parseFloat(result[0].y), lng: parseFloat(result[0].x) });
        return;
      }
      // 주소 검색으로 못 찾으면(예: 정식 행정구역명이 아닌 통칭) 장소(키워드) 검색으로
      // 한 번 더 시도 - "강남구청"처럼 명칭이 섞여도 이쪽에서 잡히는 경우가 많음
      ps.keywordSearch(query, function(data, psStatus) {
        if (psStatus === kakao.maps.services.Status.OK && data[0]) {
          openDistrictWeatherView(query, { lat: parseFloat(data[0].y), lng: parseFloat(data[0].x) });
        } else {
          showStatus('⚠️ "' + query + '" 위치를 찾지 못했습니다. 다른 지역명으로 시도해보세요.');
        }
      });
    });
  });

  // 지도를 축소/이동해도 CCTV가 처음 켰을 때 보이던 지역에만 그대로 남아있던 문제 수정:
  // CCTV 레이어가 켜져 있는 동안은 지도 이동/확대·축소가 멈출 때마다 현재 보이는 범위로
  // 다시 불러옵니다(30분 캐시가 있어서 같은 지역을 반복 조회해도 실제 호출은 새 지역에
  // 대해서만 나갑니다).
  mapOnIdle(function() {
    if (cctvVisible) loadCctvMarkers();
  });

  // ================================================================
  // 관리자 콘솔 (ID19 확장 / ID69 / ID64 일부)
  // ----------------------------------------------------------------
  // 그동안 관리자 기능이 화면 곳곳에 흩어져 있었다 - CCTV 공개설정은 CCTV 안내
  // 모달에, 최근제보 기준시간은 제보 목록 모달에 들어 있어서 관리자가 "지금 무엇을
  // 어떻게 설정해 뒀는지" 한눈에 볼 수 없었다. 운영 항목이 늘어난 지금(소스 5개,
  // 비용이 다른 소스가 섞임) 한 화면에 모아둔다.
  // 화면은 일부러 단순한 글자 위주로 만든다 - 관리자용이라 꾸밀 이유가 없고,
  // 항목이 계속 늘어날 것이므로 추가하기 쉬운 형태가 낫다.
  // ================================================================
  function adminSourceRows() {
    return CCTV_SOURCE_INFO.map(function(src) {
      var on = !!CCTV_SOURCES[src.key];
      var costColor = src.cost === '유료(중계)' ? '#c2410c' : (src.cost === '무료' ? '#0a7d2c' : '#64748b');
      return '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;">' +
        '<div style="min-width:0;"><div style="font-size:13px;">' + src.label + '</div>' +
        '<div style="font-size:11.5px;color:' + costColor + ';">서버 비용: ' + src.cost + '</div></div>' +
        '<button class="admSrcBtn" data-key="' + src.key + '" style="flex:0 0 auto;border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;background:' +
        (on ? '#0a7d2c' : '#cbd5e1') + ';color:' + (on ? '#fff' : '#475569') + ';">' +
        (on ? 'ON' : 'OFF') + '</button></div>';
    }).join('');
  }

  function renderAdminConsole() {
    var counts = {};
    sharedSpots.forEach(function(sp) {
      var k = sp.category || '미분류';
      counts[k] = (counts[k] || 0) + 1;
    });
    var reported = sharedSpots.filter(function(sp) { return (sp.reportCount || 0) > 0; }).length;

    var body =
      '<div style="font-size:13px;line-height:1.7;">' +

      '<div style="font-weight:700;margin:2px 0 6px;">1. 공개 설정</div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;">' +
      '<span>CCTV 기능 전체 공개</span>' +
      '<button id="admCctvEnable" style="border:none;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;background:' +
      (CCTV_ENABLED ? '#0a7d2c' : '#cbd5e1') + ';color:' + (CCTV_ENABLED ? '#fff' : '#475569') + ';">' +
      (CCTV_ENABLED ? '공개 중' : '비공개') + '</button></div>' +
      '<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #f1f5f9;">' +
      '<span>현장 제보 "최근" 기준</span>' +
      '<button id="admHours" style="border:1px solid #cbd5e1;border-radius:6px;padding:6px 12px;font-size:12px;cursor:pointer;background:#fff;">' +
      RECENT_REPORTS_HOURS + '시간 · 변경</button></div>' +

      '<div style="font-weight:700;margin:16px 0 6px;">2. CCTV 소스별 사용</div>' +
      adminSourceRows() +
      '<p style="margin:8px 0 0;font-size:11.5px;color:#64748b;">' +
      '끈 소스는 호출 자체를 하지 않습니다. 유료 소스는 시청 시간에 비례해 서버 대역폭을 씁니다' +
      '(경기 실시간 기준 시청 1시간당 약 0.9GB). 커버리지 조사에서 유료 소스가 추가로 덮는 지역은 ' +
      '전국 5km 격자 2,463개 중 34개였습니다.</p>' +

      '<div style="font-weight:700;margin:16px 0 6px;">3. 등록 현황</div>' +
      '<div style="font-size:12.5px;color:#475569;">전체 ' + sharedSpots.length + '건' +
      (reported ? ' · 신고 누적 ' + reported + '건' : '') + '<br>' +
      Object.keys(counts).map(function(k) { return categoryLabel(k) + ' ' + counts[k]; }).join(' · ') +
      '</div>' +

      '<div style="font-weight:700;margin:16px 0 6px;">4. 커버리지 현황</div>' +
      '<div id="admCoverage" style="font-size:12.5px;color:#94a3b8;">불러오는 중…</div>' +

      '<div style="font-weight:700;margin:16px 0 6px;">5. 서버 상태</div>' +
      '<div id="admHealth" style="font-size:12.5px;color:#94a3b8;">확인 중…</div>' +
      '</div>';

    openModal('⚙️ 관리자 콘솔', body);

    document.querySelectorAll('.admSrcBtn').forEach(function(btn) {
      btn.addEventListener('click', function() {
        var k = btn.getAttribute('data-key');
        CCTV_SOURCES[k] = !CCTV_SOURCES[k];
        db.collection('config').doc('settings').set({ cctvSources: CCTV_SOURCES }, { merge: true })
          .then(function() {
            cctvClientCache = {}; // 소스가 바뀌었으니 캐시를 버리고 다시 받아야 함
            showStatus('✅ ' + k + ' 소스를 ' + (CCTV_SOURCES[k] ? 'ON' : 'OFF') + '으로 저장했습니다.');
            if (cctvVisible) loadCctvMarkers();
            renderAdminConsole();
          })
          .catch(function(err) { alert('저장 실패: ' + err.message); });
      });
    });

    var enBtn = document.getElementById('admCctvEnable');
    if (enBtn) enBtn.addEventListener('click', function() {
      var newVal = !CCTV_ENABLED;
      db.collection('config').doc('settings').set({ cctvEnabled: newVal }, { merge: true }).then(function() {
        CCTV_ENABLED = newVal;
        updateCctvButtonVisibility();
        renderAdminConsole();
      }).catch(function(err) { alert('저장 실패: ' + err.message); });
    });

    var hBtn = document.getElementById('admHours');
    if (hBtn) hBtn.addEventListener('click', function() {
      var val = prompt('현장 제보를 "최근"으로 표시할 기준 시간(시간 단위)', RECENT_REPORTS_HOURS);
      if (val === null) return;
      var n = parseInt(val, 10);
      if (isNaN(n) || n <= 0) { alert('1 이상의 숫자를 입력해주세요.'); return; }
      db.collection('config').doc('settings').set({ recentReportsHours: n }, { merge: true }).then(function() {
        RECENT_REPORTS_HOURS = n;
        renderAdminConsole();
      }).catch(function(err) { alert('저장 실패: ' + err.message); });
    });

    // 커버리지 현황 - "어디가 되고 어디가 안 되는지"를 상시 확인.
    // 전국을 5km 격자로 나눠 시군구별로 묶은 값(coverage-build.js가 미리 산출).
    // 카메라가 없는 격자도 기상청 실황은 100% 덮으므로 그 대비도 함께 보여준다.
    if (CCTV_PROXY_BASE_URL) {
      fetch(CCTV_PROXY_BASE_URL + '/api/coverage').then(function(r) {
        if (!r.ok) throw new Error(r.status === 404 ? '아직 산출 전' : ('HTTP ' + r.status));
        return r.json();
      }).then(function(cv) {
        var el = document.getElementById('admCoverage');
        if (!el) return;
        var sm = cv.summary || {};
        var worst = (cv.regions || []).slice(0, 8).map(function(g) {
          return g.sido + ' ' + g.sigungu + ' ' + g.rate + '%(' + g.total + '대)';
        }).join(' · ');
        var d = (cv.builtAt || '').slice(0, 10);
        el.innerHTML =
          '전국 육지 격자 ' + sm.landCells + '개 중 <b>' + sm.coveredCells + '개 커버 (' + sm.coverageRate + '%)</b><br>' +
          '카메라 ' + sm.cameras + '대 · 시군구 ' + sm.regions + '곳 · 기준일 ' + d + '<br>' +
          '<span style="color:#c2410c;">취약 지역: ' + (worst || '-') + '</span><br>' +
          '<span style="color:#64748b;">카메라가 없는 격자도 기상청 실황은 전국 100% 응답합니다.</span>';
        el.style.color = '#475569';
      }).catch(function(e) {
        var el = document.getElementById('admCoverage');
        if (el) {
          el.textContent = '커버리지 자료 없음 (' + e.message + ') — 서버에서 coverage-build.js 실행 필요';
          el.style.color = '#c2410c';
        }
      });
    }

    // 서버가 살아있는지, 각 소스가 실제로 응답하는지 관리자 화면에서 바로 확인
    var el = document.getElementById('admHealth');
    if (el && CCTV_PROXY_BASE_URL) {
      var probe = '?minX=126.95&maxX=127.05&minY=37.53&maxY=37.60';
      var checks = [
        ['국토부', '/api/its-cctv' + probe],
        ['UTIC', '/api/utic-snapshot-list' + probe],
        ['지자체', '/api/local-cctv' + probe],
        ['경기', '/api/gg-cctv' + probe]
      ];
      Promise.all(checks.map(function(c) {
        return fetch(CCTV_PROXY_BASE_URL + c[1]).then(function(r) {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        }).then(function(d) {
          return c[0] + ' ' + (extractCctvItems(d).length) + '대';
        }).catch(function(e) { return c[0] + ' 실패(' + e.message + ')'; });
      })).then(function(rows) {
        var el2 = document.getElementById('admHealth');
        if (el2) { el2.textContent = rows.join(' · '); el2.style.color = '#475569'; }
      });
    }
  }

  // 관리자 전용: 전체 사용자에게 CCTV 기능을 공개할지(cctvEnabled) 조정

  function renderRecentReports() {
    var cutoff = Date.now() - RECENT_REPORTS_HOURS * 3600 * 1000;
    var sceneSpots = sharedSpots.filter(function(s) {
      return s.category === 'scene' && s.createdAt && s.createdAt >= cutoff;
    }).sort(function(a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });

    // 관리자에게만 보이는 기준 조정 안내 - 일반 사용자는 조정 여부를 알 필요가 없어 숨김
    var adminControl = isAdmin
      ? '<div style="margin-bottom:10px;padding:8px 10px;background:#eef2ff;border-radius:8px;font-size:12px;color:#4338ca;display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
        '<span>표시 기준: 최근 ' + RECENT_REPORTS_HOURS + '시간 이내</span>' +
        '<button id="recentReportsThresholdBtn" style="flex:0 0 auto;border:none;background:#4338ca;color:white;padding:5px 10px;border-radius:6px;font-size:11.5px;cursor:pointer;">기준 변경</button></div>'
      : '';

    if (sceneSpots.length === 0) {
      openModal('🚨 최근 현장 제보', adminControl + '<p style="color:#888;">최근 ' + RECENT_REPORTS_HOURS + '시간 이내 등록된 현장 제보가 없습니다.</p>');
    } else {
      var body = adminControl + '<div style="display:flex;flex-direction:column;gap:8px;">' +
        sceneSpots.map(function(s, idx) {
          var ago = s.createdAt ? timeAgoLabel(s.createdAt) : '';
          return '<button class="recentReportBtn" data-idx="' + idx + '" style="text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #fecaca;background:#fff7f7;cursor:pointer;font-size:14px;">🚨 ' + s.name +
            (ago ? '<br><span style="font-size:11px;color:#c2410c;">' + ago + ' 등록</span>' : '') + '</button>';
        }).join('') + '</div>';
      openModal('🚨 최근 현장 제보 (' + sceneSpots.length + '건)', body);
      document.querySelectorAll('.recentReportBtn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          openSpotModal(sceneSpots[parseInt(btn.getAttribute('data-idx'), 10)]);
        });

    }

    var thresholdBtn = document.getElementById('recentReportsThresholdBtn');
    if (thresholdBtn) {
      thresholdBtn.addEventListener('click', function() {
        var val = prompt('현장 제보를 "최근"으로 표시할 기준 시간을 입력하세요 (시간 단위, 현재: ' + RECENT_REPORTS_HOURS + '시간)', RECENT_REPORTS_HOURS);
        if (val === null) return;
        var n = parseInt(val, 10);
        if (isNaN(n) || n <= 0) { alert('1 이상의 숫자를 입력해주세요.'); return; }
        RECENT_REPORTS_HOURS = n;
        db.collection('config').doc('settings').set({ recentReportsHours: n }, { merge: true }).then(function() {
          showStatus('✅ 최근 제보 기준이 ' + n + '시간으로 저장되었습니다.');
          renderRecentReports();
        }).catch(function(err) {
          alert('저장 실패: ' + err.message);
        });
      });
    }
  }
  document.getElementById('recentReportsBtn').addEventListener('click', renderRecentReports);

  // 등록모드일 때는 지도를 몇 번을 클릭(줌 조정 후 재클릭 포함)해도 항상 등록창이 뜸
  mapOnClick(function(pos) {
    if (longPressTimer) { clearTimeout(longPressTimer); longPressTimer = null; } // 짧게 뗀 경우 롱프레스 타이머 취소
    if (suppressNextMapClick) { suppressNextMapClick = false; return; } // 롱프레스로 이미 처리된 클릭은 무시(ID 67)
    if (!placingMode) return;
    pendingLatLng = pos; // {lat, lng}
    openRegisterForm();
  });

  // 현위치 버튼: 평소엔 지도만 이동, 등록모드 중이면 그 자리로 바로 등록창까지 오픈
  document.getElementById('locateBtn').addEventListener('click', function() {
    if (!navigator.geolocation) {
      showStatus('이 브라우저는 위치 확인을 지원하지 않습니다.');
      return;
    }
    showStatus('📡 위치 확인 중...');
    navigator.geolocation.getCurrentPosition(function(pos) {
      var here = { lat: pos.coords.latitude, lng: pos.coords.longitude };
      mapSetCenter(here.lat, here.lng);
      mapSetLevel(3);

      mapRemoveMarker(myLocationMarker);
      myLocationMarker = mapCreateLocationMarker(here.lat, here.lng);

      if (placingMode) {
        pendingLatLng = here;
        openRegisterForm();
      } else {
        showStatus('현재 위치로 이동했습니다.');
      }
    }, function() {
      showStatus('⚠️ 위치 확인 실패 — 위치 권한을 확인해주세요.');
    });
  });

    var catButtonsHtml = CATEGORY_OPTIONS.map(function(c) {
      return '<button type="button" class="catBtn" data-key="' + c.key + '" style="padding:8px 12px;border-radius:8px;border:1px solid #ddd;background:#f9f9f9;cursor:pointer;font-size:13px;">' + c.emoji + ' ' + c.label + '</button>';
    }).join('');

    var formHtml =
      '<div class="formRow"><label>장소 이름</label><input id="regTitle" type="text" placeholder="예: 우리집 앞마당, OO캠핑장"></div>' +
      '<div class="formRow"><label>어떤 콘텐츠인가요?</label><div id="catButtons" style="display:flex;gap:6px;flex-wrap:wrap;">' + catButtonsHtml + '</div></div>' +
      // ⚠️ 2026-08: 입력칸 안내문에 주소 예시(https://youtube.com/watch?v=...)를 넣어뒀더니

      // 뜻을 알 수 없고 오히려 "이런 형식으로 직접 타이핑해야 하나" 하는 오해를 준다.

    // ID67: 바텀시트 모드로 열어서 화면 하단 절반 이하로만 표시 - 위쪽 지도와 방금 지정한
    // 핀 위치가 폼에 가려지지 않고 계속 보임

    document.querySelectorAll('.catBtn').forEach(function(btn) {

        var journeyRow = document.getElementById('journeyFormRow');

    // 링크를 붙여넣는 즉시 무엇으로 알아봤는지 알려줌. 등록 버튼을 눌러야 비로소
    // "지원하지 않는 링크"라고 알려주던 방식은, 사용자가 이미 다 채운 뒤에 되돌아가야 해서
    // 불편했음. 아직 못 알아본 상태는 빨강이 아니라 주황으로 - 입력 도중에는 아직
    // 틀린 게 아니라 "덜 붙여넣은" 경우가 대부분이기 때문.
    var urlInput = document.getElementById('regUrl');
    var urlHint = document.getElementById('regUrlHint');
    var urlHintDefault = urlHint ? urlHint.innerHTML : '';
    function refreshUrlHint() {
      if (!urlInput || !urlHint) return;
      var v = urlInput.value.trim();
      if (!v) {
        urlHint.innerHTML = urlHintDefault;
        urlHint.style.color = '#6b7280';
        return;
      }
      var info = extractContentInfo(v);
      if (info) {
        urlHint.innerHTML = '✅ <b>' + contentKindLabel(info) + '</b>으로 확인했어요. 이대로 등록하시면 됩니다.';
        urlHint.style.color = '#15803d';
      } else {
        urlHint.innerHTML = '아직 링크를 알아보지 못했어요. 주소 <b>전체</b>가 들어갔는지 확인해주세요.<br>' +
          '유튜브 영상·라이브·쇼츠, 인스타그램 릴스·게시물만 등록할 수 있어요.';
        urlHint.style.color = '#c2410c';
      }
    }
    if (urlInput) {
      urlInput.addEventListener('input', refreshUrlHint);
      // 붙여넣기는 값이 반영되기 전에 이벤트가 오므로 한 박자 뒤에 다시 확인
      urlInput.addEventListener('paste', function() { setTimeout(refreshUrlHint, 0); });
    }

    document.getElementById('cancelRegisterLink').addEventListener('click', function(e) {
      e.preventDefault();
      exitPlacingMode();
      document.getElementById('modal').classList.remove('show');
      document.getElementById('modalBody').innerHTML = '';
    });

    document.getElementById('confirmRegisterBtn').addEventListener('click', function() {
      var title = document.getElementById('regTitle').value.trim();
      var url = document.getElementById('regUrl').value.trim();
      var info = extractContentInfo(url);

      if (!title) { document.getElementById('placeHint').textContent = '장소 이름을 입력해주세요.'; return; }
      if (!selectedCategory) { document.getElementById('placeHint').textContent = '어떤 콘텐츠인지 선택해주세요.'; return; }
      if (!info) { document.getElementById('placeHint').textContent = '링크를 알아보지 못했어요. 유튜브 영상·라이브·쇼츠, 인스타그램 릴스·게시물 주소를 통째로 붙여넣어 주세요.'; return; }

      var newSpot = { name: title, lat: pendingLatLng.lat, lng: pendingLatLng.lng, type: info.type, ownerId: myOwnerId, category: selectedCategory };
      var journeyInput = document.getElementById('regJourney').value.trim();
      if (journeyInput) newSpot.journey = journeyInput;
      newSpot.createdAt = firebase.firestore.FieldValue.serverTimestamp();
      if (info.type === 'youtube') newSpot.videoId = info.videoId;
      else newSpot.permalink = info.permalink;
      // 쇼츠처럼 세로 영상이면 표시할 때 9:16 틀로 그리기 위해 남겨둠(buildEmbedHtml 참고)
      if (info.vertical) newSpot.vertical = true;

      var confirmBtn = document.getElementById('confirmRegisterBtn');
      confirmBtn.disabled = true;
      confirmBtn.textContent = '등록 중...';

      db.collection('spots').add(newSpot).then(function() {
        exitPlacingMode(); // 등록 성공시에만 등록모드 종료
        document.getElementById('modal').classList.remove('show');
        document.getElementById('modalBody').innerHTML = '';
        showStatus('✅ "' + title + '" 등록 완료! 지도에서 확인해보세요 (모두에게 공유됩니다)');
      }).catch(function(err) {
        document.getElementById('placeHint').textContent = '등록 실패: ' + err.message;
        confirmBtn.disabled = false;
        confirmBtn.textContent = '등록하기';
      });
    });
  }

  // 4. 모달
  // CCTV 영상(hls.js)이 재생 중일 때 모달이 다른 내용으로 바뀌거나 닫히면 재생을 확실히
  // 멈추기 위한 핸들 - 안 멈추면 화면엔 안 보여도 백그라운드에서 계속 스트림을 받습니다.
  var currentCctvHls = null;
  var cctvImageRefreshTimer = null;
  var cctvLiveLimitTimer = null; // 제공기관이 건 시청 제한(제주 30초)용 // CCTV 정지영상 자동 새로고침 타이머 - 모달이 바뀌거나 닫히면 반드시 정리
  function stopCctvPlayback() {
    if (cctvLiveLimitTimer) { clearTimeout(cctvLiveLimitTimer); cctvLiveLimitTimer = null; }
    if (currentCctvHls) { currentCctvHls.destroy(); currentCctvHls = null; }
    if (cctvImageRefreshTimer) { clearInterval(cctvImageRefreshTimer); cctvImageRefreshTimer = null; }
  }

  // ================================================================
  // 실시간 인라인 재생 (ID 74, 2026-07)
  // 예전엔 cctvsec.ktict.co.kr이 CORS/혼합콘텐츠로 막힐 것으로 추정되어 비활성 상태로
  // 남겨뒀었으나, 실제 배포된 HTTPS 사이트에서 hls.js로 직접 테스트한 결과 정상 재생됨을
  // 확인함(2026-07) - 그래서 아래에서 활성화. onError 콜백: 그래도 특정 카메라/네트워크
  // 상황에서 재생이 실패할 수 있어(HLS fatal error 등), 호출부가 정지영상+새 창 링크로
  // 되돌아갈 수 있게 실패를 알려줌.
  var CCTV_LIVE_INLINE_ENABLED = true;
  // ⚠️ 2026-08 중요한 수정: 예전에는 hls.js가 치명적 오류를 한 번만 알려도 즉시
  // "이 카메라는 영상을 불러올 수 없습니다"로 넘어갔다. 그런데 실시간 스트림은 켜지는
  // 데 몇 초가 걸리고 그동안 조각이 아직 준비되지 않아 오류가 나는 일이 흔하다.
  // 실제로 제주 카메라가 "실패"로 표시된 뒤 화면을 그대로 두었더니 저절로 재생됐다.
  // hls.js에는 이런 경우를 위한 표준 복구 수단이 있는데 우리가 쓰지 않고 있었다.
  //   네트워크 오류 -> startLoad()로 다시 불러오기
  //   미디어 오류   -> recoverMediaError()로 디코더 복구
  // 몇 번 시도해도 안 될 때만 실패로 처리한다. 이 손해는 제주뿐 아니라 경기·UTIC
  // 도심·충주 등 모든 실시간 영상에 함께 있었다.
  var CCTV_LIVE_MAX_RETRY = 4;      // 네트워크 재시도 횟수
  var CCTV_LIVE_MAX_MEDIA_RETRY = 2; // 디코더 복구 횟수
  var CCTV_LIVE_RETRY_DELAY_MS = 1200;

  function playCctvLiveInline(streamUrl, videoEl, onError) {
    stopCctvPlayback();
    if (videoEl.canPlayType('application/vnd.apple.mpegurl')) {
      videoEl.src = streamUrl; // 사파리 - <video> 태그가 HLS를 자체 지원
      videoEl.play().catch(function() {});
      videoEl.onerror = function() { if (onError) onError(); };
    } else if (window.Hls && Hls.isSupported()) {
      var netRetry = 0, mediaRetry = 0, gaveUp = false;
      currentCctvHls = new Hls();
      currentCctvHls.loadSource(streamUrl);
      currentCctvHls.attachMedia(videoEl);
      currentCctvHls.on(Hls.Events.MANIFEST_PARSED, function() { videoEl.play().catch(function() {}); });
      currentCctvHls.on(Hls.Events.FRAG_LOADED, function() {
        // 조각이 하나라도 들어오면 시작에 성공한 것이므로 재시도 횟수를 되돌린다
        netRetry = 0; mediaRetry = 0;
      });
      currentCctvHls.on(Hls.Events.ERROR, function(evt, data) {
        if (!data || !data.fatal || gaveUp) return;
        var hls = currentCctvHls;
        if (!hls) return;
        if (data.type === Hls.ErrorTypes.NETWORK_ERROR && netRetry < CCTV_LIVE_MAX_RETRY) {
          netRetry++;
          console.warn('[CCTV] 영상 시작 대기 중 재시도 ' + netRetry + '/' + CCTV_LIVE_MAX_RETRY);
          setTimeout(function() { try { if (currentCctvHls === hls) hls.startLoad(); } catch (e) {} }, CCTV_LIVE_RETRY_DELAY_MS);
          return;
        }
        if (data.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetry < CCTV_LIVE_MAX_MEDIA_RETRY) {
          mediaRetry++;
          console.warn('[CCTV] 디코더 복구 시도 ' + mediaRetry + '/' + CCTV_LIVE_MAX_MEDIA_RETRY);
          try { hls.recoverMediaError(); } catch (e) {}
          return;
        }
        gaveUp = true;
        if (onError) onError();
      });
    } else if (onError) {
      onError(); // 이 브라우저는 HLS 재생 자체를 지원하지 않음 - 새 창 링크로 대체
    }
  }

  // iconDataUrl(선택): 제목 앞에 붙일 아이콘 이미지 주소(data: URL). 이모지 문자 대신
  // 이미지를 쓰는 이유는 위 weatherIconSvgDataUrl() 설명 참고 - 기기마다 다르게 보이는
  // 문제를 없애기 위함. title은 항상 텍스트로만 넣음(장소 이름 등 외부/사용자 유래
  // 문자열이 섞일 수 있어 HTML로 해석하지 않고 안전하게 처리 - innerHTML 주입 방지).
  // sheetMode=true면 상단 중앙 카드 대신 하단 바텀시트로 표시(ID 67 - 지도·핀 위치가
  // 계속 보여야 하는 등록폼 등에 사용). 생략하면 기존과 동일하게 기본(상단 카드) 모드.
  function openModal(title, bodyHtml, iconDataUrl, sheetMode) {
    stopCctvPlayback();
    // 그리드뷰(전국보기·구군검색)가 아닌 다른 정보창을 열 때는 항상 초기화 - 그리드뷰
    // 함수(openNationwideView 등)는 이 호출 직후 자기 자신을 다시 설정함(아래 참고).
    currentReopenFn = null;
    var content = document.getElementById('modalContent');
    // 새 정보창을 열 때마다 기본 위치(상단 중앙)로 되돌립니다. (이전에 드래그해 옮겨둔 위치는 초기화)
    content.style.left = '';
    content.style.top = '';
    content.style.transform = '';
    document.getElementById('modal').classList.toggle('sheet', !!sheetMode);
    document.getElementById('modal').classList.remove('peek');
    document.getElementById('restoreBar').classList.remove('show');
    var titleEl = document.getElementById('modalTitle');
    titleEl.innerHTML = ''; // 아이콘 유무와 무관하게 항상 비우고 다시 구성
    if (iconDataUrl) {
      var iconImg = document.createElement('img');
      iconImg.src = iconDataUrl;
      iconImg.alt = '';
      iconImg.style.cssText = 'width:18px;height:18px;vertical-align:-4px;margin-right:5px;';
      titleEl.appendChild(iconImg);
    }
    titleEl.appendChild(document.createTextNode(title)); // textNode라 title에 어떤 문자가 와도 HTML로 해석되지 않음
    document.getElementById('modalBody').innerHTML = bodyHtml;
    document.getElementById('modal').classList.add('show');
  }

  // ================================================================
  // 세션 중 확인한 CCTV 날씨 위치 기록 (ID 74 후속, 2026-07)
  // "여러 우산 아이콘을 열어보고 접었을 때, 그동안 확인한 곳을 한눈에 다시 볼 수
  // 있으면 좋겠다"는 요청으로 추가. 페이지를 새로고침하면 사라지는 세션 한정
  // 기록이고(서버에 저장하지 않음), 최근 확인한 순서대로 앞쪽에 쌓임.
  // ================================================================
  var cctvHistory = [];
  var CCTV_HISTORY_MAX = 12; // 너무 길어지면 가로 스크롤 목록이 무의미해져서 상한을 둠

  // ⚠️ 2026-07: 전국보기·구군검색(그리드뷰)을 접었다(🗺️ 지도만 보기) 다시 펼치면, 그
  // 그리드가 아니라 예전에 열어봤던 "다른" 개별 CCTV 기록(cctvHistory)이 뜨는 문제가
  // 실사용에서 발견됨 - 그리드뷰는 개별 CCTV 팝업과 다른 종류의 정보창이라 기존
  // cctvHistory 구조로는 표현이 안 됐던 것. 그래서 "지금 열려있는 게 그리드뷰라면 그걸
  // 다시 여는 함수"를 별도로 기억해뒀다가, 접기 버튼을 누르면 그 함수를 최우선으로
  // 보여주도록 분리함(renderRestoreBar 참고). 그리드뷰가 아닌 일반 정보창을 열 때는
  // openModal이 항상 null로 되돌림.
  var currentReopenFn = null;

  function recordCctvHistory(entry) {
    var key = entry.name + '|' + entry.lat.toFixed(5) + '|' + entry.lng.toFixed(5);
    cctvHistory = cctvHistory.filter(function(e) { return e.key !== key; }); // 같은 곳 재확인시 맨 앞으로 이동
    entry.key = key;
    cctvHistory.unshift(entry);
    if (cctvHistory.length > CCTV_HISTORY_MAX) cctvHistory.length = CCTV_HISTORY_MAX;
  }

  // 접기 버튼을 누른 시점의 상태로 하단 바를 다시 그림.
  // - 이번 세션에서 확인한 CCTV가 하나라도 있으면: 각각을 작은 썸네일 칩으로 나열(가로 스크롤).
  //   칩을 누르면 그 위치를 다시 엶 - 여러 지역 날씨를 훑어보는 "개요" 용도.
  // - CCTV 기록이 없으면(예: 다른 종류의 정보창을 접은 경우): 기존처럼 단순 "다시 보기" 버튼 하나만.
  function renderRestoreBar() {
    var bar = document.getElementById('restoreBar');
    bar.innerHTML = '';
    if (currentReopenFn) {
      // 전국보기·구군검색 같은 그리드뷰가 열려있다가 최소화된 경우 - 개별 CCTV
      // 기록(cctvHistory)과는 별개로, "보던 그리드뷰 그대로 다시 열기" 칩 하나만 보여줌.
      // (openModal이 내부에서 peek 해제·restoreBar 숨김을 처리하므로 여기서 따로 안 해도 됨)
      var gridBtn = document.createElement('button');
      gridBtn.className = 'restoreChip simple';
      gridBtn.textContent = '🗂️ 보던 화면 다시 보기';
      gridBtn.addEventListener('click', function() {
        currentReopenFn();
      });
      bar.appendChild(gridBtn);
      return;
    }
    if (cctvHistory.length === 0) {
      var simpleBtn = document.createElement('button');
      simpleBtn.className = 'restoreChip simple';
      simpleBtn.textContent = '🧭 목록 다시 보기';
      simpleBtn.addEventListener('click', function() {
        document.getElementById('modal').classList.remove('peek');
        bar.classList.remove('show');
      });
      bar.appendChild(simpleBtn);
      return;
    }
    cctvHistory.forEach(function(entry) {
      var chip = document.createElement('button');
      chip.className = 'restoreChip';
      chip.title = entry.name; // 글자 라벨 대신 마우스오버 툴팁으로 - 좁은 칸에 이름이 잘려 보이던 문제 해결
      var thumb = document.createElement('img');
      thumb.src = entry.imageUrl || weatherIconSvgDataUrl();
      thumb.alt = entry.name;
      thumb.onerror = function() { thumb.src = weatherIconSvgDataUrl(); }; // 사진 로드 실패시 우산 아이콘으로 대체
      chip.appendChild(thumb);
      chip.addEventListener('click', function() {
        bar.classList.remove('show');
        openCctvPopup(entry);
      });
      bar.appendChild(chip);
    });
  }

  document.getElementById('minimizeBtn').addEventListener('click', function() {
    stopCctvPlayback(); // 접었을 때 백그라운드에서 영상이 계속 재생/새로고침되지 않도록 정지
    document.getElementById('modal').classList.add('peek');
    renderRestoreBar();
    document.getElementById('restoreBar').classList.add('show');
  });
  document.getElementById('closeBtn').addEventListener('click', function() {
    stopCctvPlayback();
    document.getElementById('modal').classList.remove('show');
    document.getElementById('modalBody').innerHTML = '';
    document.getElementById('restoreBar').classList.remove('show');
    clearJourneyPolyline();
  });

  // 정보창 드래그 이동 기능 (접어두기 외 추가 기능)
  // 헤더(⠿ 아이콘·제목 영역)를 마우스/터치로 잡고 끌면 정보창을 화면 어디로든 옮길 수 있습니다.
  // 지도(경로)와 정보창(일정 목록)을 동시에 보고 싶을 때, 정보창을 경로가 가려지지 않는 자리로 옮겨두면 됩니다.
  (function enableModalDrag() {
    var content = document.getElementById('modalContent');
    var handle = document.getElementById('modalHeader');
    var dragging = false, offsetX = 0, offsetY = 0;

    function startDrag(clientX, clientY) {
      var rect = content.getBoundingClientRect();
      dragging = true;
      offsetX = clientX - rect.left;
      offsetY = clientY - rect.top;
      content.style.transform = 'none';
      content.style.left = rect.left + 'px';
      content.style.top = rect.top + 'px';
      content.classList.add('dragging');
    }
    function moveDrag(clientX, clientY) {
      if (!dragging) return;
      var w = content.offsetWidth, h = content.offsetHeight;
      var maxX = Math.max(0, window.innerWidth - w);
      var maxY = Math.max(0, window.innerHeight - h);
      var x = Math.min(Math.max(0, clientX - offsetX), maxX);
      var y = Math.min(Math.max(0, clientY - offsetY), maxY);
      content.style.left = x + 'px';
      content.style.top = y + 'px';
    }
    function endDrag() {
      dragging = false;
      content.classList.remove('dragging');
    }

    // 바텀시트 모드(ID 67 등록폼)는 화면 하단에 고정해두는 게 목적이라 드래그로 옮길 수
    // 있으면 오히려 취지에 어긋남 - sheet 모드일 때는 드래그 시작 자체를 막음.
    function isSheetMode() { return document.getElementById('modal').classList.contains('sheet'); }

    handle.addEventListener('mousedown', function(e) {
      if (e.target.closest('button')) return; // 버튼(닫기·접어두기) 클릭은 드래그로 처리하지 않음
      if (isSheetMode()) return;
      startDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!dragging) return;
      moveDrag(e.clientX, e.clientY);
      e.preventDefault();
    });
    document.addEventListener('mouseup', endDrag);

    handle.addEventListener('touchstart', function(e) {
      if (e.target.closest('button')) return;
      if (isSheetMode()) return;
      var t = e.touches[0];
      startDrag(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('touchmove', function(e) {
      if (!dragging) return;
      var t = e.touches[0];
      moveDrag(t.clientX, t.clientY);
    }, { passive: true });
    document.addEventListener('touchend', endDrag);
    document.addEventListener('touchcancel', endDrag);
  })();
</script>
